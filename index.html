/* ═══════════════ RAISE LIGHTHOUSE ═══════════════ */
document.getElementById('raise-btn').addEventListener('click', function() {
  if (state.waveActive || state.gameOver || !state.firstColony) return;
  var dueC = CFG.INTRO_REST + state.wave * CFG.SLOT_LEN;
  if (state.clock >= dueC) { startWave(); return; } /* время уже пришло — сразу волна */
  /* Фиксируем бонус по ОСТАВШЕМУСЯ времени: чем раньше отдохнул — тем больше */
  var cycleLen = 2 * CFG.SLOT_LEN;
  var rem = (dueC - state.clock) / cycleLen;
  state.restBonus = rem < 0 ? 0 : (rem > 0.9 ? 0.9 : rem);
  state.resting = true; /* перемотка погоды/времени/облаков к волне (см. update) */
});

/* ═══════════════ GAME OVER ═══════════════ */
document.getElementById('restart-btn').addEventListener('click', function() {
  document.getElementById('game-over-overlay').classList.remove('open');
  resetGame();
});

function resetGame() {
  for (var i = 0; i < state.enemies.length; i++) {
    try { world.destroyBody(state.enemies[i].body); } catch(_e) { /* noop */ }
  }
  for (var j = 0; j < state.projectiles.length; j++) {
    try { world.destroyBody(state.projectiles[j].body); } catch(_e) { /* noop */ }
  }
  deferredBodies.length = 0;
  deferredDestroy.length = 0;
  craters.length = 0;
  plateDebris.length = 0;
  shrapnel.length = 0;
  /* Пересоздаём облака заново */
  initCloudMap(W, H);
  accumulator = 0; // Сбрасываем накопитель времени
  state = freshState();
  state.lighthouse.x = CFG.WORLD_W / 2;
  state.lighthouse.y = worldH - CFG.BASE_OFFSET - CFG.LIGHTHOUSE_OFFSET;
  _surfCvs = null;
  cityQueue = [];
  cityFrozen = [];
  destructionCraters = [];
  explosionBolts = [];
  cityTier = -1;
  buildAmmoBar();
  updateHUD();
  /* Автоколонизация (кнопка COLONIZE временно скрыта) */
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1;
  tutStart();
}

/* ═══════════════ GAME LOOP ═══════════════ */
var lastTime = 0;
var accumulator = 0;
var FIXED_DT = 1/60; // Фиксированный временной шаг 60 FPS
function gameLoop(timestamp) {
  var frameTime = Math.min((timestamp - lastTime) / 1000, 0.25);
  lastTime = timestamp;
  accumulator += frameTime;

  if (scale > 0 && isFinite(worldH)) {
    // Обновляем игру с фиксированным шагом
    while (accumulator >= FIXED_DT) {
      update(FIXED_DT);
      accumulator -= FIXED_DT;
    }
    render();
  }
  requestAnimationFrame(gameLoop);
}

/* ═══════════════ TUTORIAL SEQUENCE ═══════════════ */
/*
  Живая шкала натяжения. Показывает текущий уровень в реальном времени.
  Двигается туда-сюда: натянул на 100% — сердечки, вернул на 30% — обратно MORE.
  Бонус фиксируется в момент отпускания (onUp), до сброса dragging.

  Уровни:
    0-19%  ⏬ DRAG ⏬
   20-39%  ⏬ MORE ⏬
   40-79%  ✅ ✅       (+50 ⚡ при выстреле)
   80-100% 💚 💚       (+99 ⚡ при выстреле)
*/
var _tut = { state: 'off', el: null, txt: null, pendingBonus: 0, dragShown: false, conditionTimer: 0, blinkTimer: 0 };

function _tutEl() {
  if (!_tut.el) {
    _tut.el = document.getElementById('tut-prompt');
    _tut.txt = _tut.el.querySelector('.tp-text');
  }
  return _tut.el;
}

function _tutShow(html, green) {
  var el = _tutEl();
  _tut.txt.innerHTML = html;
  el.classList.toggle('green', !!green);
  el.classList.add('visible');
}

function _tutHide() {
  _tutEl().classList.remove('visible');
}

function _tutPos() {
  var el = _tutEl();
  if (!state || !state.lighthouse) return;
  var lh = state.lighthouse;
  var sx = lh.x * scale;
  var sy = lh.y * scale;
  var above = 0.7 * lhScale * 6 + 40;
  el.style.left = sx + 'px';
  el.style.top = (sy - above) + 'px';
}

function _tutDragPct() {
  if (!state.dragCurrent) return 0;
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var dx = lh.x - dc.x, dy = lh.y - dc.y;
  return Math.min(Math.sqrt(dx * dx + dy * dy) / CFG.DRAG_MAX, 1);
}

function tutReset() {
  _tut.state = 'off';
  _tut.pendingBonus = 0;
  _tut.dragShown = false;
  _tut.conditionTimer = 0;
  _tut.blinkTimer = 0;
  _tutHide();
}

function tutStart() {
  _tut.state = 'hold';
  _tut.pendingBonus = 0;
  _tut.dragShown = false;
  _tut.conditionTimer = 0;
  _tut.blinkTimer = 0;
  _tutPos();
  _tutShow('HOLD');
}

function tutFinish() {
  _tut.state = 'finished';
  _tutHide();
}

/* onDown — юзер схватил маяк → сразу DRAG (без задержки) */
function tutOnHold() {
  if (_tut.state !== 'hold') return;
  _tut.state = 'active';
  if (!_tut.dragShown) {
    _tut.dragShown = true;
    state.energy += 1; /* бонус за первое перетаскивание */
  }
  _tutShow('<span class="emoji-pink">⏬</span> DRAG <span class="emoji-pink">⏬</span>');
}

/* Каждый кадр: живая шкала */
function tutUpdate(dt) {
  if (_tut.state === 'off' || _tut.state === 'finished' || _tut.state === 'fired') return;
  _tutPos();

  if (_tut.state === 'hold') return; /* ждём захвата */

  if (_tut.state === 'active') {
    if (!state.dragging) {
      _tut.state = 'hold';
      _tut.conditionTimer = 0;
      _tutShow('HOLD');
      return;
    }
    var pct = _tutDragPct();
    var conditionsMet = (pct >= 0.4);

    if (conditionsMet) {
      _tut.conditionTimer += dt;
      if (_tut.conditionTimer >= 3) {
        _tut.state = 'blink';
        _tut.blinkTimer = 0;
        return;
      }
    } else {
      _tut.conditionTimer = 0;
    }

    if (pct >= 0.8) {
      _tutShow('<span class="emoji-green">💚</span> <span class="emoji-green">💚</span>', true);
    } else if (pct >= 0.4) {
      _tutShow('✅ ✅');
    } else if (pct >= 0.2) {
      _tutShow('<span class="emoji-pink">⏬</span> MORE <span class="emoji-pink">⏬</span>');
    } else {
      _tutShow('<span class="emoji-pink">⏬</span> DRAG <span class="emoji-pink">⏬</span>');
    }
    return;
  }

  if (_tut.state === 'blink') {
    if (!state.dragging) {
      _tut.state = 'hold';
      _tut.conditionTimer = 0;
      _tut.blinkTimer = 0;
      _tutShow('HOLD');
      return;
    }
    var pct2 = _tutDragPct();
    if (pct2 < 0.4) {
      _tut.state = 'active';
      _tut.conditionTimer = 0;
      _tut.blinkTimer = 0;
      return;
    }
    _tut.blinkTimer += dt;
    var phase = Math.floor(_tut.blinkTimer * 2.5) % 2;
    _tutShow(phase === 0 ? 'JUST' : 'RELEASE');
    return;
  }
}

/*
  Вызывается из onUp ДО state.dragging=false,
  чтобы зафиксировать бонус по текущему натяжению.
  Если условия выполнены — скрываем плашку и переходим в 'fired'.
*/
function tutOnRelease() {
  if (_tut.state !== 'active' && _tut.state !== 'blink') return;
  var pct = _tutDragPct();
  if (pct >= 0.8) {
    _tut.pendingBonus = 99;
  } else if (pct >= 0.4) {
    _tut.pendingBonus = 50;
  } else {
    _tut.pendingBonus = 0;
  }
  /* Если условия выполнены (✅✅ или 💚💚) ИЛИ отпустили во время JUST|RELEASE — скрываем */
  if (_tut.pendingBonus > 0 || _tut.state === 'blink') {
    _tut.state = 'fired';
    _tutHide();
  }
}

/* Вызывается при попадании (firstColony). Возвращает бонус. */
function tutOnFire() {
  if (_tut.state === 'off' || _tut.state === 'finished') return 0;
  var bonus = _tut.pendingBonus;
  _tut.pendingBonus = 0;
  if (bonus > 0) {
    state.energy += bonus;
  }
  return bonus;
}

/* ═══════════════ COLONIZE BUTTON ═══════════════ */
document.getElementById('colonize-btn').addEventListener('click', function() {
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1; /* стартовая энергия */
  /* Скрываем оверлей колонизации */
  document.getElementById('colonize-overlay').classList.add('hidden');
  /* Запускаем туториал */
  tutStart();
  /* Показываем HUD — но только базовый, магазин появится после первой колонии */
  document.getElementById('hud').style.opacity = '1';
  document.getElementById('ammo-bar').style.opacity = '1';
  document.getElementById('shop-btn').style.opacity = '0';
});

/* ═══════════════ INIT ═══════════════ */
function init() {
  canvas = document.getElementById('game');
  state = freshState();
  resizeCanvas();
  initWorld();
  initInput();
  buildAmmoBar();
  updateHUD();
  /* Автоколонизация при старте (кнопка COLONIZE временно скрыта) */
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1;
  tutStart();
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(event) {
    if (event.matches) { document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }
  });
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(function(t) { lastTime = t; requestAnimationFrame(gameLoop); });
}

init();
})();
</script>
