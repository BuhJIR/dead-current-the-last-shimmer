function drawLighthouse() {
  var lh = state.lighthouse;
  var sc = toScreen(lh.x, lh.y);
  var sx = sc[0], sy = sc[1];
  var r = 0.7 * lhScale;
  var pulse = Math.sin(state.lighthousePulse) * 0.15 + 1;
  var ammoColor = getActiveAmmoColor();

  /* Outer glow — ammo colored */
  var glow = ctx.createRadialGradient(sx, sy, r * 0.2, sx, sy, r * 2.8 * pulse);
  glow.addColorStop(0, hexToRgba(ammoColor, 0.15));
  glow.addColorStop(0.5, hexToRgba(ammoColor, 0.04));
  glow.addColorStop(1, hexToRgba(ammoColor, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, r * 2.8 * pulse, 0, TAU);
  ctx.fill();

  /* Луч маяка теперь рисуется внутри renderCloudsToCtx (попиксельно окрашивает облака) */

  /* Красная заливка лучей — сами лучи прозрачны, ночью дальше и ярче (плавно) */
  if (state.colonized) {
    var nfLh = state.nightFactor || 0;
    var isNightLh = nfLh > 0.5;
    var reachLh = 1.25 + nfLh * 0.55;
    var beamRot = state.time * 0.45; /* вращение на 25% медленнее */
    var scanAngle = 0.25;
    var scanLen = r * CFG.SCANNER_RANGE_MULT * 5.4 * reachLh; /* дальность значительно больше */
    var t = state.basePulse;
    var beamAlpha = (0.075 + nfLh * 0.055) + Math.sin(t) * 0.025;

    for (var bi = 0; bi < 2; bi++) {
      var bAngle = beamRot + bi * PI;
      var bx1 = Math.cos(bAngle - scanAngle) * scanLen;
      var by1 = Math.sin(bAngle - scanAngle) * scanLen;
      var bx2 = Math.cos(bAngle + scanAngle) * scanLen;
      var by2 = Math.sin(bAngle + scanAngle) * scanLen;

      var bg = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, scanLen);
      bg.addColorStop(0, 'rgba(255,40,74,' + beamAlpha + ')');
      bg.addColorStop(0.55, 'rgba(255,23,68,' + (beamAlpha * 0.5) + ')');
      bg.addColorStop(1, 'rgba(255,23,68,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + bx1, sy + by1);
      ctx.lineTo(sx + bx2, sy + by2);
      ctx.closePath();
      ctx.fill();
    }

    /* Яркое горячее ядро у основания луча — «прожектор» смотрится дороже */
    var coreLen = scanLen * 0.34;
    var coreA = 0.28 * scanAngle;
    for (var bj = 0; bj < 2; bj++) {
      var ca = beamRot + bj * PI;
      var cg2 = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, coreLen);
      cg2.addColorStop(0, 'rgba(255,120,140,' + (beamAlpha * 1.6) + ')');
      cg2.addColorStop(1, 'rgba(255,40,74,0)');
      ctx.fillStyle = cg2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ca - coreA) * coreLen, sy + Math.sin(ca - coreA) * coreLen);
      ctx.lineTo(sx + Math.cos(ca + coreA) * coreLen, sy + Math.sin(ca + coreA) * coreLen);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* Draw lighthouse image */
  if (lighthouseImgLoaded && lighthouseImg) {
    var imgSize = r * 4;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.drawImage(lighthouseImg, -imgSize/2, -imgSize/2, imgSize, imgSize);
    ctx.restore();
  } else {
    /* Fallback: simple circle while image loads */
    ctx.fillStyle = '#0a1118';
    ctx.strokeStyle = ammoColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
    ctx.stroke();
  }

  /* Tesla coil indicator */
  if (perkLvl('tesla') > 0) {
    ctx.strokeStyle = hexToRgba('#b388ff', 0.15 + Math.sin(state.time * 8) * 0.1);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(sx, sy, r * 2.2, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Charge ring — overcharge aware */
  if (state.dragging && state.charge > 0) {
    var maxCharge2 = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
    var chargeRatio = state.charge / maxCharge2;
    ctx.strokeStyle = 'rgba(255,' + Math.floor(171 * (1 - chargeRatio)) + ',0,0.85)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(sx, sy, r + 10, -PI / 2, -PI / 2 + chargeRatio * TAU);
    ctx.stroke();
  }

}

function drawAimLine() {
  if (!state.dragging || !state.dragCurrent) return;
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var scLH = toScreen(lh.x, lh.y);
  var scDC = toScreen(dc.x, dc.y);

  /* Вектор направления выстрела (от пальца К маяку = направление снаряда) */
  var dx = lh.x - dc.x;
  var dy = lh.y - dc.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.1) return;

  var nx = dx / dist;
  var ny = dy / dist;

  /* Вычисляем скорость снаряда как при выстреле */
  var dragMax = state.waveActive ? 14 : CFG.DRAG_MAX;
  var maxVel = 18 + cityAgg().plant;
  var speed = Math.min(dist * CFG.VEL_FACTOR, maxVel);

  /* Damping как при выстреле */
  var rangeLvl = perkLvl('range');
  var baseDamping = 0.8;
  if (rangeLvl === 1) baseDamping = 0.5;
  else if (rangeLvl === 2) baseDamping = 0.2;

  /* Дальность полёта: d = v0/damping * (1 - e^(-damping * lifetime)) */
  var lifetime = CFG.PROJ_LIFETIME;
  var flyDist = speed / baseDamping * (1 - Math.exp(-baseDamping * lifetime));

  /* Переводим мировое расстояние в экранное */
  var lineLength = flyDist * scale;

  /* Линия идёт от маяка в направлении выстрела */
  var scLHx = scLH[0], scLHy = scLH[1];
  var sx1 = scLHx;
  var sy1 = scLHy;
  var sx2 = scLHx + nx * lineLength;
  var sy2 = scLHy + ny * lineLength;

  /* Линия прицела - стиль как у reactor zone */
  var alpha = 0.5 + Math.sin(state.time * 2) * 0.2;
  ctx.save();
  ctx.strokeStyle = 'rgba(120, 20, 20, ' + alpha + ')';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 9]);
  ctx.lineDashOffset = -state.time * 35; /* анимация движения пунктира */
  ctx.beginPath();
  ctx.moveTo(sx1, sy1);
  ctx.lineTo(sx2, sy2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAimUI() {
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var sc1 = toScreen(lh.x, lh.y);
  var sx = sc1[0], sy = sc1[1];
  var ammo = AMMO[state.selectedAmmo];
  var col = ammo.color;

  /* Вычисляем радиус снаряда как при выстреле */
  var r = CFG.PROJ_RADIUS * (ammo.id === 'explosive' ? 1.4 : ammo.id === 'scatter' ? 1.2 : ammo.id === 'piercing' ? 0.9 : 1);

  /* Вычисляем текущий заряд от 0 до 1 */
  var maxCharge = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
  var chargeRatio = Math.min(state.charge / maxCharge, 1);

  /* Пересоздаём снаряд если сменился тип боеприпаса или сильно изменился заряд */
  var needRecreate = !state.previewProj || state.previewProj.ammo !== ammo;
  if (state.previewProj && state.previewProj.lastChargeRatio !== undefined) {
    var chargeDiff = Math.abs(chargeRatio - state.previewProj.lastChargeRatio);
    /* Пересоздать если заряд перешёл порог (каждые ~17% для смены количества молний) */
    if (chargeDiff > 0.08) needRecreate = true;
  }

  if (needRecreate) {
    state.previewProj = {
      radius: r,
      ammo: ammo,
      plasmaParticles: [],
      plasmaNodes: [],
      lastChargeRatio: chargeRatio
    };
    initProjectilePlasma(state.previewProj, chargeRatio);
  }

  /* Обновляем плазму preview снаряда */
  updateProjectilePlasma(state.previewProj);

  /* Рисуем плазменные молнии 1в1 как у летящего снаряда */
  drawProjectilePlasma(ctx, sx, sy, state.previewProj);

  /* Ядро/капсула 1в1 как у летящего снаряда */
  var coreR = r * scale * 0.55;
  var coreGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, col);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(sx, sy, coreR, 0, TAU);
  ctx.fill();
}

function drawLightningArcs() {
  for (var i = 0; i < state.lightningArcs.length; i++) {
    var arc = state.lightningArcs[i], a = arc.life / 0.3;
    var s1 = toScreen(arc.x1, arc.y1), s2 = toScreen(arc.x2, arc.y2);
    /* Используем цвет из объекта, если есть, иначе дефолтный голубой */
    var arcColor = arc.color || '#64c8ff';
    ctx.strokeStyle = hexToRgba(arcColor, Math.min(a, 0.8));
    ctx.lineWidth = 2 * a;
    ctx.beginPath();
    ctx.moveTo(s1[0], s1[1]);
    var segs = 4;
    for (var j = 1; j <= segs; j++) {
      var t = j / segs;
      var mx = s1[0] + (s2[0] - s1[0]) * t;
      var my = s1[1] + (s2[1] - s1[1]) * t;
      if (j < segs) { mx += (Math.random() - 0.5) * 12 * a; my += (Math.random() - 0.5) * 12 * a; }
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
  }

  /* Молнии взрывов */
  for (var ei = 0; ei < explosionBolts.length; ei++) {
    var bolt = explosionBolts[ei];
    var aVal = bolt.life / bolt.maxLife;
    var sc = toScreen(bolt.wx, bolt.wy);

    ctx.strokeStyle = bolt.color;
    ctx.lineWidth = 0.8 + aVal * 0.7;
    ctx.shadowColor = bolt.color;
    ctx.shadowBlur = 12 * aVal;
    ctx.globalAlpha = aVal * 0.9;

    ctx.beginPath();
    ctx.moveTo(sc[0], sc[1]);
    for (var si = 0; si < bolt.segments.length; si++) {
      var seg = bolt.segments[si];
      ctx.lineTo(sc[0] + seg.x2 * scale, sc[1] + seg.y2 * scale);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawSingularities() {
  for (var i = 0; i < state.singularities.length; i++) {
    var s = state.singularities[i], ratio = s.life / s.maxLife;
    var sc = toScreen(s.x, s.y), sx = sc[0], sy = sc[1], r = 3.5 * scale * ratio;
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0, 'rgba(100,0,200,' + (0.4 * ratio) + ')');
    g.addColorStop(0.4, 'rgba(50,0,100,' + (0.2 * ratio) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,136,255,' + (0.5 * ratio) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.5, state.time * 3, state.time * 3 + PI * 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.3, state.time * -5, state.time * -5 + PI);
    ctx.stroke();
  }
}

function drawEnemies() {
  for (var i = 0; i < state.enemies.length; i++) {
    var e = state.enemies[i];
    if (e.deathTimer >= 0 && !e.alive) {
      var alpha = Math.max(0, e.deathTimer / 0.45);
      drawEnemyBody(e, alpha, 1 + (1 - alpha) * 0.4);
      continue;
    }
    if (!e.alive) continue;
    /* Lv.2 Scout Flicker: alpha=0.3 when flickering */
    var flickerAlpha = (e.type === 'scout' && e.level === 2 && e.flickering) ? 0.3 : 1;
    drawEnemyBody(e, flickerAlpha, 1);
  }
}

function drawPlateDebris() {
  for (var i = 0; i < plateDebris.length; i++) {
    var d = plateDebris[i];
    var sc = toScreen(d.x, d.y);
    ctx.save();
    ctx.translate(sc[0], sc[1]);
    ctx.rotate(d.angle);
    ctx.globalAlpha = Math.max(0, d.life / 0.9) * 0.9;
    ctx.fillStyle = d.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1.5;
    var w = d.w * scale, h = d.h * scale;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawShrapnel() {
  if (shrapnel.length === 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < shrapnel.length; i++) {
    var s = shrapnel[i];
    var sc = toScreen(s.x, s.y);
    var r = 2.2 + (s.life > 0.4 ? 1.5 : 0);
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(sc[0], sc[1], r, 0, TAU); ctx.fill();
    /* короткий хвост */
    ctx.strokeStyle = hexToRgba(s.color, 0.5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sc[0], sc[1]); ctx.lineTo(sc[0] - s.vx * scale * 0.04, sc[1] - s.vy * scale * 0.04); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemyBody(e, alpha, scaleMul) {
  var pos = e.body.getPosition();
  var angle = e.body.getAngle();
  var sc = toScreen(pos.x, pos.y);
  var sx = sc[0], sy = sc[1];
  /* ФАЗА 12: size×1.1 для Lv.2 */
  var lvlSizeMult = (e.level === 2) ? 1.1 : 1.0;
  var r = e.def.r * scale * scaleMul * lvlSizeMult;
  var sides = e.def.sides;

  /* Walking bob */
  var bobOffset = 0;
  if (e.alive && !e.frozen) {
    bobOffset = Math.abs(Math.sin(e.stepBob)) * r * 0.08;
  }
  sy -= bobOffset;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;

  /* Shield aura */
  if (e.shielded && alpha === 1) {
    ctx.strokeStyle = 'rgba(255,214,0,0.35)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, r + 5, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Frozen overlay */
  if (e.frozen) {
    ctx.fillStyle = 'rgba(128,222,234,0.15)';
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, TAU);
    ctx.fill();
  }

  /* Халфтрак — спрайт (наземный корпус, лёгкая покадровая тряска) */
  if (e.type === 'halftrack') {
    var htMeta = ASSET_DATA['halftrack'];
    var htFrame = Math.floor(state.time * 4) % ((htMeta && htMeta.frames) || 2);
    var htScale = (r * 2.8) / ((htMeta && htMeta.fh) || 86);
    ctx.rotate(-angle); /* спрайт всегда «лицом» вниз, без вращения тела */
    if (e.flashTimer > 0) ctx.globalAlpha = alpha * 0.6;
    if (drawSpriteFrame('halftrack', htFrame, 0, 0, 0, htScale, 0.5)) {
      ctx.globalAlpha = alpha;
      var mhp = e.maxHp || e.hp;
      if (alpha === 1 && e.hp < mhp) {
        var hbw = r * 2.2, hpf = Math.max(0, e.hp / mhp);
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-hbw / 2, -r * 2.0, hbw, 3);
        ctx.fillStyle = hpf > 0.5 ? '#4caf50' : (hpf > 0.25 ? '#ffab00' : '#ff1744');
        ctx.fillRect(-hbw / 2, -r * 2.0, hbw * hpf, 3);
      }
      ctx.globalAlpha = 1; ctx.restore(); return;
    }
    ctx.rotate(angle); /* спрайт не загружен — вернём поворот, рисуем полигон */
  }

  var color = e.def.color;
  /* Ночью инвертируем цвет врагов */
  if (state.wave % 2 === 0) {
    var cc = color.replace('#','');
    if (cc.length === 3) cc = cc[0]+cc[0]+cc[1]+cc[1]+cc[2]+cc[2];
    var cr = 255 - parseInt(cc.substring(0,2),16);
    var cg = 255 - parseInt(cc.substring(2,4),16);
    var cb = 255 - parseInt(cc.substring(4,6),16);
    color = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
  }
  if (e.flashTimer > 0) color = '#ffffff';

  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1.5;

  if (sides === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.4, 0);
    ctx.moveTo(0, -r*0.4); ctx.lineTo(0, r*0.4);
    ctx.stroke();
  } else if (e.type === 'armor' || e.type === 'barrel') {
    /* Осевой квадрат (совпадает с физ. Box и боковыми пластинами) */
    var hb = r * 0.85;
    ctx.fillRect(-hb, -hb, hb * 2, hb * 2);
    ctx.strokeRect(-hb, -hb, hb * 2, hb * 2);
  } else if (e.type === 'berserker') {
    /* Зубчатый ромб */
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(r*0.7, 0); ctx.lineTo(0, r); ctx.lineTo(-r*0.7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    /* Rage визуалы */
    if (e.rageSpeed > 1.0 && alpha === 1) {
      var rageLevel = (e.rageSpeed - 1.0) / 1.5; /* 0..1 */

      /* Трещины на теле */
      if (rageLevel > 0.1) {
        ctx.strokeStyle = 'rgba(255,255,100,' + (rageLevel * 0.8) + ')';
        ctx.lineWidth = 1.5;
        for (var ci = 0; ci < 4; ci++) {
          var ca = (ci / 4) * TAU;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ca) * r * 0.6, Math.sin(ca) * r * 0.6);
          ctx.stroke();
        }
      }

      /* Пульсирующий glow при 1.5+ */
      if (rageLevel >= 0.33) {
        var breathe = 0.5 + Math.sin(state.time * 8) * 0.5;
        ctx.strokeStyle = 'rgba(255,100,0,' + (breathe * rageLevel * 0.6) + ')';
        ctx.lineWidth = 2 + breathe * 2;
        ctx.shadowColor = 'rgba(255,100,0,0.6)';
        ctx.shadowBlur = 10 * breathe;
        ctx.beginPath();
        ctx.arc(0, 0, r + 4 + breathe * 3, 0, TAU);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      /* Пламя при 2.0+ */
      if (rageLevel >= 0.67) {
        ctx.shadowColor = 'rgba(255,50,0,0.8)';
        ctx.shadowBlur = 15;
        for (var fi = 0; fi < 6; fi++) {
          var fa = (fi / 6) * TAU + state.time * 3;
          var flicker = Math.sin(state.time * 10 + fi) * 0.3 + 0.7;
          var fx = Math.cos(fa) * (r + 5 + flicker * 5);
          var fy = Math.sin(fa) * (r + 5 + flicker * 5);
          ctx.fillStyle = 'rgba(255,' + Math.floor(100 + flicker * 50) + ',0,' + (flicker * 0.7) + ')';
          ctx.beginPath();
          ctx.arc(fx, fy, 2 + flicker * 2, 0, TAU);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
    }
  } else if (e.type === 'scout') {
    /* Вытянутый треугольник с neon glow */
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.4);
    ctx.lineTo(r * 0.6, r * 0.7);
    ctx.lineTo(-r * 0.6, r * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
  } else {
    ctx.beginPath();
    for (var si = 0; si < sides; si++) {
      var a = (si / sides) * TAU - PI / 2;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  /* Красное ядро бочки */
  if (e.type === 'barrel') {
    ctx.fillStyle = 'rgba(255,40,40,0.9)';
    ctx.shadowColor = '#ff2b2b'; ctx.shadowBlur = 8 + Math.sin(state.time * 6) * 4;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,180,0,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.stroke();
  }

  /* Броневые пластины по сторонам (сколько осталось слоёв) */
  if (e.plates) {
    for (var pside = 0; pside < 4; pside++) {
      var pc = e.plates[pside]; if (pc <= 0) continue;
      for (var lyr = 0; lyr < pc; lyr++) {
        var off = r * (0.92 + lyr * 0.22);
        ctx.save();
        if (pside === 0) ctx.translate(0, -off);
        else if (pside === 1) { ctx.translate(off, 0); ctx.rotate(PI / 2); }
        else if (pside === 2) ctx.translate(0, off);
        else { ctx.translate(-off, 0); ctx.rotate(PI / 2); }
        var pw = r * 1.5, ph = r * 0.28;
        ctx.fillStyle = lyr === 0 ? '#b0bec5' : '#78909c';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.5;
        ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
        ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
        /* заклёпки */
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.arc(-pw * 0.35, 0, 1.2, 0, TAU); ctx.arc(pw * 0.35, 0, 1.2, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }

  /* Пламя на горящем враге (в его цвете) */
  if (e.burning && alpha === 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var fl = 0.6 + Math.sin(state.time * 14 + e.wobblePhase) * 0.4;
    ctx.shadowColor = e.burnColor; ctx.shadowBlur = 12 * fl;
    ctx.fillStyle = hexToRgba(e.burnColor, 0.5);
    for (var bf = 0; bf < 5; bf++) {
      var ba = (bf / 5) * TAU + state.time * 4;
      var brr = r * (0.7 + fl * 0.5);
      ctx.beginPath();
      ctx.arc(Math.cos(ba) * r * 0.4, Math.sin(ba) * r * 0.4 - r * 0.3, brr * 0.35, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* Lv.1 Scout Dodge: ghost trail */
  if (e.type === 'scout' && e.level === 1 && e.dodgeCooldown > 0 && e.dodgeDir && alpha === 1) {
    var trailAlpha = e.dodgeCooldown / 1.5;
    ctx.globalAlpha = trailAlpha * 0.4;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    for (var ti = 1; ti <= 3; ti++) {
      var tOffset = ti * r * 0.5;
      ctx.save();
      ctx.translate(-e.dodgeDir.x * tOffset, -e.dodgeDir.y * tOffset);
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.lineTo(r * 0.6, r * 0.7);
      ctx.lineTo(-r * 0.6, r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha;
  }

  /* Lv.2 Scout Flicker: glitch effect */
  if (e.type === 'scout' && e.level === 2 && e.flickering && alpha === 1) {
    ctx.globalAlpha = 0.5;
    for (var gi = 0; gi < 3; gi++) {
      var gOffset = (Math.random() - 0.5) * r * 0.3;
      ctx.save();
      ctx.translate(gOffset, gOffset);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.lineTo(r * 0.6, r * 0.7);
      ctx.lineTo(-r * 0.6, r * 0.7);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = alpha;
  }

  /* Soldier crosshair (крест-визир) */
  if (e.type === 'soldier') {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.4, 0);
    ctx.moveTo(0, -r*0.4); ctx.lineTo(0, r*0.4);
    ctx.stroke();
  }

  /* Lv.1 Soldier Formation lines (линии связи к союзникам) */
  if (e.type === 'soldier' && e.level === 1 && e.formationStacks > 0 && alpha === 1) {
    ctx.strokeStyle = 'rgba(120,144,156,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    var soldierPos = e.body.getPosition();
    for (var fsi = 0; fsi < state.enemies.length; fsi++) {
      var other = state.enemies[fsi];
      if (other === e || other.type !== 'soldier' || other.level !== 1 || !other.alive) continue;
      var otherPos = other.body.getPosition();
      var sdx = soldierPos.x - otherPos.x, sdy = soldierPos.y - otherPos.y;
      var dist = Math.sqrt(sdx*sdx + sdy*sdy);
      if (dist < 2) {
        var otherSc = toScreen(otherPos.x, otherPos.y);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo((otherSc[0] - sx), (otherSc[1] - sy));
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  /* Lv.2 Soldier Block shield (фронтальный щит когда blockActive) */
  if (e.type === 'soldier' && e.level === 2 && e.blockActive && alpha === 1) {
    ctx.save();
    var eVel = e.body.getLinearVelocity();
    var blockAngle = Math.atan2(eVel.y, eVel.x);
    ctx.rotate(blockAngle - angle);
    ctx.fillStyle = 'rgba(79,195,247,0.3)';
    ctx.strokeStyle = 'rgba(79,195,247,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, -Math.PI/2, Math.PI/2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  /* General star */
  if (e.type === 'general') {
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath();
    for (var si2 = 0; si2 < 5; si2++) {
      var outerA = (si2 / 5) * TAU - PI / 2;
      var innerA = outerA + PI / 5;
      var or2 = r * 0.45, ir = r * 0.2;
      if (si2 === 0) ctx.moveTo(Math.cos(outerA)*or2, Math.sin(outerA)*or2);
      else ctx.lineTo(Math.cos(outerA)*or2, Math.sin(outerA)*or2);
      ctx.lineTo(Math.cos(innerA)*ir, Math.sin(innerA)*ir);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* Tank armor rings */
  if (e.type === 'tank' || e.type === 'juggernaut') {
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    for (var ai = 0; ai < 3; ai++) {
      var ir2 = r * (0.4 + ai * 0.2);
      ctx.beginPath();
      ctx.arc(0, 0, ir2, 0, TAU);
      ctx.stroke();
    }
  }

  /* Walking legs */
  if (e.alive && !e.frozen && alpha === 1) {
    var legPhase = e.stepBob;
    ctx.strokeStyle = hexToRgba(color, 0.5);
    ctx.lineWidth = 1.5;
    for (var li = 0; li < 2; li++) {
      var la = (li === 0 ? -0.4 : 0.4) + Math.sin(legPhase + li * PI) * 0.15;
      var lx1 = Math.cos(PI/2 + la) * (r * 0.6);
      var ly1 = Math.sin(PI/2 + la) * (r * 0.6);
      var lx2 = Math.cos(PI/2 + la) * (r * 0.8);
      var ly2 = Math.sin(PI/2 + la) * (r * 0.8);
      ctx.beginPath();
      ctx.moveTo(lx1, ly1);
      ctx.lineTo(lx2, ly2);
      ctx.stroke();
    }
  }

  /* ФАЗА 12: Level визуалы */
  if (e.level > 0 && alpha === 1) {
    ctx.save();
    ctx.translate(0, -r - 8);

    if (e.level === 1) {
      /* Lv.1: Шеврон */
      ctx.fillStyle = 'rgba(255,214,0,0.7)';
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(3, -1);
      ctx.lineTo(0, 0);
      ctx.lineTo(-3, -1);
      ctx.closePath();
      ctx.fill();

      /* Слабый glow */
      ctx.shadowColor = 'rgba(255,214,0,0.3)';
      ctx.shadowBlur = 4;
      ctx.strokeStyle = 'rgba(255,214,0,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.15, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (e.level === 2) {
      /* Lv.2: Корона */
      ctx.fillStyle = 'rgba(255,193,7,0.9)';
      ctx.strokeStyle = 'rgba(255,235,59,1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(-3, -4);
      ctx.lineTo(-1, -2);
      ctx.lineTo(0, -5);
      ctx.lineTo(1, -2);
      ctx.lineTo(3, -4);
      ctx.lineTo(4, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      /* Яркий glow */
      ctx.shadowColor = 'rgba(255,193,7,0.6)';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = 'rgba(255,193,7,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.2, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  /* HP bar */
  if (e.alive && e.hp < e.maxHp && alpha === 1) {
    var barW = r * 1.8;
    var barH = 3;
    var barX = sx - barW / 2;
    var barY = sy - r - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
    var ratio = Math.max(0, e.hp / e.maxHp);
    var hpColor = ratio > 0.5 ? '#66bb6a' : ratio > 0.25 ? '#ffa726' : '#ef5350';
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barW * ratio, barH);
  }
}

function drawProjectiles() {
  for (var pi = 0; pi < state.projectiles.length; pi++) {
    var p = state.projectiles[pi];
    if (!p.alive) continue;
    var pos = p.body.getPosition();
    var sc = toScreen(pos.x, pos.y);
    var sx = sc[0], sy = sc[1];
    var r = p.radius * scale;
    var col = p.ammo.color;

    /* Плазменные молнии */
    drawProjectilePlasma(ctx, sx, sy, p);

    /* Ядро/капсула */
    var coreR = r * 0.55;
    var coreGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, coreR);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.4, col);
    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(sx, sy, coreR, 0, TAU);
    ctx.fill();
  }
}

function drawParticles() {
  for (var i = 0; i < state.particles.length; i++) {
    var p = state.particles[i];
    var sc = toScreen(p.x, p.y);
    var sx = sc[0], sy = sc[1];
    var lifeRatio = p.life / p.maxLife;
    ctx.globalAlpha = lifeRatio;
    ctx.fillStyle = p.color;
    var r = p.r * scale * lifeRatio;
    if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * lifeRatio;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, TAU);
      ctx.stroke();
    } else if (p.type === 'square') {
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(state.time * 5);
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    } else if (p.type === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r * 0.7, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r * 0.7, sy);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === 'bolt') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5 * lifeRatio;
      var bLen = r * 3;
      var ba2 = Math.random() * TAU;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ba2)*bLen*0.5, sy + Math.sin(ba2)*bLen*0.5);
      ctx.lineTo(sx + Math.cos(ba2+0.5)*bLen, sy + Math.sin(ba2+0.5)*bLen);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ═══════════════ HELPER: hex color to rgba ═══════════════ */
function hexToRgba(hex, a) {
  if (hex.charAt(0) === 'r') return hex;
  var c = hex.replace('#','');
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var rv = parseInt(c.substring(0,2),16);
  var gv = parseInt(c.substring(2,4),16);
  var bv = parseInt(c.substring(4,6),16);
  return 'rgba('+rv+','+gv+','+bv+','+a+')';
}

/* ═══════════════ HUD ═══════════════ */
function updateHUD() {
  document.getElementById('hud-lives').textContent = '❤ ' + state.lives;
  /* \u0422\u0435\u043A\u0443\u0449\u0435\u0435 \u0438\u0433\u0440\u043E\u0432\u043E\u0435 \u0432\u0440\u0435\u043C\u044F \u0441\u0443\u0442\u043E\u043A \u0432\u043C\u0435\u0441\u0442\u043E \u044F\u0440\u043B\u044B\u043A\u0430 Day/Night */
  var cycleLen = 2 * CFG.SLOT_LEN;
  var ttod = ((((state.clock - CFG.INTRO_REST) % cycleLen) / cycleLen) + 1) % 1; /* 0 = \u043F\u043E\u043B\u0434\u0435\u043D\u044C */
  var hour24 = (12 + ttod * 24) % 24;
  var hh = Math.floor(hour24), mm = Math.floor((hour24 - hh) * 60);
  var isNight = state.nightFactor > 0.5;
  document.getElementById('hud-wave').textContent =
    (isNight ? '\uD83C\uDF19 ' : '\u2600 ') + (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  document.getElementById('hud-score').textContent = state.score;
  document.getElementById('hud-energy').textContent = '⚡ ' + state.energy;

  /* Показываем кнопку поднятия маяка только в затишье после колонизации */
  var raiseBtn = document.getElementById('raise-btn');
  var ammoBar = document.getElementById('ammo-bar');
  var shopBtn = document.getElementById('shop-btn');
  var inRest = state.colonized && state.firstColony && !state.waveActive && !state.gameOver;
  if (inRest) {
    raiseBtn.classList.add('visible');
    /* \u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0439 \u043e\u0442\u0441\u0447\u0451\u0442 \u0434\u043e \u0432\u043e\u043b\u043d\u044b + \u043f\u043e\u0442\u0435\u043d\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u0431\u043e\u043d\u0443\u0441 (\u043f\u0430\u0434\u0430\u0435\u0442 \u043a \u0432\u043e\u043b\u043d\u0435) */
    var dueC = CFG.INTRO_REST + state.wave * CFG.SLOT_LEN;
    var secs = Math.max(0, Math.ceil(dueC - state.clock));
    var potPct = Math.max(0, Math.round((dueC - state.clock) / (2 * CFG.SLOT_LEN) * 100));
    var label = state.resting
      ? '\u23e9 +' + Math.round((state.restBonus || 0) * 100) + '% \u00b7 ' + secs + 's'
      : '\u23f1 ' + secs + 's \u00b7 REST +' + potPct + '%';
    raiseBtn.childNodes[0].textContent = label + '\n';
    var glitch = raiseBtn.querySelector('.btn__glitch');
    if (glitch) glitch.textContent = label;
  } else {
    raiseBtn.classList.remove('visible');
  }
  /* Панель снарядов скрыта в бою, КРОМЕ 5с грейса на выбор боевого снаряда */
  if (state.waveActive && state.ammoGrace <= 0) {
    ammoBar.classList.add('combat-hide');
    shopBtn.classList.add('combat-hide');
  } else {
    ammoBar.classList.remove('combat-hide');
    if (state.waveActive) shopBtn.classList.add('combat-hide'); else shopBtn.classList.remove('combat-hide');
  }
  /* Магазин доступен во время отдыха между волнами (после первой колонии) */
  if (state.firstColony && !state.waveActive) {
    shopBtn.style.opacity = '1';
  } else {
    shopBtn.style.opacity = '0';
  }
}

function showWaveText(text) {
  var el = document.getElementById('wave-text');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(function(){ el.style.opacity = '0'; }, 1800);
}

/* ═══════════════ AMMO BAR (вертикальная плитка 1×4 справа) ═══════════════ */
function ammoAvailable(i) {
  var a = AMMO[i];
  if (a.colony) return !state.waveActive;                 /* колония — только между волн */
  if (a.locked) return false;                             /* 3-й закрыт */
  if (a.id === 'tesla') return state.firstColony && cityAgg().tok > 0; /* открывает токамак */
  return state.firstColony;                               /* базовый — после первой колонии */
}
function buildAmmoBar() {
  var bar = document.getElementById('ammo-bar');
  bar.innerHTML = '';
  AMMO.forEach(function(a, i) {
    var avail = ammoAvailable(i);
    var btn = document.createElement('div');
    btn.className = 'ammo-btn' + (i === state.selectedAmmo ? ' active' : '') + (!avail ? ' locked' : '');
    btn.title = a.name;
    btn.style.position = 'relative';

    var previewCvs = document.createElement('canvas');
    previewCvs.width = 40; previewCvs.height = 40;
    var pCtx = previewCvs.getContext('2d');
    var cx = 20, cy = 20, pr = 14;
    pCtx.strokeStyle = a.color; pCtx.lineWidth = 1.5; pCtx.shadowColor = a.color; pCtx.shadowBlur = 6; pCtx.globalAlpha = 0.85;
    for (var bi = 0; bi < 6; bi++) {
      var ba = (bi / 6) * TAU + Math.random() * 0.3;
      pCtx.beginPath(); pCtx.moveTo(cx, cy);
      for (var seg = 0; seg < 4; seg++) {
        var frac = (seg + 1) / 4;
        pCtx.lineTo(cx + Math.cos(ba) * pr * frac + (Math.random() - 0.5) * 4, cy + Math.sin(ba) * pr * frac + (Math.random() - 0.5) * 4);
      }
      pCtx.stroke();
    }
    pCtx.shadowBlur = 0; pCtx.globalAlpha = 1;
    btn.appendChild(previewCvs);

    /* Подпись: цена колонии / замок / условие */
    var labTxt = '';
    if (a.colony) labTxt = state.firstColony ? (priced(COLONY_SHOT_COST) + '⚡') : 'FREE';
    else if (a.locked) labTxt = '🔒';
    else if (a.id === 'tesla' && !avail) labTxt = 'токамак';
    if (labTxt) {
      var lab = document.createElement('div');
      lab.style.cssText = 'position:absolute;bottom:1px;left:0;right:0;text-align:center;font:700 8px "Chakra Petch";color:' + a.color + ';text-shadow:0 0 3px #000;pointer-events:none;';
      lab.textContent = labTxt;
      btn.appendChild(lab);
    }

    btn.addEventListener('click', (function(idx) {
      return function() {
        if (!ammoAvailable(idx)) return;
        state.selectedAmmo = idx;
        if (state.ammoGrace > 0 && !AMMO[idx].colony) state.ammoGrace = 0; /* выбрал боевой в грейс */
        buildAmmoBar(); updateHUD();
      };
    })(i));
    bar.appendChild(btn);
  });
}

/* ═══════════════ SHOP ═══════════════ */
function buildShop() {
  var box = document.getElementById('shop-content');
  box.innerHTML = '';
  var ct = state.colonyTier, ti = COLONY_TIERS[ct];

  /* colony card */
  var sec1 = document.createElement('div'); sec1.className = 'shop-section';
  var label1 = document.createElement('div'); label1.className = 'shop-section-title'; label1.textContent = 'Эволюция колонии'; sec1.appendChild(label1);
  var card = document.createElement('div'); card.className = 'colony-card';
  var hdr = '<div class="colony-header"><span class="colony-icon">' + ti.icon + '</span><div><div class="colony-name">' + ti.name + '</div><div class="colony-tier-label">Уровень ' + (ct + 1) + ' / ' + COLONY_TIERS.length + '</div></div></div>';
  var bonuses = '<div class="colony-bonuses">' + ti.desc + '</div>';
  var dots = '<div class="colony-progress">';
  for (var d = 0; d < COLONY_TIERS.length; d++) dots += '<div class="colony-dot' + (d < ct ? ' filled' : '') + (d === ct ? ' current' : '') + '"></div>';
  dots += '</div>';
  card.innerHTML = hdr + bonuses + dots;

  if (ct < COLONY_TIERS.length - 1) {
    var next = COLONY_TIERS[ct + 1];
    var ebtn = document.createElement('button'); ebtn.className = 'evolve-btn';
    ebtn.textContent = '⬆ ' + next.name + ' — ⚡' + next.cost;
    ebtn.addEventListener('click', function() {
      if (state.energy >= next.cost) {
        state.energy -= next.cost;
        state.colonyTier++;
        var bonus = COLONY_TIERS[state.colonyTier];
        state.lives += bonus.bonusLives - COLONY_TIERS[state.colonyTier - 1].bonusLives;
        buildShop(); buildAmmoBar(); updateHUD();
      }
    });
    card.appendChild(ebtn);
  } else {
    var mx = document.createElement('button'); mx.className = 'evolve-btn maxed'; mx.textContent = 'МАКСИМАЛЬНЫЙ УРОВЕНЬ'; card.appendChild(mx);
  }
  sec1.appendChild(card); box.appendChild(sec1);

  /* perks section */
  var sec2 = document.createElement('div'); sec2.className = 'shop-section';
  var label2 = document.createElement('div'); label2.className = 'shop-section-title'; label2.textContent = 'Перки'; sec2.appendChild(label2);

  PERK_DEFS.forEach(function(pd) {
    var lvl = perkLvl(pd.id), maxed = lvl >= pd.maxLvl, locked = ct < pd.tierReq;
    var div = document.createElement('div'); div.className = 'perk-item' + (locked ? ' locked-tier' : '');
    var descText = maxed ? pd.descs[pd.maxLvl - 1] : (lvl > 0 ? pd.descs[lvl - 1] : pd.descs[0]);
    var nextDesc = !maxed && lvl < pd.maxLvl ? pd.descs[lvl] : '';
    var lvlDots = '';
    for (var d2 = 0; d2 < pd.maxLvl; d2++) lvlDots += '<span style="color:' + (d2 < lvl ? 'var(--cyan)' : 'rgba(255,255,255,0.15)') + '">●</span>';

    div.innerHTML = '<div class="perk-icon">' + pd.icon + '</div><div class="perk-info"><div class="perk-name">' + pd.name + ' <span class="perk-lvl">' + lvlDots + '</span></div>' +
      '<div class="perk-desc">' + (maxed ? descText : nextDesc) + '</div>' +
      (locked ? '<div class="perk-tier-req">Нужно: ' + COLONY_TIERS[pd.tierReq].icon + ' ' + COLONY_TIERS[pd.tierReq].name + '</div>' : '') +
      '</div>';

    if (!locked && !maxed) {
      var cost = pd.costs[lvl];
      var pbtn = document.createElement('button'); pbtn.className = 'perk-buy'; pbtn.textContent = '⚡' + cost;
      pbtn.addEventListener('click', (function(perkDef, perkCost) {
        return function() {
          if (state.energy >= perkCost) { state.energy -= perkCost; state.perks[perkDef.id]++; buildShop(); updateHUD(); }
        };
      })(pd, cost));
      div.appendChild(pbtn);
    } else if (maxed) {
      var mx2 = document.createElement('div'); mx2.className = 'perk-buy maxed'; mx2.textContent = 'МАКС'; div.appendChild(mx2);
    }
    sec2.appendChild(div);
  });

  /* ammo unlocks info */
  var hasLocked = false;
  /* Боеприпасы больше не продаются в магазине - они открываются автоматически с прокачкой колонии */

  box.appendChild(sec2);
}

/* ═══════════════ RAISE LIGHTHOUSE ═══════════════ */
document.getElementById('raise-btn').addEventListener('click', function() {
  if (state.waveActive || state.gameOver || !state.firstColony) return;
  var dueC = CFG.INTRO_REST + state.wave * CFG.SLOT_LEN;
  if (state.clock >= dueC) { startWave(); return; } /* время уже пришло — сразу волна */
  /* Фиксируем бонус по ОСТАВШЕМУСЯ времени: чем раньше отдохнул — тем больше */
  var cycleLen = 2 * CFG.SLOT_LEN;
  var rem = (dueC - state.clock) / cycleLen;
  state.restBonus = rem < 0 ? 0 : (rem > 0.9 ? 0.9 : rem);
  state.resting = true; /* перемотка погоды/времени/облаков к волне (см. update) */
});

/* ═══════════════ GAME OVER ═══════════════ */
document.getElementById('restart-btn').addEventListener('click', function() {
  document.getElementById('game-over-overlay').classList.remove('open');
  resetGame();
});

function resetGame() {
  for (var i = 0; i < state.enemies.length; i++) {
    try { world.destroyBody(state.enemies[i].body); } catch(_e) { /* noop */ }
  }
  for (var j = 0; j < state.projectiles.length; j++) {
    try { world.destroyBody(state.projectiles[j].body); } catch(_e) { /* noop */ }
  }
  deferredBodies.length = 0;
  deferredDestroy.length = 0;
  craters.length = 0;
  plateDebris.length = 0;
  shrapnel.length = 0;
  /* Пересоздаём облака заново */
  initCloudMap(W, H);
  accumulator = 0; // Сбрасываем накопитель времени
  state = freshState();
  state.lighthouse.x = CFG.WORLD_W / 2;
  state.lighthouse.y = worldH - CFG.BASE_OFFSET - CFG.LIGHTHOUSE_OFFSET;
  _surfCvs = null;
  cityQueue = [];
  cityFrozen = [];
  cityCraters = [];
  destructionCraters = [];
  explosionBolts = [];
  cityTier = -1;
  buildAmmoBar();
  updateHUD();
  /* Автоколонизация (кнопка COLONIZE временно скрыта) */
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1;
  tutStart();
}

/* ═══════════════ GAME LOOP ═══════════════ */
var lastTime = 0;
var accumulator = 0;
var FIXED_DT = 1/60; // Фиксированный временной шаг 60 FPS
function gameLoop(timestamp) {
  var frameTime = Math.min((timestamp - lastTime) / 1000, 0.25);
  lastTime = timestamp;
  accumulator += frameTime;

  if (scale > 0 && isFinite(worldH)) {
    // Обновляем игру с фиксированным шагом
    while (accumulator >= FIXED_DT) {
      update(FIXED_DT);
      accumulator -= FIXED_DT;
    }
    render();
  }
  requestAnimationFrame(gameLoop);
}

/* ═══════════════ TUTORIAL SEQUENCE ═══════════════ */
/*
  Живая шкала натяжения. Показывает текущий уровень в реальном времени.
  Двигается туда-сюда: натянул на 100% — сердечки, вернул на 30% — обратно MORE.
  Бонус фиксируется в момент отпускания (onUp), до сброса dragging.

  Уровни:
    0-19%  ⏬ DRAG ⏬
   20-39%  ⏬ MORE ⏬
   40-79%  ✅ ✅       (+50 ⚡ при выстреле)
   80-100% 💚 💚       (+99 ⚡ при выстреле)
*/
var _tut = { state: 'off', el: null, txt: null, pendingBonus: 0, dragShown: false, conditionTimer: 0, blinkTimer: 0 };

function _tutEl() {
  if (!_tut.el) {
    _tut.el = document.getElementById('tut-prompt');
    _tut.txt = _tut.el.querySelector('.tp-text');
  }
  return _tut.el;
}

function _tutShow(html, green) {
  var el = _tutEl();
  _tut.txt.innerHTML = html;
  el.classList.toggle('green', !!green);
  el.classList.add('visible');
}

function _tutHide() {
  _tutEl().classList.remove('visible');
}

function _tutPos() {
  var el = _tutEl();
  if (!state || !state.lighthouse) return;
  var lh = state.lighthouse;
  var sx = lh.x * scale;
  var sy = lh.y * scale;
  var above = 0.7 * lhScale * 6 + 40;
  el.style.left = sx + 'px';
  el.style.top = (sy - above) + 'px';
}

function _tutDragPct() {
  if (!state.dragCurrent) return 0;
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var dx = lh.x - dc.x, dy = lh.y - dc.y;
  return Math.min(Math.sqrt(dx * dx + dy * dy) / CFG.DRAG_MAX, 1);
}

function tutReset() {
  _tut.state = 'off';
  _tut.pendingBonus = 0;
  _tut.dragShown = false;
  _tut.conditionTimer = 0;
  _tut.blinkTimer = 0;
  _tutHide();
}

function tutStart() {
  _tut.state = 'hold';
  _tut.pendingBonus = 0;
  _tut.dragShown = false;
  _tut.conditionTimer = 0;
  _tut.blinkTimer = 0;
  _tutPos();
  _tutShow('HOLD');
}

function tutFinish() {
  _tut.state = 'finished';
  _tutHide();
}

/* onDown — юзер схватил маяк → сразу DRAG (без задержки) */
function tutOnHold() {
  if (_tut.state !== 'hold') return;
  _tut.state = 'active';
  if (!_tut.dragShown) {
    _tut.dragShown = true;
    state.energy += 1; /* бонус за первое перетаскивание */
  }
  _tutShow('<span class="emoji-pink">⏬</span> DRAG <span class="emoji-pink">⏬</span>');
}

/* Каждый кадр: живая шкала */
function tutUpdate(dt) {
  if (_tut.state === 'off' || _tut.state === 'finished' || _tut.state === 'fired') return;
  _tutPos();

  if (_tut.state === 'hold') return; /* ждём захвата */

  if (_tut.state === 'active') {
    if (!state.dragging) {
      _tut.state = 'hold';
      _tut.conditionTimer = 0;
      _tutShow('HOLD');
      return;
    }
    var pct = _tutDragPct();
    var conditionsMet = (pct >= 0.4);

    if (conditionsMet) {
      _tut.conditionTimer += dt;
      if (_tut.conditionTimer >= 3) {
        _tut.state = 'blink';
        _tut.blinkTimer = 0;
        return;
      }
    } else {
      _tut.conditionTimer = 0;
    }

    if (pct >= 0.8) {
      _tutShow('<span class="emoji-green">💚</span> <span class="emoji-green">💚</span>', true);
    } else if (pct >= 0.4) {
      _tutShow('✅ ✅');
    } else if (pct >= 0.2) {
      _tutShow('<span class="emoji-pink">⏬</span> MORE <span class="emoji-pink">⏬</span>');
    } else {
      _tutShow('<span class="emoji-pink">⏬</span> DRAG <span class="emoji-pink">⏬</span>');
    }
    return;
  }

  if (_tut.state === 'blink') {
    if (!state.dragging) {
      _tut.state = 'hold';
      _tut.conditionTimer = 0;
      _tut.blinkTimer = 0;
      _tutShow('HOLD');
      return;
    }
    var pct2 = _tutDragPct();
    if (pct2 < 0.4) {
      _tut.state = 'active';
      _tut.conditionTimer = 0;
      _tut.blinkTimer = 0;
      return;
    }
    _tut.blinkTimer += dt;
    var phase = Math.floor(_tut.blinkTimer * 2.5) % 2;
    _tutShow(phase === 0 ? 'JUST' : 'RELEASE');
    return;
  }
}

/*
  Вызывается из onUp ДО state.dragging=false,
  чтобы зафиксировать бонус по текущему натяжению.
  Если условия выполнены — скрываем плашку и переходим в 'fired'.
*/
function tutOnRelease() {
  if (_tut.state !== 'active' && _tut.state !== 'blink') return;
  var pct = _tutDragPct();
  if (pct >= 0.8) {
    _tut.pendingBonus = 99;
  } else if (pct >= 0.4) {
    _tut.pendingBonus = 50;
  } else {
    _tut.pendingBonus = 0;
  }
  /* Если условия выполнены (✅✅ или 💚💚) ИЛИ отпустили во время JUST|RELEASE — скрываем */
  if (_tut.pendingBonus > 0 || _tut.state === 'blink') {
    _tut.state = 'fired';
    _tutHide();
  }
}

/* Вызывается при попадании (firstColony). Возвращает бонус. */
function tutOnFire() {
  if (_tut.state === 'off' || _tut.state === 'finished') return 0;
  var bonus = _tut.pendingBonus;
  _tut.pendingBonus = 0;
  if (bonus > 0) {
    state.energy += bonus;
  }
  return bonus;
}

/* ═══════════════ COLONIZE BUTTON ═══════════════ */
document.getElementById('colonize-btn').addEventListener('click', function() {
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1; /* стартовая энергия */
  /* Скрываем оверлей колонизации */
  document.getElementById('colonize-overlay').classList.add('hidden');
  /* Запускаем туториал */
  tutStart();
  /* Показываем HUD — но только базовый, магазин появится после первой колонии */
  document.getElementById('hud').style.opacity = '1';
  document.getElementById('ammo-bar').style.opacity = '1';
  document.getElementById('shop-btn').style.opacity = '0';
});

/* ═══════════════ INIT ═══════════════ */
function init() {
  canvas = document.getElementById('game');
  loadAssets();
  state = freshState();
  resizeCanvas();
  initWorld();
  initInput();
  buildAmmoBar();
  updateHUD();
  /* Автоколонизация при старте (кнопка COLONIZE временно скрыта) */
  state.colonized = true;
  state.waveTimer = CFG.WAVE_REST;
  state.energy += 1;
  tutStart();
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.classList.add('dark');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(event) {
    if (event.matches) { document.documentElement.classList.add('dark'); }
    else { document.documentElement.classList.remove('dark'); }
  });
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(function(t) { lastTime = t; requestAnimationFrame(gameLoop); });
}

init();
})();
</script>
