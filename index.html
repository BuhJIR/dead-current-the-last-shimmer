  state.sequencer.noteIdx = 0;
  state.sequencer.notes = expandedNotes;
  state.sequencer.modifiers = mods;
  state.sequencer.duration = seq.duration || 20;
}

/* ═══════════════ INPUT ═══════════════ */
function initInput() {
  function getPos(e) {
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX / scale, y: t.clientY / scale };
  }
  function onDown(e) {
    if (state.gameOver) return;
    var p = getPos(e);
    /* Сначала — тап по иконкам/панели прокачки городов */
    if (cityHitTest(p.x * scale, p.y * scale)) { e.preventDefault && e.preventDefault(); return; }
    var lh = state.lighthouse;
    var dx = p.x - lh.x, dy = p.y - lh.y;
    if (dx*dx + dy*dy < 3.5*3.5) {
      state.dragging = true;
      state.dragStart = { x: lh.x, y: lh.y };
      state.dragCurrent = p;
      state.charge = 0;
      tutOnHold();
    }
  }
  function onMove(e) {
    if (!state.dragging) return;
    e.preventDefault();
    state.dragCurrent = getPos(e);
  }
  function onUp() {
    if (!state.dragging) return;
    tutOnRelease();
    state.dragging = false;

    var isColonyAmmo = !!(AMMO[state.selectedAmmo] && AMMO[state.selectedAmmo].colony);

    /* Снаряд «Колония» стреляется только между волн; остальные — только когда маяк поднят */
    if (isColonyAmmo && state.waveActive) { state.charge = 0; return; }
    if (!isColonyAmmo && state.firstColony && !state.waveActive) {
      showWaveText('▲ RAISE BEACON ▲');
      state.charge = 0;
      return;
    }

    var lh = state.lighthouse;
    var dc = state.dragCurrent;
    var dx = lh.x - dc.x, dy = lh.y - dc.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    /* Чувствительность и порог зависят от состояния боя */
    var dragMax = state.waveActive ? 14 : CFG.DRAG_MAX;
    var minThreshold = state.waveActive ? 0.17 : 0.25;
    var dragPct = Math.min(dist / dragMax, 1);
    if (dragPct >= minThreshold) {
      var maxVel = 18 + cityAgg().plant;
      var speed = Math.min(dist * CFG.VEL_FACTOR, maxVel);
      var nx = dx / dist, ny = dy / dist;
      if (isColonyAmmo) {
        /* Первый город бесплатно, дальше 200 энергии за выстрел */
        var cost = state.firstColony ? priced(COLONY_SHOT_COST) : 0;
        if (state.energy < cost) { showWaveText('⚡ НУЖНО ' + cost); state.charge = 0; return; }
        /* Колония НЕ зависит от прокачки: фиксированная скорость (без бонуса станций)
           и фиксированный заряд — чтобы снаряд всегда приземлялся предсказуемо и
           основывал город, даже при прокачанной дальности. */
        var colonySpeed = Math.min(dist * CFG.VEL_FACTOR, 18);
        var colonyCharge = CFG.MAX_CHARGE * 0.7;
        doFire(lh.x, lh.y, nx, ny, colonySpeed, colonyCharge, state.selectedAmmo);
        state.energy -= cost;
        state.selectedAmmo = 0;   /* авто-переключение на базовый после выстрела колонией */
        buildAmmoBar();
      } else {
        if (state.energy < 1) { showWaveText('⚡ NO ENERGY'); state.charge = 0; return; }
        doFire(lh.x, lh.y, nx, ny, speed, state.charge, state.selectedAmmo);
        state.energy -= 1;
        if (perkLvl('singularity') > 0 && state.charge >= CFG.MAX_CHARGE * 0.95) {
          var sRange = Math.min(dist * 2, 8);
          spawnSingularity(lh.x + nx * sRange, lh.y + ny * sRange);
        }
      }
    }
    state.charge = 0;
  }
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
}

/* ═══════════════ UPDATE ═══════════════ */
function update(dt) {
  if (state.gameOver) return;
  state.time += dt;
  state.basePulse += dt * 2.5;
  state.lighthousePulse += dt * 3;
  if (state.shakeTimer > 0) state.shakeTimer -= dt;

  /* ── Непрерывный цикл день↔ночь (не зависит от побед в волнах) ── */
  var nextWaveDue = CFG.INTRO_REST + state.wave * CFG.SLOT_LEN;
  if (state.firstColony) state.clock += dt;
  /* Отдых-перемотка: гоним часы/погоду/облака к времени волны ускоренно */
  if (state.resting) {
    if (state.waveActive || state.clock >= nextWaveDue) {
      state.resting = false;
    } else {
      var ffStep = dt * (CFG.REST_FF - 1);
      if (state.clock + ffStep >= nextWaveDue) { ffStep = nextWaveDue - state.clock; state.resting = false; }
      state.clock += ffStep;
      /* облака заметно ускоряются, но шагов ограниченно — без просадки FPS */
      var ffst = 4; for (var ffi = 0; ffi < ffst; ffi++) scrollClouds(dt);
    }
  }
  var theta = (state.clock - CFG.INTRO_REST) * PI / CFG.SLOT_LEN;
  var nf = state.clock <= CFG.INTRO_REST ? 0 : 0.5 - 0.5 * Math.cos(theta);
  if (nf < 0) nf = 0; else if (nf > 1) nf = 1;
  state.nightFactor = nf;
  cloudDarkMult = 1 - nf * 0.55;      /* тьма/свет плавно */
  cloudSupplyBias = 0.50 + nf * 0.16; /* густота облаков плавно растёт к ночи */

  /* Шаг 2D-симуляции пара (адвекция плотности через curl-поле скоростей) */
  scrollClouds(dt);
  /* Маяк разгоняет облака */
  repelCloudsFromLighthouse();
  /* Туториал */
  tutUpdate(dt);
  /* Постепенный рост города */
  updateCityGrowth(dt);
  /* Секвенсор спавна врагов */
  tickSequencer(dt);

  /* Плавный переход маяка: в бою поднимается (1), в затишье опускается (0) */
  var lhTarget = state.waveActive ? 1 : 0;
  state.lhAbove += (lhTarget - state.lhAbove) * dt * 2.5;

  /* Если ещё не колонизировано — только облака и время */
  if (!state.colonized) return;

  /* Энергия с электростанций: раз в 10с +2 на станцию */
  if (state.firstColony) {
    state.energyTimer += dt;
    if (state.energyTimer >= 10) {
      state.energyTimer -= 10;
      var eGain = cityAgg().plant * 2;
      if (eGain > 0) { state.energy += eGain; for (var ec = 0; ec < state.cities.length; ec++) state.cities[ec].feed = 0.6; }
    }
  }

  /* Грейс на выбор снаряда, если волна началась с «Колонией» */
  if (state.ammoGrace > 0) {
    if (!(AMMO[state.selectedAmmo] && AMMO[state.selectedAmmo].colony)) { state.ammoGrace = 0; }
    else {
      state.ammoGrace -= dt;
      if (state.ammoGrace <= 0) { state.ammoGrace = 0; state.selectedAmmo = 0; buildAmmoBar(); }
    }
  }

  /* Charge while dragging — colony chargeMult + fast_charge perk */
  var maxCharge = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
  if (state.dragging) {
    var _cagg = cityAgg();
    var chgSpd = CFG.CHARGE_SPEED * 0.5 * _cagg.chargeMult * (1 + perkLvl('fast_charge') * 0.3);
    chgSpd *= (1 + state.restBonus * _cagg.restMult); /* электростанции + отдых×население */
    state.charge = Math.min(state.charge + dt * chgSpd, maxCharge);
  }

  /* Wave management — волны привязаны к слотам цикла; отдых = остаток слота.
     Волна N стартует, когда часы дойдут до её слота (INTRO + N*SLOT_LEN).
     Быстро зачистил — дольше отдыхаешь; затянул за слот — отдыха нет. */
  if (!state.waveActive) {
    if (state.firstColony && state.clock >= nextWaveDue) startWave();
  } else {
    /* Проверяем завершение волны: секвенсор остановлен И все враги мертвы */
    var allDead = true;
    for (var k = 0; k < state.enemies.length; k++) {
      if (state.enemies[k].alive) { allDead = false; break; }
    }
    if (!state.sequencer.active && allDead) {
      state.waveActive = false;
      state.restStartClock = state.clock;
      state.restBonus = 0; /* новое окно отдыха — бонус зафиксируется при нажатии REST */
      var wasNight = (state.wave % 2 === 0);
      var reward = wasNight ? 35 : 15;
      state.energy += reward;
      showWaveText('WAVE COMPLETE ⚡+' + reward);
    }
  }

  /* General shield aura & healer & Soldier formation buff */
  var generals = [], healers = [], soldiers = [];
  var ei;
  for (ei = 0; ei < state.enemies.length; ei++) {
    var en = state.enemies[ei];
    if (!en.alive) continue;
    if (en.def.special === 'shield') generals.push(en);
    if (en.def.special === 'heal') healers.push(en);
    if (en.type === 'soldier' && en.level === 1) soldiers.push(en);
  }
  for (ei = 0; ei < state.enemies.length; ei++) {
    var e = state.enemies[ei];
    if (!e.alive) continue;
    e.shielded = false;
    var ep = e.body.getPosition();
    for (var gi = 0; gi < generals.length; gi++) {
      var g = generals[gi];
      if (g === e) continue;
      var gp = g.body.getPosition();
      var gdx = ep.x - gp.x, gdy = ep.y - gp.y;
      if (gdx*gdx + gdy*gdy < 12) { e.shielded = true; break; }
    }
    for (var hi = 0; hi < healers.length; hi++) {
      var h = healers[hi];
      if (h === e) continue;
      var hp2 = h.body.getPosition();
      var hdx = ep.x - hp2.x, hdy = ep.y - hp2.y;
      if (hdx*hdx + hdy*hdy < 8) {
        e.hp = Math.min(e.hp + dt * 0.5, e.maxHp);
      }
    }
  }

  /* Lv.1 Soldier Formation buff: +15% HP per nearby soldier, max 3 stacks */
  for (var si = 0; si < soldiers.length; si++) {
    var soldier = soldiers[si];
    soldier.formationStacks = 0;
    var sp = soldier.body.getPosition();
    for (var sj = 0; sj < soldiers.length; sj++) {
      if (si === sj) continue;
      var other = soldiers[sj];
      var op = other.body.getPosition();
      var sdx = sp.x - op.x, sdy = sp.y - op.y;
      var soldierDist = Math.sqrt(sdx*sdx + sdy*sdy);
      if (soldierDist < 2) {
        soldier.formationStacks++;
        if (soldier.formationStacks >= 3) break;
      }
    }
    /* Apply HP buff: maxHp gets multiplier based on stacks */
    var baseHp = (Array.isArray(soldier.def.hp)) ? soldier.def.hp[soldier.level] : soldier.def.hp;
    var hpMult = state.nightHpMult || 1;
    soldier.maxHp = baseHp * hpMult * (1 + soldier.formationStacks * 0.15);
  }

  /* Move enemies downward — walking wobble */
  var baseY = getBaseY();
  for (var i = state.enemies.length - 1; i >= 0; i--) {
    e = state.enemies[i];

    /* Dead body physics — still exists for pushback */
    if (e.deathTimer >= 0) {
      e.deathTimer -= dt;
      if (e.deathTimer <= 0) {
        /* Defer destruction to after step */
        deferredDestroy.push(e.body);
        state.enemies.splice(i, 1);
      }
      continue;
    }
    if (!e.alive) continue;

    if (e.frozenTimer > 0) { e.frozenTimer -= dt; e.frozen = e.frozenTimer > 0; }
    if (e.flashTimer > 0) e.flashTimer -= dt;

    /* Lv.1 Scout Dodge: cooldown timer */
    if (e.type === 'scout' && e.level === 1 && e.dodgeCooldown > 0) {
      e.dodgeCooldown -= dt;
    }

    /* Lv.1 Scout Dodge: detect nearby projectiles */
    if (e.type === 'scout' && e.level === 1 && e.dodgeCooldown <= 0) {
      var scoutPos = e.body.getPosition();
      for (var pi = 0; pi < state.projectiles.length; pi++) {
        var proj = state.projectiles[pi];
        if (!proj.alive) continue;
        var ppos = proj.body.getPosition();
        var pdx = ppos.x - scoutPos.x, pdy = ppos.y - scoutPos.y;
        var pdist = Math.sqrt(pdx*pdx + pdy*pdy);
        if (pdist < 2) {
          /* Dodge perpendicular to projectile direction */
          var pvel = proj.body.getLinearVelocity();
          var perpX = -pvel.y, perpY = pvel.x;
          var perpLen = Math.sqrt(perpX*perpX + perpY*perpY);
          if (perpLen > 0.1) {
            perpX /= perpLen; perpY /= perpLen;
          }
          var dodgeDir = (Math.random() < 0.5) ? 1 : -1;
          var dodgeForce = 180 * e.body.getMass();
          e.body.applyLinearImpulse(Vec2(perpX * dodgeDir * dodgeForce, perpY * dodgeDir * dodgeForce), e.body.getPosition());
          e.dodgeCooldown = 1.5;
          e.dodgeDir = { x: perpX * dodgeDir, y: perpY * dodgeDir };
          spawnHitParticles(scoutPos.x, scoutPos.y, '#39ff14', 6);
          break;
        }
      }
    }

    /* Lv.2 Scout Flicker: every 3s, alpha=0.3 for 0.8s, no collision */
    if (e.type === 'scout' && e.level === 2) {
      e.flickerTimer += dt;
      if (e.flickerTimer >= 3 && !e.flickering) {
        e.flickerTimer = 0;
        e.flickering = true;
        e.body.getFixtureList().setFilterData({
          categoryBits: CFG.CAT_ENEMY,
          maskBits: 0
        });
      }
      if (e.flickering) {
        e.flickerTimer += dt;
        if (e.flickerTimer >= 0.8) {
          e.flickering = false;
          e.flickerTimer = 0;
          e.body.getFixtureList().setFilterData({
            categoryBits: CFG.CAT_ENEMY,
            maskBits: CFG.CAT_PROJ
          });
        }
      }
    }

    /* Lv.2 Soldier Block: every 4s, shield for 1s (frontal invulnerability) */
    if (e.type === 'soldier' && e.level === 2) {
      e.blockTimer += dt;
      if (e.blockTimer >= 4) {
        e.blockTimer = 0;
        e.blockActive = true;
      }
      if (e.blockActive) {
        e.blockTimer += dt;
        if (e.blockTimer >= 1) {
          e.blockActive = false;
          e.blockTimer = 0;
        }
      }
    }

    /* Lv.1 Berserker Blood trail: rage>1.5x → particle trail + speed buff allies */
    if (e.type === 'berserker' && e.level === 1 && e.rageSpeed > 1.5) {
      ep = e.body.getPosition();
      if (Math.random() < 0.3) {
        addParticle(ep.x + (Math.random()-0.5)*0.3, ep.y + (Math.random()-0.5)*0.3,
                    (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5,
                    0.15, '#c62828', 0.6);
      }
      /* Speed buff to allies within r<3 */
      for (var bi = 0; bi < state.enemies.length; bi++) {
        var ally = state.enemies[bi];
        if (ally === e || !ally.alive || ally.type === 'berserker') continue;
        var ap = ally.body.getPosition();
        var adx = ap.x - ep.x, ady = ap.y - ep.y;
        var adist = Math.sqrt(adx*adx + ady*ady);
        if (adist < 3) {
          if (!ally.bloodTrailBuff) ally.bloodTrailBuff = 0;
          ally.bloodTrailBuff = Math.max(ally.bloodTrailBuff, 2.0);
        }
      }
    }

    /* Decay blood trail buff */
    if (e.bloodTrailBuff && e.bloodTrailBuff > 0) {
      e.bloodTrailBuff -= dt;
      if (e.bloodTrailBuff < 0) e.bloodTrailBuff = 0;
    }

    var speedMul = e.frozen ? 0.15 : e.rageSpeed;
    /* Apply blood trail buff */
    if (e.bloodTrailBuff && e.bloodTrailBuff > 0) {
      speedMul *= 1.2;
    }

    ep = e.body.getPosition();
    /* ФАЗА 12: Применяем множитель уровня к скорости */
    var targetSpeed = e.def.speed * speedMul * (e.levelSpeedMult || 1.0) * (e.noteSpeedMult || 1.0);
    var mass = e.body.getMass();

    var fy = targetSpeed * CFG.ENEMY_DAMPING * mass;
    var fx = 0;

    var cx = CFG.WORLD_W / 2;
    if (ep.x < 2) fx += (2 - ep.x) * 2 * mass;
    else if (ep.x > CFG.WORLD_W - 2) fx += (CFG.WORLD_W - 2 - ep.x) * 2 * mass;
    if (Math.abs(ep.x - cx) > CFG.WORLD_W * 0.35) {
      fx += (cx - ep.x) * 0.15 * mass;
    }

    /* Халфтрак: доезжает до ближайшего города, встаёт рядом и бьёт по нему
       (тратит энергию игрока). Если городов нет — идёт к базе как обычный враг. */
    if (e.type === 'halftrack') {
      var tc = null, tcd = 1e9, tcx = 0, tcy = 0;
      for (var hci = 0; hci < state.cities.length; hci++) {
        var hcc = state.cities[hci], cwx = hcc.x / scale, cwy = hcc.y / scale;
        var hd = (cwx - ep.x) * (cwx - ep.x) + (cwy - ep.y) * (cwy - ep.y);
        if (hd < tcd) { tcd = hd; tc = hcc; tcx = cwx; tcy = cwy; }
      }
      if (tc) {
        fx += (tcx - ep.x) * 0.6 * mass;                 /* подруливает к городу */
        if (Math.abs(ep.y - tcy) < 2.4 && Math.abs(ep.x - tcx) < 3.5) {
          fy = 0;                                        /* встал у города */
          e.htCd = (e.htCd || 0) - dt;
          if (e.htCd <= 0) {
            e.htCd = 1.4;
            if (state.energy > 0) { state.energy = Math.max(0, state.energy - 8); updateHUD(); }
            tc.flicker = 0.6; tc.feed = 0;
            state.lightningArcs.push({ x1: ep.x, y1: ep.y, x2: tcx, y2: tcy, life: 0.2 });
            spawnHitParticles(tcx, tcy, '#ff3b30', 6);
          }
        }
      }
    }

    e.body.applyForceToCenter(Vec2(fx, fy));

    /* Base breach */
    if (ep.y > baseY) {
      /* shield generator absorbs */
      if (state.shieldCharges > 0) {
        state.shieldCharges--;
        spawnHitParticles(ep.x, baseY, '#4fc3f7', 8);
        addParticle(ep.x, baseY, 0, 0, 1.5, 'rgba(79,195,247,0.3)', 0.4, 'ring');
      } else {
        state.lives--;
        state.shakeTimer = 0.3;
        state.shakeIntensity = 6;
        spawnHitParticles(ep.x, baseY, '#ff1744', 12);
      }
      e.alive = false;
      e.deathTimer = 0.01;
      if (state.lives <= 0) {
        state.gameOver = true;
        document.getElementById('go-score').textContent = 'Счёт: ' + state.score;
        document.getElementById('game-over-overlay').classList.add('open');
      }
    }
    if (ep.x < -3 || ep.x > CFG.WORLD_W + 3) {
      e.alive = false;
      e.deathTimer = 0.01;
    }
  }

  /* Update projectiles — mark dead ones for deferred destruction */
  for (i = state.projectiles.length - 1; i >= 0; i--) {
    var p = state.projectiles[i];
    p.lifetime -= dt;
    p.boltTimer += dt;
    /* Обновляем плазменную систему */
    updateProjectilePlasma(p);
    if (!p.alive || p.lifetime <= 0) {
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
      continue;
    }
    var pp = p.body.getPosition();
    var vel = p.body.getLinearVelocity();
    var speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);

    /* Взрыв при любой остановке - даже на высокой скорости */
    if (speed < 2.0 && p.alive) {
      var chargeNorm = p.charge / CFG.MAX_CHARGE; /* 0-1 */
      var chargeMult = 0.5 + chargeNorm * 1.5;
      if (!p.ammo.noExplode) {
        spawnPlasmaExplosion(pp.x, pp.y, p.ammo.color, 25, chargeNorm);
        spawnElectricSparks(pp.x, pp.y, p.ammo.color, 48);
        spawnExplosionBolts(pp.x, pp.y, p.ammo.color, 2.5 * chargeMult, 8 + Math.floor(chargeNorm * 8));
      } else {
        spawnElectricSparks(pp.x, pp.y, p.ammo.color, 24); /* тесла: без взрыва, только разряд */
      }
      /* Кратер под город делает ТОЛЬКО снаряд «Колония» (иначе боевой выстрел бил бы по земле) */
      if (p.colony) createShotCrater(pp.x, pp.y, chargeNorm);
      p.alive = false;
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
      continue;
    }

    p.trail.push({ x: pp.x, y: pp.y, t: 0.3 });
    if (p.trail.length > 16) p.trail.shift();
    for (var j = p.trail.length - 1; j >= 0; j--) {
      p.trail[j].t -= dt;
      if (p.trail[j].t <= 0) p.trail.splice(j, 1);
    }

    /* Привязываем молнии снаряда к ближайшим врагам */
    if (p.charge > 0 && p.plasmaNodes) {
      var pChargeNorm = p.charge / CFG.MAX_CHARGE;
      var teslaShot = (p.ammo.id === 'tesla');
      var teslaIgnite = teslaShot && cityAgg().tok >= 2; /* прокачанный токамак → поджиг молниями */
      var seekRadius = (3.0 + pChargeNorm * 2.0) * (teslaShot ? 2 : 1); /* тесла бьёт вдвое дальше */

      /* Каждая молния ищет ближайшего врага */
      for (var ni = 0; ni < p.plasmaNodes.length; ni++) {
        var node = p.plasmaNodes[ni];
        var closestEnemy = null;
        var closestDist = seekRadius;

        for (var eix = 0; eix < state.enemies.length; eix++) {
          var enemy = state.enemies[eix];
          if (!enemy.alive) continue;

          var epos = enemy.body.getPosition();
          var dx = epos.x - pp.x;
          var dy = epos.y - pp.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < closestDist) {
            closestDist = dist;
            closestEnemy = enemy;
          }
        }

        /* Привязываем врага к ноде и обновляем относительные координаты */
        node.targetEnemy = closestEnemy;
        if (closestEnemy) {
          var eposTarget = closestEnemy.body.getPosition();
          node.enemyRelX = eposTarget.x - pp.x;
          node.enemyRelY = eposTarget.y - pp.y;
        }

        /* Урон от каждой молнии раз в 0.3 секунды */
        if (!node.damageTimer) node.damageTimer = 0;
        node.damageTimer += dt;

        if (node.damageTimer >= 0.3 && closestEnemy) {
          node.damageTimer = 0;
          var dmg = (2 + pChargeNorm * 3) * 0.05; /* Урон 0.1-0.25 за тик */
          if (teslaShot) dmg *= 2;                /* тесла жжёт сильнее */
          if (closestEnemy.shielded) dmg *= 0.5;
          closestEnemy.hp -= dmg;
          closestEnemy.flashTimer = 0.06;
          if (teslaIgnite) igniteEnemy(closestEnemy);

          /* Небольшие искры на месте попадания молнии */
          var enemyPos = closestEnemy.body.getPosition();
          spawnElectricSparks(enemyPos.x, enemyPos.y, p.ammo.color, 1);

          if (closestEnemy.hp <= 0) {
            killEnemy(closestEnemy);
          }
        }
      }
    }
    if (pp.x < -3 || pp.x > CFG.WORLD_W + 3 || pp.y < -4 || pp.y > worldH + 3) {
      /* Снаряд ушёл за край — кратер под город делает только «Колония» */
      if (pp.y > worldH - 2) {
        if (p.colony) createShotCrater(pp.x, pp.y, p.charge / CFG.MAX_CHARGE);
        spawnHitParticles(pp.x, pp.y, p.ammo.color, 10);
      }
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
    }
  }

  /* lightning arc visuals decay */
  for (i = state.lightningArcs.length - 1; i >= 0; i--) {
    state.lightningArcs[i].life -= dt;
    if (state.lightningArcs[i].life <= 0) state.lightningArcs.splice(i, 1);
  }

  /* Обновляем молнии взрывов */
  for (i = explosionBolts.length - 1; i >= 0; i--) {
    explosionBolts[i].life -= dt;
    if (explosionBolts[i].life <= 0) explosionBolts.splice(i, 1);
  }

  updateTesla(dt);
  updateSingularities(dt);
  updateParticles(dt);
  updateLights(dt);
  updateCraters(dt);
  updatePlateDebris(dt);
  updateShrapnel(dt);
  updateBurning(dt);
  updateVolley(dt);
  updateCities(dt);
  updateTurrets(dt);
  updateWallTurrets(dt);

  /* === PHYSICS STEP with deferred body management === */
  /* First: destroy queued bodies BEFORE step */
  processDeferredDestroy();

  /* Run physics step */
  insideStep = true;
  world.step(CFG.PHYS_DT, CFG.VEL_ITER, CFG.POS_ITER);
  insideStep = false;

  /* After step: create any deferred bodies (scatter sub-projectiles, etc.) */
  processDeferredBodies();

  updateHUD();
}

/* ═══════════════ RENDERING ═══════════════ */
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  if (state.shakeTimer > 0) {
    var s = state.shakeIntensity * (state.shakeTimer / 0.3);
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawBackground();       /* город + освещение (кратеры запечены в поверхность под городом) */

  drawBaseLine();
  drawSingularities();
  drawEnemies();           /* враги ПОД облаками */
  drawPlateDebris();       /* отлетевшие пластины брони */
  /* Маяк ПОД облаками когда lhAbove < 0.5 */
  if (state.lhAbove < 0.5) {
    ctx.save();
    ctx.globalAlpha = 0.3 + state.lhAbove * 1.4;
    drawLighthouse();
    ctx.restore();
  }
  /* Снаряды ПОД облаками когда маяк не поднят */
  if (!state.waveActive) {
    drawProjectiles();
    drawParticles();
  }
  /* Линия прицела ПОД облаками */
  if (state.dragging) drawAimLine();
  drawCloudLayer();        /* облака поверх врагов + луч перекрашивает в красный */
  drawCloudShocks();       /* кольца декомпрессии от взрывов */
  /* Маяк НАД облаками когда lhAbove >= 0.5 */
  if (state.lhAbove >= 0.5) {
    ctx.save();
    ctx.globalAlpha = state.lhAbove;
    drawLighthouse();
    ctx.restore();
  }
  /* Снаряды НАД облаками в бою */
  if (state.waveActive) {
    drawProjectiles();
    drawParticles();
  }
  drawShrapnel();          /* осколки от бочек — поверх облаков */
  drawLightningArcs();
  if (state.dragging) drawAimUI();
  ctx.restore();

  /* ── Слой 1 облаков поверх всего (включая UI) ── */
  drawCloudLayer1();

  /* ── UI прокачки городов ПОВЕРХ облаков ── */
  drawCityUI();

  /* ── Круг-подсказка туториала ПОВЕРХ всех облаков ── */
  if (_tut.state === 'hold' || (_tut.state === 'active' && _tutDragPct() < 0.2)) {
    var lhTut = state.lighthouse;
    var scTut = toScreen(lhTut.x, lhTut.y);
    var rTut = 0.7 * lhScale;
    var tutPulse = Math.sin(state.time * 3) * 0.3 + 0.7;
    ctx.strokeStyle = 'rgba(255,171,0,' + (0.85 * tutPulse) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(scTut[0], scTut[1], rTut + 10, 0, TAU);
    ctx.stroke();
  }
}

/* ── Статичная поверхность города (кэшируется при resize) ── */
var _surfCvs = null, _surfCtx = null;
function generateSurface(w, h) {
  _surfCvs = document.createElement('canvas');
  _surfCvs.width = w; _surfCvs.height = h;
  _surfCtx = _surfCvs.getContext('2d');

  var sRes = 4; /* px per cell */
  var sw = Math.ceil(w / sRes), sh = Math.ceil(h / sRes);
  var sMap = new Float32Array(sw * sh);

  /* value noise */
  function shash(ix, iy) { var d = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453; return d - Math.floor(d); }
  function sNoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = shash(ix,iy), b = shash(ix+1,iy), c = shash(ix,iy+1), d = shash(ix+1,iy+1);
    return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
  }
  var socts = [
    { s:0.008, a:0.45 }, { s:0.022, a:0.25 }, { s:0.06, a:0.15 },
    { s:0.14, a:0.10 }, { s:0.35, a:0.05 }
  ];
  for (var cy = 0; cy < sh; cy++) {
    for (var cx = 0; cx < sw; cx++) {
      var px = cx * sRes, py = cy * sRes, v = 0;
      for (var oi = 0; oi < socts.length; oi++) v += sNoise(px * socts[oi].s, py * socts[oi].s) * socts[oi].a;
      sMap[cy * sw + cx] = v;
    }
  }

  /* рендер поверхности */
  var img = _surfCtx.createImageData(w, h);
  var dd = img.data;
  for (var py2 = 0; py2 < h; py2++) {
    var ty = Math.min(Math.floor(py2 / sRes), sh - 1);
    var ty2 = Math.min(ty + 1, sh - 1);
    var fy2 = (py2 % sRes) / sRes;
    for (var px2 = 0; px2 < w; px2++) {
      var tx = Math.min(Math.floor(px2 / sRes), sw - 1);
      var tx2 = Math.min(tx + 1, sw - 1);
      var fx2 = (px2 % sRes) / sRes;
      var hv = sMap[ty*sw+tx]*(1-fx2)*(1-fy2) + sMap[ty*sw+tx2]*fx2*(1-fy2) + sMap[ty2*sw+tx]*(1-fx2)*fy2 + sMap[ty2*sw+tx2]*fx2*fy2;
      var r, g, b2;
      if (hv < 0.25) { var t0 = hv/0.25; r=4+t0*6; g=6+t0*8; b2=12+t0*10; }
      else if (hv < 0.4) { var t1 = (hv-0.25)/0.15; r=10+t1*10; g=14+t1*8; b2=22+t1*4; }
      else if (hv < 0.55) { var t2 = (hv-0.4)/0.15; r=20+t2*8; g=22+t2*6; b2=26+t2*2; }
      else if (hv < 0.7) { var t3 = (hv-0.55)/0.15; r=28+t3*7; g=28+t3*8; b2=28+t3*5; }
      else { var t4 = Math.min((hv-0.7)/0.3,1); r=35+t4*10; g=36+t4*12; b2=33+t4*8; }
      var off = (py2*w+px2)*4;
      dd[off]=r|0; dd[off+1]=g|0; dd[off+2]=b2|0; dd[off+3]=255;
    }
  }
  _surfCtx.putImageData(img, 0, 0);

  /* контурные линии */
  _surfCtx.strokeStyle = 'rgba(80,100,120,0.06)';
  _surfCtx.lineWidth = 1;
  var cLvls = [0.25, 0.4, 0.55, 0.7];
  for (var ci = 0; ci < cLvls.length; ci++) {
    var lv = cLvls[ci];
    _surfCtx.beginPath();
    for (var cty = 0; cty < sh-1; cty++) {
      for (var ctx2 = 0; ctx2 < sw-1; ctx2++) {
        var v00 = sMap[cty*sw+ctx2], v10 = sMap[cty*sw+ctx2+1], v01 = sMap[(cty+1)*sw+ctx2];
        if ((v00<lv)!==(v10<lv)) { var tt=(lv-v00)/(v10-v00); _surfCtx.moveTo((ctx2+tt)*sRes,cty*sRes); _surfCtx.lineTo((ctx2+tt)*sRes+1,cty*sRes+1); }
        if ((v00<lv)!==(v01<lv)) { var tt2=(lv-v00)/(v01-v00); _surfCtx.moveTo(ctx2*sRes,(cty+tt2)*sRes); _surfCtx.lineTo(ctx2*sRes+1,(cty+tt2)*sRes+1); }
      }
    }
    _surfCtx.stroke();
  }

  /* кратеры теперь создаются игроком выстрелами */
  return [];
}

/* Кратеры разрушения (рисуются ПОВЕРХ города) */
var destructionCraters = [];

/* Рисовать кратер на канвасе */
function drawCraterOnCtx(targetCtx, sx, sy, cr) {
  /* Рваная тень вокруг кратера (низкое качество) */
  targetCtx.fillStyle = 'rgba(0,0,0,0.4)';
  for (var si = 0; si < 40; si++) {
    var angle = (si / 40) * TAU + Math.random() * 0.3;
    var dist = cr * (1.1 + Math.random() * 0.4);
    var px = sx + Math.cos(angle) * dist;
    var py = sy + Math.sin(angle) * dist;
    var pSize = 1 + Math.random() * 2;
    targetCtx.fillRect(px - pSize/2, py - pSize/2, pSize, pSize);
  }

  /* Основная тёмная заливка — перекрывает город */
  targetCtx.fillStyle = 'rgba(5,5,10,1)';
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr,0,TAU); targetCtx.fill();

  /* Обводка кратера */
  targetCtx.strokeStyle = 'rgba(255,100,50,0.15)'; targetCtx.lineWidth = 1.2;
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr,0,TAU); targetCtx.stroke();

  /* Тень внутри */
  targetCtx.fillStyle = 'rgba(0,0,0,0.3)';
  targetCtx.beginPath(); targetCtx.arc(sx+cr*0.1,sy+cr*0.1,cr*0.7,0,TAU); targetCtx.fill();

  /* Внешняя обводка */
  targetCtx.strokeStyle = 'rgba(255,60,20,0.08)'; targetCtx.lineWidth = 2;
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr*1.3,0,TAU); targetCtx.stroke();

  /* Яркая точка в центре */
  dDot(targetCtx, sx, sy, cr * 0.4, 0.6);
}

/* Создать кратер выстрелом */
function createShotCrater(worldX, worldY, charge) {
  if (!_surfCvs) return;
  /* В бою кратеры не создаются */
  if (state.waveActive) return;
  var sx = worldX * scale, sy = worldY * scale;
  var cr = 12 + charge * 20;
  cityCraters.push({ x: sx, y: sy, r: cr });
  if (!state.firstColony) {
    /* Первый кратер требует минимум 40% заряда (charge приходит нормализованный 0-1) */
    if (charge < 0.4) return;
    /* Первый кратер — ПОД городом (на _surfCtx) */
    drawCraterOnCtx(_surfCtx, sx, sy, cr);
    state.firstColony = true;
    state.cities.push({ x: sx, y: sy, r: 22, up: { plant:0, pop:0, sci:0, cap:0, tok:0, turret:0 }, turretCd:0, feed:0, flicker:0, discharge:0, bonusAmmo:0, tokNum:0, born:0 });
    state.clock = 0;             /* игровые часы стартуют с основания колонии */
    state.restStartClock = 0;
    var tutBonus = tutOnFire();
    state.energy += 10; /* базовая награда за первый город */
    buildAmmoBar(); /* базовый снаряд открылся */
    tutFinish();
    showWaveText('☣️ FIRST COLONY ☢️' + (tutBonus > 0 ? ' ⚡+' + tutBonus : ''));
    /* Начать город из этого кратера */
    var numRays = 3 + Math.floor(Math.random() * 4);
    for (var ri = 0; ri < numRays; ri++) {
      cityQueue.push({ type:'line', x:sx, y:sy, a:(ri/numRays)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
    }
  } else {
    /* Запекаем кратер под город (единый стиль/порядок с первым). */
    drawCraterOnCtx(_surfCtx, sx, sy, cr);
    /* Не основываем город поверх уже существующего — иначе накладка/спам.
       Возвращаем энергию за выстрел, чтобы не штрафовать за «мимо». */
    for (var gci = 0; gci < state.cities.length; gci++) {
      var gc = state.cities[gci], gdx = gc.x - sx, gdy = gc.y - sy;
      if (gdx * gdx + gdy * gdy < 62 * 62) {
        state.energy += priced(COLONY_SHOT_COST);
        showWaveText('⚠ СЛИШКОМ БЛИЗКО К ГОРОДУ');
        updateHUD();
        return;
      }
    }
    /* СОБЫТИЕ основания: снаряд-колония сам создаёт РЕАЛЬНЫЙ город в точке
       попадания. Никакой кнопки и никакого разрушения прошлых городов —
       прошлая реализация (freeze + foundSites-кнопка) была источником бага
       «город рождается, а кнопки нет». */
    foundCity(sx, sy);
  }
}

/* ── Постепенный рост города (очередь с прогрессом) ── */
var cityQueue = [];
var cityFrozen = []; /* замороженные элементы — не тухнут */
var cityTier = -1; /* текущий tier при котором строился город */
var cityCraters = []; /* список кратеров */
var THICK_THIN = 0.25, THICK_MED = 0.6, THICK_THICK = 0.7;

function rr(min, max) { return min + Math.random() * (max - min); }
function inB(x, y) { return x > 20 && x < W - 20 && y > 20 && y < H - 20; }
function chooseThick() { var r = Math.random(); return r < 0.5 ? THICK_THIN : r < 0.85 ? THICK_MED : THICK_THICK; }
function getCol(th2, a, colorType) {
  if (a === undefined) a = 1;
  if (colorType === 'blue') return 'rgba(50,150,255,' + (a*0.6) + ')';
  if (colorType === 'red') return 'rgba(255,50,80,' + (a*0.6) + ')';
  if (colorType === 'pink') return 'rgba(255,100,200,' + (a*0.9) + ')';
  if (colorType === 'lime') return 'rgba(150,255,100,' + (a*0.9) + ')';
  if (th2 === THICK_THICK) return 'rgba(255,120,0,' + (a*0.9) + ')';
  if (th2 === THICK_MED)   return 'rgba(255,160,50,' + (a*0.7) + ')';
  return 'rgba(255,200,100,' + (a*0.4) + ')';
}

function dLine(cx2,x1,y1,x2,y2,th2,progress,colorType) {
  if (!progress) progress = 1;
  var px = x1 + (x2 - x1) * progress, py = y1 + (y2 - y1) * progress;
  cx2.strokeStyle = getCol(th2, 1, colorType); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath(); cx2.moveTo(x1,y1); cx2.lineTo(px,py); cx2.stroke();
  if (th2 === THICK_THICK && !colorType) {
    cx2.strokeStyle = getCol(th2, 0.3); cx2.lineWidth = th2 + 2;
    cx2.beginPath(); cx2.moveTo(x1,y1); cx2.lineTo(px,py); cx2.stroke();
  }
}
function dArc(cx2,x,y,rad,sa,ea,th2,progress) {
  if (!progress) progress = 1;
  var curEnd = sa + (ea - sa) * progress;
  cx2.strokeStyle = getCol(th2); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath(); cx2.arc(x,y,rad,sa,curEnd); cx2.stroke();
}
function dDot(cx2,x,y,rad,a,colorType) {
  if (a === undefined) a = 1;
  var gr = cx2.createRadialGradient(x,y,0,x,y,rad);
  if (colorType === 'pink') {
    gr.addColorStop(0, 'rgba(255,100,200,' + a + ')');
    gr.addColorStop(0.5, 'rgba(255,50,150,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(255,0,100,0)');
  } else if (colorType === 'lime') {
    gr.addColorStop(0, 'rgba(150,255,100,' + a + ')');
    gr.addColorStop(0.5, 'rgba(100,255,50,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(50,255,0,0)');
  } else if (colorType === 'blue') {
    gr.addColorStop(0, 'rgba(50,150,255,' + a + ')');
    gr.addColorStop(0.5, 'rgba(30,100,200,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(0,50,150,0)');
  } else if (colorType === 'red') {
    gr.addColorStop(0, 'rgba(255,50,80,' + a + ')');
    gr.addColorStop(0.5, 'rgba(200,30,50,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(150,0,20,0)');
  } else {
    gr.addColorStop(0, 'rgba(255,200,100,' + a + ')');
    gr.addColorStop(0.5, 'rgba(255,140,0,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(255,100,0,0)');
  }
  cx2.fillStyle = gr; cx2.beginPath(); cx2.arc(x,y,rad,0,TAU); cx2.fill();
}
function dPoly(cx2,x,y,rad,sides,rot,th2,progress) {
  if (!progress) progress = 1;
  cx2.strokeStyle = getCol(th2); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath();
  var dSides = Math.ceil(sides * progress);
  for (var i = 0; i <= dSides; i++) {
    var a2 = rot + (i/sides)*TAU;
    var px2 = x + Math.cos(a2)*rad, py2 = y + Math.sin(a2)*rad;
    if (i === 0) cx2.moveTo(px2,py2); else cx2.lineTo(px2,py2);
  }
  cx2.stroke();
}

var OPS = ['line','branch','arc','spider','cdots','circle','polygon'];
var WEIGHTS = [30,25,15,8,7,5,10];
var totalW = 0; for (var wi = 0; wi < WEIGHTS.length; wi++) totalW += WEIGHTS[wi];
function chooseOp() {
  var r = Math.random() * totalW;
  for (var i = 0; i < WEIGHTS.length; i++) { r -= WEIGHTS[i]; if (r <= 0) return OPS[i]; }
  return 'line';
}

function endPt(t) {
  if (t.type === 'line' || t.type === 'branch') return [t.x + Math.cos(t.a)*t.l, t.y + Math.sin(t.a)*t.l];
  if (t.type === 'arc') { var ea = t.sa + t.sw; return [t.x + Math.cos(ea)*t.r, t.y + Math.sin(ea)*t.r]; }
  return [t.x, t.y];
}

function spawnCity(task) {
  if (task.gen > 12 || Math.random() > 0.85) return;
  var ep = endPt(task);
  if (!inB(ep[0], ep[1])) return;
  var nxt = chooseOp(), nth = Math.random() < 0.7 ? task.th : chooseThick(), ng = task.gen + 1;
  var spd = rr(0.0002, 0.0006); /* очень медленная скорость — дни роста */
  /* Редкие цвета: синий (5%), красный (2%), только для line/точек и только тонкие */
  var colorType = null;
  if (Math.random() < 0.05) colorType = 'blue';
  else if (Math.random() < 0.02) colorType = 'red';
  if (colorType) nth = THICK_THIN; /* цветные только тонкие */
  /* Некоторые элементы угасают не до конца */
  var fadeLevel = Math.random() < 0.15 ? rr(0.2, 0.5) : 0;
  switch (nxt) {
    case 'line':    cityQueue.push({ type:'line', x:ep[0], y:ep[1], a:(task.a||0)+rr(-0.3,0.3), l:rr(15,50), th:nth, gen:ng, prog:0, spd:spd, color:colorType, fade:fadeLevel }); break;
    case 'branch':  cityQueue.push({ type:'branch', x:ep[0], y:ep[1], a:task.a||rr(0,TAU), l:rr(20,40), br:2+Math.floor(Math.random()*2), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'arc':     cityQueue.push({ type:'arc', x:ep[0], y:ep[1], r:rr(15,40), sa:rr(0,TAU), sw:rr(PI*0.5,PI*1.5), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'spider':  cityQueue.push({ type:'spider', x:ep[0], y:ep[1], r:rr(20,50), sp:Math.floor(rr(5,12)), th:THICK_THIN, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'cdots':   cityQueue.push({ type:'cdots', x:ep[0], y:ep[1], r:rr(15,35), dots:Math.floor(rr(6,14)), color:colorType, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'circle':  cityQueue.push({ type:'circle', x:ep[0], y:ep[1], r:rr(10,30), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'polygon': cityQueue.push({ type:'polygon', x:ep[0], y:ep[1], r:rr(10,35), sides:Math.floor(rr(3,8)), rot:rr(0,TAU), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
  }
  if (Math.random() < 0.3) {
    cityQueue.push({ type:'line', x:ep[0], y:ep[1], a:(task.a||0)+rr(PI/3,PI), l:rr(10,30), th:THICK_THIN, gen:ng+1, prog:0, spd:rr(0.0002, 0.0006) });
  }
}

function startCityGrowth(craters) {
  cityQueue = [];
  cityCraters = craters;
  /* Выбираем кратер ближайший к маяку */
  var lhX = state.lighthouse.x * scale, lhY = state.lighthouse.y * scale;
  var nearest = null, minDist = Infinity;
  for (var i = 0; i < craters.length; i++) {
    var dx = craters[i].x - lhX, dy = craters[i].y - lhY;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < minDist) { minDist = dist; nearest = craters[i]; }
  }
  if (!nearest) return;
  var sx = nearest.x, sy = nearest.y;
  dDot(_surfCtx, sx, sy, 8, 0.8);
  var numRays = 3 + Math.floor(Math.random() * 4);
  for (var ri = 0; ri < numRays; ri++) {
    cityQueue.push({ type:'line', x:sx, y:sy, a:(ri/numRays)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
  }
}

function updateCityGrowth(dt) {
  if (cityQueue.length === 0) return;
  /* Мягкое затухание предыдущих линий пока город растёт */
  _surfCtx.fillStyle = 'rgba(0,0,0,0.02)';
  _surfCtx.fillRect(0, 0, W, H);
  var completed = [];
  for (var i = cityQueue.length - 1; i >= 0; i--) {
    var t = cityQueue[i];
    t.prog += t.spd * (dt * 60); /* нормализация к 60fps */
    if (t.prog > 1) t.prog = 1;
    switch (t.type) {
      case 'line': {
        var ex = t.x + Math.cos(t.a)*t.l, ey = t.y + Math.sin(t.a)*t.l;
        dLine(_surfCtx, t.x,t.y,ex,ey,t.th,t.prog,t.color); break;
      }
      case 'branch': {
        var spA = PI / (t.br+1);
        for (var bi = 0; bi < t.br; bi++) {
          var ba = t.a - spA*(t.br-1)/2 + spA*bi;
          dLine(_surfCtx, t.x,t.y, t.x+Math.cos(ba)*t.l, t.y+Math.sin(ba)*t.l, t.th, t.prog);
        } break;
      }
      case 'arc': dArc(_surfCtx, t.x,t.y,t.r,t.sa,t.sa+t.sw,t.th,t.prog); break;
      case 'spider': {
        dDot(_surfCtx, t.x,t.y,3,t.prog);
        var spikesShow = Math.ceil(t.sp * t.prog);
        for (var spi = 0; spi < spikesShow; spi++) {
          var spa2 = (spi/t.sp)*TAU;
          var lenProg = (spi < spikesShow - 1) ? 1 : ((t.prog * t.sp) % 1);
          dLine(_surfCtx, t.x,t.y, t.x+Math.cos(spa2)*t.r*lenProg, t.y+Math.sin(spa2)*t.r*lenProg, t.th, 1);
        }
        if (t.prog > 0.5) {
          var ringProg = (t.prog - 0.5) * 2;
          _surfCtx.strokeStyle = getCol(THICK_THIN, ringProg * 0.5); _surfCtx.lineWidth = THICK_THIN;
          _surfCtx.beginPath(); _surfCtx.arc(t.x,t.y,t.r*0.5,0,TAU*ringProg); _surfCtx.stroke();
        }
        break;
      }
      case 'cdots': {
        var dotsShow = Math.ceil(t.dots * t.prog);
        for (var di = 0; di < dotsShow; di++) {
          var da = (di/t.dots)*TAU;
          var dotAlpha = (di < dotsShow - 1) ? 0.8 : 0.8 * ((t.prog * t.dots) % 1);
          dDot(_surfCtx, t.x+Math.cos(da)*t.r, t.y+Math.sin(da)*t.r, 2+Math.random()*2, dotAlpha, t.color);
        } break;
      }
      case 'circle': {
        _surfCtx.strokeStyle = getCol(t.th); _surfCtx.lineWidth = t.th;
        _surfCtx.beginPath(); _surfCtx.arc(t.x,t.y,t.r,0,TAU*t.prog); _surfCtx.stroke(); break;
      }
      case 'polygon': dPoly(_surfCtx, t.x,t.y,t.r,t.sides,t.rot,t.th,t.prog); break;
    }
    if (t.prog >= 1) {
      /* С вероятностью 5% элемент "замерзает" и больше не тухнет */
      if (Math.random() < 0.05) {
        cityFrozen.push({ type: t.type, x: t.x, y: t.y, a: t.a, l: t.l, r: t.r, sa: t.sa, sw: t.sw, th: t.th, br: t.br, sp: t.sp, dots: t.dots, sides: t.sides, rot: t.rot, prog: 1, color: t.color });
        /* При заморозке с шансом 50% создаём новый seed в радиусе */
        if (Math.random() < 0.5) {
          var ep = endPt(t);
          var angle = rr(0, TAU);
          var dist = rr(20, 60);
          var nx = ep[0] + Math.cos(angle) * dist, ny = ep[1] + Math.sin(angle) * dist;
          if (inB(nx, ny)) {
            dDot(_surfCtx, nx, ny, 6, 0.7);
            var numNewRays = 2 + Math.floor(Math.random() * 3);
            for (var nri = 0; nri < numNewRays; nri++) {
              cityQueue.push({ type:'line', x:nx, y:ny, a:(nri/numNewRays)*TAU + rr(0,0.3), l:rr(20,50), th:chooseThick(), gen:0, prog:0, spd:rr(0.0002, 0.0006) });
            }
          }
        }
      } else if (t.fade > 0) {
        /* Элемент угасает не до конца */
        cityFrozen.push({ type: t.type, x: t.x, y: t.y, a: t.a, l: t.l, r: t.r, sa: t.sa, sw: t.sw, th: t.th, br: t.br, sp: t.sp, dots: t.dots, sides: t.sides, rot: t.rot, prog: 1, color: t.color, fade: t.fade });
      }
      /* Под конец строительства — яркие одинокие точки розовые и лайм */
      if (t.gen > 8 && Math.random() < 0.08) {
        var brightColor = Math.random() < 0.5 ? 'pink' : 'lime';
        var ep2 = endPt(t);
        dDot(_surfCtx, ep2[0], ep2[1], rr(3,6), 1, brightColor);
        cityFrozen.push({ type: 'brightdot', x: ep2[0], y: ep2[1], r: rr(3,6), color: brightColor, prog: 1 });
      }
      completed.push(t);
      cityQueue.splice(i, 1);
    }
  }
  /* Рисуем замороженные элементы поверх затухающего слоя */
  for (var fi = 0; fi < cityFrozen.length; fi++) {
    var f = cityFrozen[fi];
    /* Применяем fadeLevel если есть */
    if (f.fade && f.fade > 0) {
      var oldAlpha = _surfCtx.globalAlpha;
      _surfCtx.globalAlpha = f.fade;
    }
    switch (f.type) {
      case 'line': {
        var ex2 = f.x + Math.cos(f.a)*f.l, ey2 = f.y + Math.sin(f.a)*f.l;
        dLine(_surfCtx, f.x,f.y,ex2,ey2,f.th,1,f.color); break;
      }
      case 'branch': {
        var spA2 = PI / (f.br+1);
        for (var bi2 = 0; bi2 < f.br; bi2++) {
          var ba2 = f.a - spA2*(f.br-1)/2 + spA2*bi2;
          dLine(_surfCtx, f.x,f.y, f.x+Math.cos(ba2)*f.l, f.y+Math.sin(ba2)*f.l, f.th, 1);
        } break;
      }
      case 'arc': dArc(_surfCtx, f.x,f.y,f.r,f.sa,f.sa+f.sw,f.th,1); break;
      case 'spider': {
        dDot(_surfCtx, f.x,f.y,3,1);
        for (var spi2 = 0; spi2 < f.sp; spi2++) {
          var spa3 = (spi2/f.sp)*TAU;
          dLine(_surfCtx, f.x,f.y, f.x+Math.cos(spa3)*f.r, f.y+Math.sin(spa3)*f.r, f.th, 1);
        }
        _surfCtx.strokeStyle = getCol(THICK_THIN, 0.5); _surfCtx.lineWidth = THICK_THIN;
        _surfCtx.beginPath(); _surfCtx.arc(f.x,f.y,f.r*0.5,0,TAU); _surfCtx.stroke();
        break;
      }
      case 'cdots': {
        for (var di2 = 0; di2 < f.dots; di2++) {
          var da2 = (di2/f.dots)*TAU;
          dDot(_surfCtx, f.x+Math.cos(da2)*f.r, f.y+Math.sin(da2)*f.r, 2+Math.random()*2, 0.8, f.color);
        } break;
      }
      case 'brightdot': {
        dDot(_surfCtx, f.x, f.y, f.r, 1, f.color); break;
      }
      case 'circle': {
        _surfCtx.strokeStyle = getCol(f.th); _surfCtx.lineWidth = f.th;
        _surfCtx.beginPath(); _surfCtx.arc(f.x,f.y,f.r,0,TAU); _surfCtx.stroke(); break;
      }
      case 'polygon': dPoly(_surfCtx, f.x,f.y,f.r,f.sides,f.rot,f.th,1); break;
    }
    /* Восстанавливаем alpha если изменяли */
    if (f.fade && f.fade > 0) {
      _surfCtx.globalAlpha = 1;
    }
  }
  for (var ci = 0; ci < completed.length; ci++) spawnCity(completed[ci]);
}

/* Синий ток по проводу — зазубренная молния, как плазма снарядов */
/* Зазубренная молния по ломаному пути (массив точек): каждый сегмент дрожит
   отдельно, поэтому ток скачет зигзагом узел→узел. */
function drawWireBolt(points, intensity) {
  if (!points || points.length < 2) return;
  var col = (intensity > 1) ? '#bfeaff' : '#3ad0ff';
  ctx.strokeStyle = col;
  ctx.shadowColor = '#3ad0ff'; ctx.shadowBlur = 6;
  ctx.lineWidth = 1.3 + intensity * 1.6;
  ctx.globalAlpha = Math.min(0.5 + intensity * 0.5, 1);
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for (var i = 1; i < points.length; i++) {
    var ax = points[i - 1].x, ay = points[i - 1].y, bx = points[i].x, by = points[i].y;
    var dxr = bx - ax, dyr = by - ay, len = Math.sqrt(dxr * dxr + dyr * dyr) || 1;
    var nx = -dyr / len, ny = dxr / len;
    var segs = 2 + Math.floor(len / 22);
    for (var s = 1; s < segs; s++) {
      var t = s / segs, j = (Math.random() - 0.5) * (4 + intensity * 7);
      ctx.lineTo(ax + dxr * t + nx * j, ay + dyr * t + ny * j);
    }
    ctx.lineTo(bx, by);
  }
  ctx.stroke();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

/* Отрисовка кадра спрайт-листа. angle=0 → как в исходнике. anchorY: 0=верх,
   0.5=центр, 1=низ спрайта у точки (cx,cy). Возвращает false, если не загружено. */
function drawSpriteFrame(key, frameIdx, cx, cy, angle, scale, anchorY) {
  var img = ASSET_IMG[key], meta = ASSET_DATA[key];
  if (!img || !img.complete || !img.naturalWidth) return false;
  var fw = meta.fw, fh = meta.fh;
  var nfr = meta.frames || 1;
  var fi = ((frameIdx % nfr) + nfr) % nfr;
  var sxp = fi * fw, dw = fw * scale, dh = fh * scale;
  var oy = (anchorY === undefined ? 0.5 : anchorY) * dh;
  ctx.save();
  ctx.translate(cx, cy);
  if (angle) ctx.rotate(angle);
  var prev = ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, sxp, 0, fw, fh, -dw / 2, -oy, dw, dh);
  ctx.imageSmoothingEnabled = prev;
  ctx.restore();
  return true;
}

/* Вспышка у дула турели в момент выстрела (аддитивная) */
function turretMuzzle(pvx, pvy, aa, lvl, flash) {
  if (!(flash > 0)) return;
  var len = (18 + lvl * 3) * 0.85, a = Math.min(1, flash / 0.12);
  var tx = pvx + Math.cos(aa) * len, ty = pvy + Math.sin(aa) * len;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(170,235,255,' + (a * 0.8) + ')';
  ctx.beginPath(); ctx.arc(tx, ty, 2.5 + a * 3.5, 0, TAU); ctx.fill();
  ctx.restore();
}

/* Города в мире: электростанции, провода с током, мерцание света (под облаками) */
function drawCityWorld() {
  if (!state.colonized || !state.cities.length) return;
  var lh = toScreen(state.lighthouse.x, state.lighthouse.y);
  var ammoColor = getActiveAmmoColor();
  for (var i = 0; i < state.cities.length; i++) {
    var c = state.cities[i];
    var plants = plantPositions(c);
    var pyl = pylonPositions(c);
    var path = wirePath(c);
    var flow = Math.max(c.feed, state.dragging ? 0.3 : 0);
    /* провод-основа: ломаная через пилоны/станции к башне */
    ctx.save();
    ctx.strokeStyle = 'rgba(120,160,180,0.30)'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
    for (var wp = 1; wp < path.length; wp++) ctx.lineTo(path[wp].x, path[wp].y);
    ctx.stroke();
    ctx.restore();
    /* пилоны — заземлённые опоры вдоль провода (часть мира) */
    for (var pk = 0; pk < pyl.length; pk++) {
      var pp2 = pyl[pk];
      ctx.save(); ctx.translate(pp2.x, pp2.y);
      ctx.strokeStyle = '#4a6270'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 5); ctx.stroke();   /* столбик */
      ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(4, -5); ctx.stroke(); /* перекладина */
      ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(3, 5); ctx.stroke();   /* основание */
      ctx.fillStyle = hexToRgba('#37e0ff', 0.4 + 0.6 * flow); ctx.fillRect(-1.3, -8.3, 2.6, 2.6); /* изолятор-огонёк */
      ctx.restore();
    }
    /* ток по проводам во время зарядки — синими молниями зигзагом по сегментам */
    if (flow > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawWireBolt(path, flow);
      ctx.restore();
    }
    /* яркая вспышка-разряд в момент выстрела (ушедшая в маяк дуга) */
    if (c.discharge > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var di = 0.7 + c.discharge * 1.8;
      drawWireBolt(path, di);
      drawWireBolt(path, di);
      ctx.restore();
    }
    /* электростанции */
    for (var k3 = 0; k3 < plants.length; k3++) {
      var pp = plants[k3];
      ctx.save(); ctx.translate(pp.x, pp.y);
      ctx.fillStyle = '#0a1a22'; ctx.strokeStyle = '#37e0ff'; ctx.lineWidth = 1.5;
      ctx.fillRect(-6, -6, 12, 12); ctx.strokeRect(-6, -6, 12, 12);
      ctx.fillStyle = hexToRgba('#ffd600', 0.7 + 0.3 * Math.sin(state.time * 6 + k3));
      ctx.fillRect(-2.5, -2.5, 5, 5);
      ctx.restore();
    }
    /* Токамак — заземлённый реактор: платформа-опора у города + вращающееся кольцо */
    if (c.up.tok > 0) {
      var tr0 = tokRing(c), trad = tr0.r, tcx = tr0.x, tcy = tr0.y;
      /* опора-платформа от города к кольцу — читается как постройка на земле */
      ctx.save();
      ctx.strokeStyle = '#4a3a6a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tcx - trad * 0.7, c.y); ctx.lineTo(tcx, tcy + trad * 0.5); ctx.lineTo(tcx + trad * 0.7, c.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tcx, tcy + trad); ctx.lineTo(tcx, tcy + trad * 0.5); ctx.stroke();
      ctx.restore();
      /* кольцо-реактор */
      ctx.save(); ctx.translate(tcx, tcy); ctx.rotate(state.time * 0.6);
      ctx.strokeStyle = '#7a3bff'; ctx.lineWidth = 2.5; ctx.shadowColor = '#a06bff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(0, 0, trad, 0, TAU); ctx.stroke();
      ctx.lineWidth = 1.5;
      var spokes = 8 + c.up.tok * 2;
      for (var sp = 0; sp < spokes; sp++) { var sa = (sp / spokes) * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(sa) * trad * 0.45, Math.sin(sa) * trad * 0.45); ctx.lineTo(Math.cos(sa) * trad, Math.sin(sa) * trad); ctx.stroke(); }
      ctx.fillStyle = hexToRgba('#ff44cc', 0.6 + 0.4 * Math.sin(state.time * 5)); ctx.beginPath(); ctx.arc(0, 0, trad * 0.32, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.restore();
      /* номер токамака */
      if (c.tokNum > 0) {
        ctx.save(); ctx.fillStyle = '#e6d2ff'; ctx.font = '700 9px "Chakra Petch"';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('№' + c.tokNum, tcx, tcy - trad - 6); ctx.restore();
      }
    }
    /* Туррель — лазерный спрайт (mk2/3/4 по уровню), ствол смотрит на цель.
       Кадр = стадия зарядки (0=idle … 9=заряжен, 10=после выстрела). */
    if (c.up.turret > 0) {
      var tlvl = c.up.turret;
      var tkey = tlvl >= 3 ? 'turret_mk4' : (tlvl === 2 ? 'turret_mk3' : 'turret_mk2');
      var aa = (c.turretAng === undefined) ? -Math.PI / 2 : c.turretAng;
      var pvx = c.x + c.r * 0.6, pvy = c.y - c.r * 0.4;
      var nfr = (ASSET_DATA[tkey] && ASSET_DATA[tkey].frames) || 11;
      var tframe;
      if (c.turretFlash > 0) tframe = nfr - 1;                       /* после выстрела */
      else if (c.turretAim) {                                        /* заряжается к выстрелу */
        var prog = (c.turretCdMax > 0) ? 1 - Math.max(0, Math.min(1, c.turretCd / c.turretCdMax)) : 0;
        tframe = Math.round(prog * (nfr - 2));
      } else tframe = 0;                                             /* покой */
      var tsc = (18 + tlvl * 3) / ((ASSET_DATA[tkey] && ASSET_DATA[tkey].fh) || 80);
      /* спрайт «стволом вверх» (−90°); доворачиваем на угол цели, база у пивота */
      if (!drawSpriteFrame(tkey, tframe, pvx, pvy, aa + Math.PI / 2, tsc, 1)) {
        /* fallback — процедурная пушка, пока спрайт не загружен */
        ctx.save(); ctx.translate(pvx, pvy); ctx.rotate(aa);
        ctx.fillStyle = '#26343c'; ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 1.5;
        ctx.fillRect(-3, -3, 6, 6); ctx.strokeRect(-3, -3, 6, 6);
        ctx.fillStyle = '#8fd0ff'; ctx.fillRect(0, -1.4, 8 + tlvl * 2, 2.8);
        ctx.restore();
      }
      turretMuzzle(pvx, pvy, aa, tlvl, c.turretFlash);
    }
    /* мерцание света в городе (гаснет частями) */
    if (c.flicker > 0.02) {
      for (var f = 0; f < 3; f++) {
        var fa = Math.random() * TAU, fd = Math.random() * c.r;
        ctx.fillStyle = 'rgba(0,0,0,' + (c.flicker * 0.5) + ')';
        ctx.fillRect(c.x + Math.cos(fa) * fd - 5, c.y + Math.sin(fa) * fd - 5, 10, 10);
      }
    }
  }
}

      }

  }
  ctx.drawImage(_surfCvs, 0, 0);

  /* Subtle animated shimmer — мерцающие круги поверх поверхности */
  var t = state.time * 0.3;
  ctx.globalAlpha = 0.025;
  for (var si = 0; si < 5; si++) {

    var sy2 = (Math.cos(t * 0.7 + si * 2.1) * 0.5 + 0.5) * H;
    var shimR = 80 + si * 30;

    grad.addColorStop(0, 'rgba(40,60,80,1)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx2, sy2, shimR, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* Динамическое освещение смога от взрывов и снарядов */
  drawSmogLighting();

  /* Электростанции, провода с током, мерцание — часть мира (под облаками) */
  drawCityWorld();
}

function drawSmogLighting() {
  if (tw === 0) return;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; // Аддитивное наложение для свечения

  /* Освещение от источников света (взрывов) */
  for (var i = 0; i < state.lights.length; i++) {
    var light = state.lights[i];
    var sc = toScreen(light.x, light.y);
    var sx = sc[0], sy = sc[1];
    var intensity = light.life / light.maxLife;
    var radius = light.radius * scale * 1.5;

    /* Извлекаем RGB из цвета */
    var c = light.color.replace('#','');
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var r = parseInt(c.substring(0,2),16);
    var g = parseInt(c.substring(2,4),16);
    var b = parseInt(c.substring(4,6),16);

    /* Рисуем свет с модуляцией по heightmap */
    drawLightWithHeightmap(sx, sy, radius, r, g, b, intensity * 0.6);
  }

  /* Освещение от летящих снарядов */
  for (var pi = 0; pi < state.projectiles.length; pi++) {
    var proj = state.projectiles[pi];
    if (!proj.alive) continue;
    var pos = proj.body.getPosition();
    var psc = toScreen(pos.x, pos.y);
    var psx = psc[0], psy = psc[1];
    var pRadius = proj.radius * scale * 4;

    var pc = proj.ammo.color.replace('#','');
    if (pc.length === 3) pc = pc[0]+pc[0]+pc[1]+pc[1]+pc[2]+pc[2];
    var pr = parseInt(pc.substring(0,2),16);
    var pg = parseInt(pc.substring(2,4),16);
    var pb = parseInt(pc.substring(4,6),16);

    drawLightWithHeightmap(psx, psy, pRadius, pr, pg, pb, 0.25);
  }

  /* Освещение от маяка */
  var lh = state.lighthouse;
  var lsc = toScreen(lh.x, lh.y);
  var lsx = lsc[0], lsy = lsc[1];
  var ammoColor = getActiveAmmoColor();
  var lRadius = 0.7 * lhScale * 6;

  var lc = ammoColor.replace('#','');
  if (lc.length === 3) lc = lc[0]+lc[0]+lc[1]+lc[1]+lc[2]+lc[2];
  var lr = parseInt(lc.substring(0,2),16);
  var lg = parseInt(lc.substring(2,4),16);
  var lb = parseInt(lc.substring(4,6),16);

  var pulse = Math.sin(state.lighthousePulse) * 0.1 + 0.9;
  drawLightWithHeightmap(lsx, lsy, lRadius, lr, lg, lb, 0.35 * pulse);

  ctx.restore();
}

/* Рисует освещение с модуляцией по heightmap - освещает только облака */
function drawLightWithHeightmap(cx, cy, radius, r, g, b, maxIntensity) {
  var steps = 32; // Количество концентрических кругов
  var angularSteps = 48; // Количество точек на окружности

  for (var ri = 0; ri < steps; ri++) {
    var rad = (ri / steps) * radius;
    var nextRad = ((ri + 1) / steps) * radius;
    var falloff = 1 - (ri / steps); /* Затухание от центра */
    var baseIntensity = maxIntensity * falloff * falloff;

    ctx.beginPath();
    for (var ai = 0; ai <= angularSteps; ai++) {
      var angle = (ai / angularSteps) * TAU;
      var px = cx + Math.cos(angle) * rad;
      var py = cy + Math.sin(angle) * rad;

      /* Сэмплируем heightmap */
      var h = getHeightAt(px, py);
      /* Усиливаем контраст для модуляции */
      var cloudness = (h - 0.5) * 2.5 + 0.5;
      cloudness = Math.max(0, Math.min(1, cloudness));

      /* Черные области (провалы) не освещаются */
      if (cloudness < 0.3) cloudness = 0;
      else cloudness = (cloudness - 0.3) / 0.7; /* Ремап 0.3-1 -> 0-1 */

      var intensity = baseIntensity * cloudness;

      if (ai === 0) {
        ctx.moveTo(px, py);
      } else {
        /* Рисуем небольшие сегменты с индивидуальной прозрачностью */
        var prevAngle = ((ai - 1) / angularSteps) * TAU;
        var ppx = cx + Math.cos(prevAngle) * rad;
        var ppy = cy + Math.sin(prevAngle) * rad;

        ctx.fillStyle = 'rgba('+r+','+g+','+b+','+intensity+')';
        ctx.beginPath();
        ctx.moveTo(ppx, ppy);
        ctx.lineTo(px, py);
        var npx = cx + Math.cos(angle) * nextRad;
        var npy = cy + Math.sin(angle) * nextRad;
        ctx.lineTo(npx, npy);
        var nppx = cx + Math.cos(prevAngle) * nextRad;
        var nppy = cy + Math.sin(prevAngle) * nextRad;
        ctx.lineTo(nppx, nppy);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}
