          var perpLen = Math.sqrt(perpX*perpX + perpY*perpY);
          if (perpLen > 0.1) {
            perpX /= perpLen; perpY /= perpLen;
          }
          var dodgeDir = (Math.random() < 0.5) ? 1 : -1;
          var dodgeForce = 180 * e.body.getMass();
          e.body.applyLinearImpulse(Vec2(perpX * dodgeDir * dodgeForce, perpY * dodgeDir * dodgeForce), e.body.getPosition());
          e.dodgeCooldown = 1.5;
          e.dodgeDir = { x: perpX * dodgeDir, y: perpY * dodgeDir };
          spawnHitParticles(scoutPos.x, scoutPos.y, '#39ff14', 6);
          break;
        }
      }
    }

    /* Lv.2 Scout Flicker: every 3s, alpha=0.3 for 0.8s, no collision */
    if (e.type === 'scout' && e.level === 2) {
      e.flickerTimer += dt;
      if (e.flickerTimer >= 3 && !e.flickering) {
        e.flickerTimer = 0;
        e.flickering = true;
        e.body.getFixtureList().setFilterData({
          categoryBits: CFG.CAT_ENEMY,
          maskBits: 0
        });
      }
      if (e.flickering) {
        e.flickerTimer += dt;
        if (e.flickerTimer >= 0.8) {
          e.flickering = false;
          e.flickerTimer = 0;
          e.body.getFixtureList().setFilterData({
            categoryBits: CFG.CAT_ENEMY,
            maskBits: CFG.CAT_PROJ
          });
        }
      }
    }

    /* Lv.2 Soldier Block: every 4s, shield for 1s (frontal invulnerability) */
    if (e.type === 'soldier' && e.level === 2) {
      e.blockTimer += dt;
      if (e.blockTimer >= 4) {
        e.blockTimer = 0;
        e.blockActive = true;
      }
      if (e.blockActive) {
        e.blockTimer += dt;
        if (e.blockTimer >= 1) {
          e.blockActive = false;
          e.blockTimer = 0;
        }
      }
    }

    /* Lv.1 Berserker Blood trail: rage>1.5x → particle trail + speed buff allies */
    if (e.type === 'berserker' && e.level === 1 && e.rageSpeed > 1.5) {
      ep = e.body.getPosition();
      if (Math.random() < 0.3) {
        addParticle(ep.x + (Math.random()-0.5)*0.3, ep.y + (Math.random()-0.5)*0.3,
                    (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5,
                    0.15, '#c62828', 0.6);
      }
      /* Speed buff to allies within r<3 */
      for (var bi = 0; bi < state.enemies.length; bi++) {
        var ally = state.enemies[bi];
        if (ally === e || !ally.alive || ally.type === 'berserker') continue;
        var ap = ally.body.getPosition();
        var adx = ap.x - ep.x, ady = ap.y - ep.y;
        var adist = Math.sqrt(adx*adx + ady*ady);
        if (adist < 3) {
          if (!ally.bloodTrailBuff) ally.bloodTrailBuff = 0;
          ally.bloodTrailBuff = Math.max(ally.bloodTrailBuff, 2.0);
        }
      }
    }

    /* Decay blood trail buff */
    if (e.bloodTrailBuff && e.bloodTrailBuff > 0) {
      e.bloodTrailBuff -= dt;
      if (e.bloodTrailBuff < 0) e.bloodTrailBuff = 0;
    }

    var speedMul = e.frozen ? 0.15 : e.rageSpeed;
    /* Apply blood trail buff */
    if (e.bloodTrailBuff && e.bloodTrailBuff > 0) {
      speedMul *= 1.2;
    }

    ep = e.body.getPosition();
    /* ФАЗА 12: Применяем множитель уровня к скорости */
    var targetSpeed = e.def.speed * speedMul * (e.levelSpeedMult || 1.0);
    var mass = e.body.getMass();

    var fy = targetSpeed * CFG.ENEMY_DAMPING * mass;
    var fx = 0;

    var cx = CFG.WORLD_W / 2;
    if (ep.x < 2) fx += (2 - ep.x) * 2 * mass;
    else if (ep.x > CFG.WORLD_W - 2) fx += (CFG.WORLD_W - 2 - ep.x) * 2 * mass;
    if (Math.abs(ep.x - cx) > CFG.WORLD_W * 0.35) {
      fx += (cx - ep.x) * 0.15 * mass;
    }

    e.body.applyForceToCenter(Vec2(fx, fy));

    /* Base breach */
    if (ep.y > baseY) {
      /* shield generator absorbs */
      if (state.shieldCharges > 0) {
        state.shieldCharges--;
        spawnHitParticles(ep.x, baseY, '#4fc3f7', 8);
        addParticle(ep.x, baseY, 0, 0, 1.5, 'rgba(79,195,247,0.3)', 0.4, 'ring');
      } else {
        state.lives--;
        state.shakeTimer = 0.3;
        state.shakeIntensity = 6;
        spawnHitParticles(ep.x, baseY, '#ff1744', 12);
      }
      e.alive = false;
      e.deathTimer = 0.01;
      if (state.lives <= 0) {
        state.gameOver = true;
        document.getElementById('go-score').textContent = 'Счёт: ' + state.score;
        document.getElementById('game-over-overlay').classList.add('open');
      }
    }
    if (ep.x < -3 || ep.x > CFG.WORLD_W + 3) {
      e.alive = false;
      e.deathTimer = 0.01;
    }
  }

  /* Update projectiles — mark dead ones for deferred destruction */
  for (i = state.projectiles.length - 1; i >= 0; i--) {
    var p = state.projectiles[i];
    p.lifetime -= dt;
    p.boltTimer += dt;
    /* Обновляем плазменную систему */
    updateProjectilePlasma(p);
    if (!p.alive || p.lifetime <= 0) {
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
      continue;
    }
    var pp = p.body.getPosition();
    var vel = p.body.getLinearVelocity();
    var speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);

    /* Взрыв при любой остановке - даже на высокой скорости */
    if (speed < 2.0 && p.alive) {
      var chargeNorm = p.charge / CFG.MAX_CHARGE; /* 0-1 */
      var chargeMult = 0.5 + chargeNorm * 1.5;
      spawnPlasmaExplosion(pp.x, pp.y, p.ammo.color, 25, chargeNorm);
      spawnElectricSparks(pp.x, pp.y, p.ammo.color, 48);
      /* Молнии взрыва — радиус совпадает с кольцами */
      spawnExplosionBolts(pp.x, pp.y, p.ammo.color, 2.5 * chargeMult, 8 + Math.floor(chargeNorm * 8));
      /* Создаём кратер при остановке снаряда на земле */
      createShotCrater(pp.x, pp.y, chargeNorm);
      p.alive = false;
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
      continue;
    }

    p.trail.push({ x: pp.x, y: pp.y, t: 0.3 });
    if (p.trail.length > 16) p.trail.shift();
    for (var j = p.trail.length - 1; j >= 0; j--) {
      p.trail[j].t -= dt;
      if (p.trail[j].t <= 0) p.trail.splice(j, 1);
    }

    /* Привязываем молнии снаряда к ближайшим врагам */
    if (p.charge > 0 && p.plasmaNodes) {
      var pChargeNorm = p.charge / CFG.MAX_CHARGE;
      var seekRadius = 3.0 + pChargeNorm * 2.0; /* Радиус поиска врагов 3-5 */

      /* Каждая молния ищет ближайшего врага */
      for (var ni = 0; ni < p.plasmaNodes.length; ni++) {
        var node = p.plasmaNodes[ni];
        var closestEnemy = null;
        var closestDist = seekRadius;

        for (var eix = 0; eix < state.enemies.length; eix++) {
          var enemy = state.enemies[eix];
          if (!enemy.alive) continue;

          var epos = enemy.body.getPosition();
          var dx = epos.x - pp.x;
          var dy = epos.y - pp.y;
          var dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < closestDist) {
            closestDist = dist;
            closestEnemy = enemy;
          }
        }

        /* Привязываем врага к ноде и обновляем относительные координаты */
        node.targetEnemy = closestEnemy;
        if (closestEnemy) {
          var eposTarget = closestEnemy.body.getPosition();
          node.enemyRelX = eposTarget.x - pp.x;
          node.enemyRelY = eposTarget.y - pp.y;
        }

        /* Урон от каждой молнии раз в 0.3 секунды */
        if (!node.damageTimer) node.damageTimer = 0;
        node.damageTimer += dt;

        if (node.damageTimer >= 0.3 && closestEnemy) {
          node.damageTimer = 0;
          var dmg = (2 + pChargeNorm * 3) * 0.05; /* Урон 0.1-0.25 за тик */
          if (closestEnemy.shielded) dmg *= 0.5;
          closestEnemy.hp -= dmg;
          closestEnemy.flashTimer = 0.06;

          /* Небольшие искры на месте попадания молнии */
          var enemyPos = closestEnemy.body.getPosition();
          spawnElectricSparks(enemyPos.x, enemyPos.y, p.ammo.color, 1);

          if (closestEnemy.hp <= 0) {
            killEnemy(closestEnemy);
          }
        }
      }
    }
    if (pp.x < -3 || pp.x > CFG.WORLD_W + 3 || pp.y < -4 || pp.y > worldH + 3) {
      /* Снаряд попал в землю — создать кратер */
      if (pp.y > worldH - 2) {
        createShotCrater(pp.x, pp.y, p.charge / CFG.MAX_CHARGE);
        spawnHitParticles(pp.x, pp.y, p.ammo.color, 10);
      }
      deferredDestroy.push(p.body);
      state.projectiles.splice(i, 1);
    }
  }

  /* lightning arc visuals decay */
  for (i = state.lightningArcs.length - 1; i >= 0; i--) {
    state.lightningArcs[i].life -= dt;
    if (state.lightningArcs[i].life <= 0) state.lightningArcs.splice(i, 1);
  }

  /* Обновляем молнии взрывов */
  for (i = explosionBolts.length - 1; i >= 0; i--) {
    explosionBolts[i].life -= dt;
    if (explosionBolts[i].life <= 0) explosionBolts.splice(i, 1);
  }

  updateTesla(dt);
  updateSingularities(dt);
  updateParticles(dt);
  updateLights(dt);
  updateCraters(dt);
  updatePlateDebris(dt);
  updateShrapnel(dt);
  updateBurning(dt);

  /* === PHYSICS STEP with deferred body management === */
  /* First: destroy queued bodies BEFORE step */
  processDeferredDestroy();

  /* Run physics step */
  insideStep = true;
  world.step(CFG.PHYS_DT, CFG.VEL_ITER, CFG.POS_ITER);
  insideStep = false;

  /* After step: create any deferred bodies (scatter sub-projectiles, etc.) */
  processDeferredBodies();

  updateHUD();
}

/* ═══════════════ RENDERING ═══════════════ */
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  if (state.shakeTimer > 0) {
    var s = state.shakeIntensity * (state.shakeTimer / 0.3);
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }

  drawBackground();       /* город + освещение */

  /* Кратеры разрушения — рисуются ПОВЕРХ города */
  for (var dci = 0; dci < destructionCraters.length; dci++) {
    var dc = destructionCraters[dci];
    drawCraterOnCtx(ctx, dc.x, dc.y, dc.r);
  }

  drawBaseLine();
  drawSingularities();
  drawEnemies();           /* враги ПОД облаками */
  drawPlateDebris();       /* отлетевшие пластины брони */
  /* Маяк ПОД облаками когда lhAbove < 0.5 */
  if (state.lhAbove < 0.5) {
    ctx.save();
    ctx.globalAlpha = 0.3 + state.lhAbove * 1.4;
    drawLighthouse();
    ctx.restore();
  }
  /* Снаряды ПОД облаками когда маяк не поднят */
  if (!state.waveActive) {
    drawProjectiles();
    drawParticles();
  }
  /* Линия прицела ПОД облаками */
  if (state.dragging) drawAimLine();
  drawCloudLayer();        /* облака поверх врагов + луч перекрашивает в красный */
  /* Маяк НАД облаками когда lhAbove >= 0.5 */
  if (state.lhAbove >= 0.5) {
    ctx.save();
    ctx.globalAlpha = state.lhAbove;
    drawLighthouse();
    ctx.restore();
  }
  /* Снаряды НАД облаками в бою */
  if (state.waveActive) {
    drawProjectiles();
    drawParticles();
  }
  drawShrapnel();          /* осколки от бочек — поверх облаков */
  drawLightningArcs();
  if (state.dragging) drawAimUI();
  ctx.restore();

  /* ── Слой 1 облаков поверх всего (включая UI) ── */
  drawCloudLayer1();

  /* ── Круг-подсказка туториала ПОВЕРХ всех облаков ── */
  if (_tut.state === 'hold' || (_tut.state === 'active' && _tutDragPct() < 0.2)) {
    var lhTut = state.lighthouse;
    var scTut = toScreen(lhTut.x, lhTut.y);
    var rTut = 0.7 * lhScale;
    var tutPulse = Math.sin(state.time * 3) * 0.3 + 0.7;
    ctx.strokeStyle = 'rgba(255,171,0,' + (0.85 * tutPulse) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(scTut[0], scTut[1], rTut + 10, 0, TAU);
    ctx.stroke();
  }
}

/* ── Статичная поверхность города (кэшируется при resize) ── */
var _surfCvs = null, _surfCtx = null;
function generateSurface(w, h) {
  _surfCvs = document.createElement('canvas');
  _surfCvs.width = w; _surfCvs.height = h;
  _surfCtx = _surfCvs.getContext('2d');

  var sRes = 4; /* px per cell */
  var sw = Math.ceil(w / sRes), sh = Math.ceil(h / sRes);
  var sMap = new Float32Array(sw * sh);

  /* value noise */
  function shash(ix, iy) { var d = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453; return d - Math.floor(d); }
  function sNoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = shash(ix,iy), b = shash(ix+1,iy), c = shash(ix,iy+1), d = shash(ix+1,iy+1);
    return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
  }
  var socts = [
    { s:0.008, a:0.45 }, { s:0.022, a:0.25 }, { s:0.06, a:0.15 },
    { s:0.14, a:0.10 }, { s:0.35, a:0.05 }
  ];
  for (var cy = 0; cy < sh; cy++) {
    for (var cx = 0; cx < sw; cx++) {
      var px = cx * sRes, py = cy * sRes, v = 0;
      for (var oi = 0; oi < socts.length; oi++) v += sNoise(px * socts[oi].s, py * socts[oi].s) * socts[oi].a;
      sMap[cy * sw + cx] = v;
    }
  }

  /* рендер поверхности */
  var img = _surfCtx.createImageData(w, h);
  var dd = img.data;
  for (var py2 = 0; py2 < h; py2++) {
    var ty = Math.min(Math.floor(py2 / sRes), sh - 1);
    var ty2 = Math.min(ty + 1, sh - 1);
    var fy2 = (py2 % sRes) / sRes;
    for (var px2 = 0; px2 < w; px2++) {
      var tx = Math.min(Math.floor(px2 / sRes), sw - 1);
      var tx2 = Math.min(tx + 1, sw - 1);
      var fx2 = (px2 % sRes) / sRes;
      var hv = sMap[ty*sw+tx]*(1-fx2)*(1-fy2) + sMap[ty*sw+tx2]*fx2*(1-fy2) + sMap[ty2*sw+tx]*(1-fx2)*fy2 + sMap[ty2*sw+tx2]*fx2*fy2;
      var r, g, b2;
      if (hv < 0.25) { var t0 = hv/0.25; r=4+t0*6; g=6+t0*8; b2=12+t0*10; }
      else if (hv < 0.4) { var t1 = (hv-0.25)/0.15; r=10+t1*10; g=14+t1*8; b2=22+t1*4; }
      else if (hv < 0.55) { var t2 = (hv-0.4)/0.15; r=20+t2*8; g=22+t2*6; b2=26+t2*2; }
      else if (hv < 0.7) { var t3 = (hv-0.55)/0.15; r=28+t3*7; g=28+t3*8; b2=28+t3*5; }
      else { var t4 = Math.min((hv-0.7)/0.3,1); r=35+t4*10; g=36+t4*12; b2=33+t4*8; }
      var off = (py2*w+px2)*4;
      dd[off]=r|0; dd[off+1]=g|0; dd[off+2]=b2|0; dd[off+3]=255;
    }
  }
  _surfCtx.putImageData(img, 0, 0);

  /* контурные линии */
  _surfCtx.strokeStyle = 'rgba(80,100,120,0.06)';
  _surfCtx.lineWidth = 1;
  var cLvls = [0.25, 0.4, 0.55, 0.7];
  for (var ci = 0; ci < cLvls.length; ci++) {
    var lv = cLvls[ci];
    _surfCtx.beginPath();
    for (var cty = 0; cty < sh-1; cty++) {
      for (var ctx2 = 0; ctx2 < sw-1; ctx2++) {
        var v00 = sMap[cty*sw+ctx2], v10 = sMap[cty*sw+ctx2+1], v01 = sMap[(cty+1)*sw+ctx2];
        if ((v00<lv)!==(v10<lv)) { var tt=(lv-v00)/(v10-v00); _surfCtx.moveTo((ctx2+tt)*sRes,cty*sRes); _surfCtx.lineTo((ctx2+tt)*sRes+1,cty*sRes+1); }
        if ((v00<lv)!==(v01<lv)) { var tt2=(lv-v00)/(v01-v00); _surfCtx.moveTo(ctx2*sRes,(cty+tt2)*sRes); _surfCtx.lineTo(ctx2*sRes+1,(cty+tt2)*sRes+1); }
      }
    }
    _surfCtx.stroke();
  }

  /* кратеры теперь создаются игроком выстрелами */
  return [];
}

/* Кратеры разрушения (рисуются ПОВЕРХ города) */
var destructionCraters = [];

/* Рисовать кратер на канвасе */
function drawCraterOnCtx(targetCtx, sx, sy, cr) {
  /* Рваная тень вокруг кратера (низкое качество) */
  targetCtx.fillStyle = 'rgba(0,0,0,0.4)';
  for (var si = 0; si < 40; si++) {
    var angle = (si / 40) * TAU + Math.random() * 0.3;
    var dist = cr * (1.1 + Math.random() * 0.4);
    var px = sx + Math.cos(angle) * dist;
    var py = sy + Math.sin(angle) * dist;
    var pSize = 1 + Math.random() * 2;
    targetCtx.fillRect(px - pSize/2, py - pSize/2, pSize, pSize);
  }

  /* Основная тёмная заливка — перекрывает город */
  targetCtx.fillStyle = 'rgba(5,5,10,1)';
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr,0,TAU); targetCtx.fill();

  /* Обводка кратера */
  targetCtx.strokeStyle = 'rgba(255,100,50,0.15)'; targetCtx.lineWidth = 1.2;
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr,0,TAU); targetCtx.stroke();

  /* Тень внутри */
  targetCtx.fillStyle = 'rgba(0,0,0,0.3)';
  targetCtx.beginPath(); targetCtx.arc(sx+cr*0.1,sy+cr*0.1,cr*0.7,0,TAU); targetCtx.fill();

  /* Внешняя обводка */
  targetCtx.strokeStyle = 'rgba(255,60,20,0.08)'; targetCtx.lineWidth = 2;
  targetCtx.beginPath(); targetCtx.arc(sx,sy,cr*1.3,0,TAU); targetCtx.stroke();

  /* Яркая точка в центре */
  dDot(targetCtx, sx, sy, cr * 0.4, 0.6);
}

/* Создать кратер выстрелом */
function createShotCrater(worldX, worldY, charge) {
  if (!_surfCvs) return;
  /* В бою кратеры не создаются */
  if (state.waveActive) return;
  var sx = worldX * scale, sy = worldY * scale;
  var cr = 12 + charge * 20;
  cityCraters.push({ x: sx, y: sy, r: cr });
  if (!state.firstColony) {
    /* Первый кратер требует минимум 40% заряда (charge приходит нормализованный 0-1) */
    if (charge < 0.4) return;
    /* Первый кратер — ПОД городом (на _surfCtx) */
    drawCraterOnCtx(_surfCtx, sx, sy, cr);
    state.firstColony = true;
    state.clock = 0;             /* игровые часы стартуют с основания колонии */
    state.restStartClock = 0;
    var tutBonus = tutOnFire();
    state.energy += 10; /* базовая награда за первый город */
    tutFinish();
    showWaveText('☣️ FIRST COLONY ☢️' + (tutBonus > 0 ? ' ⚡+' + tutBonus : ''));
    /* Начать город из этого кратера */
    var numRays = 3 + Math.floor(Math.random() * 4);
    for (var ri = 0; ri < numRays; ri++) {
      cityQueue.push({ type:'line', x:sx, y:sy, a:(ri/numRays)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
    }
  } else {
    /* Последующие кратеры — ПОВЕРХ города (разрушение) */
    destructionCraters.push({ x: sx, y: sy, r: cr });

    /* Остановить строительство города */
    cityQueue.length = 0;

    /* Затухнуть существующий город (не исчезает полностью) */
    for (var fi = 0; fi < cityFrozen.length; fi++) {
      if (!cityFrozen[fi].fade) cityFrozen[fi].fade = 0;
      cityFrozen[fi].fade = Math.max(cityFrozen[fi].fade, 0.3); /* затухает до 30% */
    }

    /* Начать новый рост из нового кратера */
    var numRays2 = 3 + Math.floor(Math.random() * 4);
    for (var ri2 = 0; ri2 < numRays2; ri2++) {
      cityQueue.push({ type:'line', x:sx, y:sy, a:(ri2/numRays2)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
    }
  }
}

/* ── Постепенный рост города (очередь с прогрессом) ── */
var cityQueue = [];
var cityFrozen = []; /* замороженные элементы — не тухнут */
var cityTier = -1; /* текущий tier при котором строился город */
var cityCraters = []; /* список кратеров */
var THICK_THIN = 0.25, THICK_MED = 0.6, THICK_THICK = 0.7;

function rr(min, max) { return min + Math.random() * (max - min); }
function inB(x, y) { return x > 20 && x < W - 20 && y > 20 && y < H - 20; }
function chooseThick() { var r = Math.random(); return r < 0.5 ? THICK_THIN : r < 0.85 ? THICK_MED : THICK_THICK; }
function getCol(th2, a, colorType) {
  if (a === undefined) a = 1;
  if (colorType === 'blue') return 'rgba(50,150,255,' + (a*0.6) + ')';
  if (colorType === 'red') return 'rgba(255,50,80,' + (a*0.6) + ')';
  if (colorType === 'pink') return 'rgba(255,100,200,' + (a*0.9) + ')';
  if (colorType === 'lime') return 'rgba(150,255,100,' + (a*0.9) + ')';
  if (th2 === THICK_THICK) return 'rgba(255,120,0,' + (a*0.9) + ')';
  if (th2 === THICK_MED)   return 'rgba(255,160,50,' + (a*0.7) + ')';
  return 'rgba(255,200,100,' + (a*0.4) + ')';
}

function dLine(cx2,x1,y1,x2,y2,th2,progress,colorType) {
  if (!progress) progress = 1;
  var px = x1 + (x2 - x1) * progress, py = y1 + (y2 - y1) * progress;
  cx2.strokeStyle = getCol(th2, 1, colorType); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath(); cx2.moveTo(x1,y1); cx2.lineTo(px,py); cx2.stroke();
  if (th2 === THICK_THICK && !colorType) {
    cx2.strokeStyle = getCol(th2, 0.3); cx2.lineWidth = th2 + 2;
    cx2.beginPath(); cx2.moveTo(x1,y1); cx2.lineTo(px,py); cx2.stroke();
  }
}
function dArc(cx2,x,y,rad,sa,ea,th2,progress) {
  if (!progress) progress = 1;
  var curEnd = sa + (ea - sa) * progress;
  cx2.strokeStyle = getCol(th2); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath(); cx2.arc(x,y,rad,sa,curEnd); cx2.stroke();
}
function dDot(cx2,x,y,rad,a,colorType) {
  if (a === undefined) a = 1;
  var gr = cx2.createRadialGradient(x,y,0,x,y,rad);
  if (colorType === 'pink') {
    gr.addColorStop(0, 'rgba(255,100,200,' + a + ')');
    gr.addColorStop(0.5, 'rgba(255,50,150,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(255,0,100,0)');
  } else if (colorType === 'lime') {
    gr.addColorStop(0, 'rgba(150,255,100,' + a + ')');
    gr.addColorStop(0.5, 'rgba(100,255,50,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(50,255,0,0)');
  } else if (colorType === 'blue') {
    gr.addColorStop(0, 'rgba(50,150,255,' + a + ')');
    gr.addColorStop(0.5, 'rgba(30,100,200,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(0,50,150,0)');
  } else if (colorType === 'red') {
    gr.addColorStop(0, 'rgba(255,50,80,' + a + ')');
    gr.addColorStop(0.5, 'rgba(200,30,50,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(150,0,20,0)');
  } else {
    gr.addColorStop(0, 'rgba(255,200,100,' + a + ')');
    gr.addColorStop(0.5, 'rgba(255,140,0,' + (a*0.5) + ')');
    gr.addColorStop(1, 'rgba(255,100,0,0)');
  }
  cx2.fillStyle = gr; cx2.beginPath(); cx2.arc(x,y,rad,0,TAU); cx2.fill();
}
function dPoly(cx2,x,y,rad,sides,rot,th2,progress) {
  if (!progress) progress = 1;
  cx2.strokeStyle = getCol(th2); cx2.lineWidth = th2; cx2.lineCap = 'round';
  cx2.beginPath();
  var dSides = Math.ceil(sides * progress);
  for (var i = 0; i <= dSides; i++) {
    var a2 = rot + (i/sides)*TAU;
    var px2 = x + Math.cos(a2)*rad, py2 = y + Math.sin(a2)*rad;
    if (i === 0) cx2.moveTo(px2,py2); else cx2.lineTo(px2,py2);
  }
  cx2.stroke();
}

var OPS = ['line','branch','arc','spider','cdots','circle','polygon'];
var WEIGHTS = [30,25,15,8,7,5,10];
var totalW = 0; for (var wi = 0; wi < WEIGHTS.length; wi++) totalW += WEIGHTS[wi];
function chooseOp() {
  var r = Math.random() * totalW;
  for (var i = 0; i < WEIGHTS.length; i++) { r -= WEIGHTS[i]; if (r <= 0) return OPS[i]; }
  return 'line';
}

function endPt(t) {
  if (t.type === 'line' || t.type === 'branch') return [t.x + Math.cos(t.a)*t.l, t.y + Math.sin(t.a)*t.l];
  if (t.type === 'arc') { var ea = t.sa + t.sw; return [t.x + Math.cos(ea)*t.r, t.y + Math.sin(ea)*t.r]; }
  return [t.x, t.y];
}

function spawnCity(task) {
  if (task.gen > 12 || Math.random() > 0.85) return;
  var ep = endPt(task);
  if (!inB(ep[0], ep[1])) return;
  var nxt = chooseOp(), nth = Math.random() < 0.7 ? task.th : chooseThick(), ng = task.gen + 1;
  var spd = rr(0.0002, 0.0006); /* очень медленная скорость — дни роста */
  /* Редкие цвета: синий (5%), красный (2%), только для line/точек и только тонкие */
  var colorType = null;
  if (Math.random() < 0.05) colorType = 'blue';
  else if (Math.random() < 0.02) colorType = 'red';
  if (colorType) nth = THICK_THIN; /* цветные только тонкие */
  /* Некоторые элементы угасают не до конца */
  var fadeLevel = Math.random() < 0.15 ? rr(0.2, 0.5) : 0;
  switch (nxt) {
    case 'line':    cityQueue.push({ type:'line', x:ep[0], y:ep[1], a:(task.a||0)+rr(-0.3,0.3), l:rr(15,50), th:nth, gen:ng, prog:0, spd:spd, color:colorType, fade:fadeLevel }); break;
    case 'branch':  cityQueue.push({ type:'branch', x:ep[0], y:ep[1], a:task.a||rr(0,TAU), l:rr(20,40), br:2+Math.floor(Math.random()*2), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'arc':     cityQueue.push({ type:'arc', x:ep[0], y:ep[1], r:rr(15,40), sa:rr(0,TAU), sw:rr(PI*0.5,PI*1.5), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'spider':  cityQueue.push({ type:'spider', x:ep[0], y:ep[1], r:rr(20,50), sp:Math.floor(rr(5,12)), th:THICK_THIN, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'cdots':   cityQueue.push({ type:'cdots', x:ep[0], y:ep[1], r:rr(15,35), dots:Math.floor(rr(6,14)), color:colorType, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'circle':  cityQueue.push({ type:'circle', x:ep[0], y:ep[1], r:rr(10,30), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
    case 'polygon': cityQueue.push({ type:'polygon', x:ep[0], y:ep[1], r:rr(10,35), sides:Math.floor(rr(3,8)), rot:rr(0,TAU), th:nth, gen:ng, prog:0, spd:spd, fade:fadeLevel }); break;
  }
  if (Math.random() < 0.3) {
    cityQueue.push({ type:'line', x:ep[0], y:ep[1], a:(task.a||0)+rr(PI/3,PI), l:rr(10,30), th:THICK_THIN, gen:ng+1, prog:0, spd:rr(0.0002, 0.0006) });
  }
}

function startCityGrowth(craters) {
  cityQueue = [];
  cityCraters = craters;
  /* Выбираем кратер ближайший к маяку */
  var lhX = state.lighthouse.x * scale, lhY = state.lighthouse.y * scale;
  var nearest = null, minDist = Infinity;
  for (var i = 0; i < craters.length; i++) {
    var dx = craters[i].x - lhX, dy = craters[i].y - lhY;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < minDist) { minDist = dist; nearest = craters[i]; }
  }
  if (!nearest) return;
  var sx = nearest.x, sy = nearest.y;
  dDot(_surfCtx, sx, sy, 8, 0.8);
  var numRays = 3 + Math.floor(Math.random() * 4);
  for (var ri = 0; ri < numRays; ri++) {
    cityQueue.push({ type:'line', x:sx, y:sy, a:(ri/numRays)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
  }
}

function updateCityGrowth(dt) {
  if (cityQueue.length === 0) return;
  /* Мягкое затухание предыдущих линий пока город растёт */
  _surfCtx.fillStyle = 'rgba(0,0,0,0.02)';
  _surfCtx.fillRect(0, 0, W, H);
  var completed = [];
  for (var i = cityQueue.length - 1; i >= 0; i--) {
    var t = cityQueue[i];
    t.prog += t.spd * (dt * 60); /* нормализация к 60fps */
    if (t.prog > 1) t.prog = 1;
    switch (t.type) {
      case 'line': {
        var ex = t.x + Math.cos(t.a)*t.l, ey = t.y + Math.sin(t.a)*t.l;
        dLine(_surfCtx, t.x,t.y,ex,ey,t.th,t.prog,t.color); break;
      }
      case 'branch': {
        var spA = PI / (t.br+1);
        for (var bi = 0; bi < t.br; bi++) {
          var ba = t.a - spA*(t.br-1)/2 + spA*bi;
          dLine(_surfCtx, t.x,t.y, t.x+Math.cos(ba)*t.l, t.y+Math.sin(ba)*t.l, t.th, t.prog);
        } break;
      }
      case 'arc': dArc(_surfCtx, t.x,t.y,t.r,t.sa,t.sa+t.sw,t.th,t.prog); break;
      case 'spider': {
        dDot(_surfCtx, t.x,t.y,3,t.prog);
        var spikesShow = Math.ceil(t.sp * t.prog);
        for (var spi = 0; spi < spikesShow; spi++) {
          var spa2 = (spi/t.sp)*TAU;
          var lenProg = (spi < spikesShow - 1) ? 1 : ((t.prog * t.sp) % 1);
          dLine(_surfCtx, t.x,t.y, t.x+Math.cos(spa2)*t.r*lenProg, t.y+Math.sin(spa2)*t.r*lenProg, t.th, 1);
        }
        if (t.prog > 0.5) {
          var ringProg = (t.prog - 0.5) * 2;
          _surfCtx.strokeStyle = getCol(THICK_THIN, ringProg * 0.5); _surfCtx.lineWidth = THICK_THIN;
          _surfCtx.beginPath(); _surfCtx.arc(t.x,t.y,t.r*0.5,0,TAU*ringProg); _surfCtx.stroke();
        }
        break;
      }
      case 'cdots': {
        var dotsShow = Math.ceil(t.dots * t.prog);
        for (var di = 0; di < dotsShow; di++) {
          var da = (di/t.dots)*TAU;
          var dotAlpha = (di < dotsShow - 1) ? 0.8 : 0.8 * ((t.prog * t.dots) % 1);
          dDot(_surfCtx, t.x+Math.cos(da)*t.r, t.y+Math.sin(da)*t.r, 2+Math.random()*2, dotAlpha, t.color);
        } break;
      }
      case 'circle': {
        _surfCtx.strokeStyle = getCol(t.th); _surfCtx.lineWidth = t.th;
        _surfCtx.beginPath(); _surfCtx.arc(t.x,t.y,t.r,0,TAU*t.prog); _surfCtx.stroke(); break;
      }
      case 'polygon': dPoly(_surfCtx, t.x,t.y,t.r,t.sides,t.rot,t.th,t.prog); break;
    }
    if (t.prog >= 1) {
      /* С вероятностью 5% элемент "замерзает" и больше не тухнет */
      if (Math.random() < 0.05) {
        cityFrozen.push({ type: t.type, x: t.x, y: t.y, a: t.a, l: t.l, r: t.r, sa: t.sa, sw: t.sw, th: t.th, br: t.br, sp: t.sp, dots: t.dots, sides: t.sides, rot: t.rot, prog: 1, color: t.color });
        /* При заморозке с шансом 50% создаём новый seed в радиусе */
        if (Math.random() < 0.5) {
          var ep = endPt(t);
          var angle = rr(0, TAU);
          var dist = rr(20, 60);
          var nx = ep[0] + Math.cos(angle) * dist, ny = ep[1] + Math.sin(angle) * dist;
          if (inB(nx, ny)) {
            dDot(_surfCtx, nx, ny, 6, 0.7);
            var numNewRays = 2 + Math.floor(Math.random() * 3);
            for (var nri = 0; nri < numNewRays; nri++) {
              cityQueue.push({ type:'line', x:nx, y:ny, a:(nri/numNewRays)*TAU + rr(0,0.3), l:rr(20,50), th:chooseThick(), gen:0, prog:0, spd:rr(0.0002, 0.0006) });
            }
          }
        }
      } else if (t.fade > 0) {
        /* Элемент угасает не до конца */
        cityFrozen.push({ type: t.type, x: t.x, y: t.y, a: t.a, l: t.l, r: t.r, sa: t.sa, sw: t.sw, th: t.th, br: t.br, sp: t.sp, dots: t.dots, sides: t.sides, rot: t.rot, prog: 1, color: t.color, fade: t.fade });
      }
      /* Под конец строительства — яркие одинокие точки розовые и лайм */
      if (t.gen > 8 && Math.random() < 0.08) {
        var brightColor = Math.random() < 0.5 ? 'pink' : 'lime';
        var ep2 = endPt(t);
        dDot(_surfCtx, ep2[0], ep2[1], rr(3,6), 1, brightColor);
        cityFrozen.push({ type: 'brightdot', x: ep2[0], y: ep2[1], r: rr(3,6), color: brightColor, prog: 1 });
      }
      completed.push(t);
      cityQueue.splice(i, 1);
    }
  }
  /* Рисуем замороженные элементы поверх затухающего слоя */
  for (var fi = 0; fi < cityFrozen.length; fi++) {
    var f = cityFrozen[fi];
    /* Применяем fadeLevel если есть */
    if (f.fade && f.fade > 0) {
      var oldAlpha = _surfCtx.globalAlpha;
      _surfCtx.globalAlpha = f.fade;
    }
    switch (f.type) {
      case 'line': {
        var ex2 = f.x + Math.cos(f.a)*f.l, ey2 = f.y + Math.sin(f.a)*f.l;
        dLine(_surfCtx, f.x,f.y,ex2,ey2,f.th,1,f.color); break;
      }
      case 'branch': {
        var spA2 = PI / (f.br+1);
        for (var bi2 = 0; bi2 < f.br; bi2++) {
          var ba2 = f.a - spA2*(f.br-1)/2 + spA2*bi2;
          dLine(_surfCtx, f.x,f.y, f.x+Math.cos(ba2)*f.l, f.y+Math.sin(ba2)*f.l, f.th, 1);
        } break;
      }
      case 'arc': dArc(_surfCtx, f.x,f.y,f.r,f.sa,f.sa+f.sw,f.th,1); break;
      case 'spider': {
        dDot(_surfCtx, f.x,f.y,3,1);
        for (var spi2 = 0; spi2 < f.sp; spi2++) {
          var spa3 = (spi2/f.sp)*TAU;
          dLine(_surfCtx, f.x,f.y, f.x+Math.cos(spa3)*f.r, f.y+Math.sin(spa3)*f.r, f.th, 1);
        }
        _surfCtx.strokeStyle = getCol(THICK_THIN, 0.5); _surfCtx.lineWidth = THICK_THIN;
        _surfCtx.beginPath(); _surfCtx.arc(f.x,f.y,f.r*0.5,0,TAU); _surfCtx.stroke();
        break;
      }
      case 'cdots': {
        for (var di2 = 0; di2 < f.dots; di2++) {
          var da2 = (di2/f.dots)*TAU;
          dDot(_surfCtx, f.x+Math.cos(da2)*f.r, f.y+Math.sin(da2)*f.r, 2+Math.random()*2, 0.8, f.color);
        } break;
      }
      case 'brightdot': {
        dDot(_surfCtx, f.x, f.y, f.r, 1, f.color); break;
      }
      case 'circle': {
        _surfCtx.strokeStyle = getCol(f.th); _surfCtx.lineWidth = f.th;
        _surfCtx.beginPath(); _surfCtx.arc(f.x,f.y,f.r,0,TAU); _surfCtx.stroke(); break;
      }
      case 'polygon': dPoly(_surfCtx, f.x,f.y,f.r,f.sides,f.rot,f.th,1); break;
    }
    /* Восстанавливаем alpha если изменяли */
    if (f.fade && f.fade > 0) {
      _surfCtx.globalAlpha = 1;
    }
  }
  for (var ci = 0; ci < completed.length; ci++) spawnCity(completed[ci]);
}

function drawBackground() {
  /* Статичная поверхность (земля) — город начинается из кратеров выстрелов */
  if (!_surfCvs) {
    generateSurface(W, H);
    cityTier = state.colonyTier;
  }
  /* При первой прокачке базы — новый кратер, новый рост */
  if (state.colonyTier > cityTier && cityTier >= 0) {
    var rndCrater = cityCraters[Math.floor(Math.random() * cityCraters.length)];
    if (rndCrater) {
      dDot(_surfCtx, rndCrater.x, rndCrater.y, 8, 0.8);
      var numRays2 = 3 + Math.floor(Math.random() * 4);
      for (var ri2 = 0; ri2 < numRays2; ri2++) {
        cityQueue.push({ type:'line', x:rndCrater.x, y:rndCrater.y, a:(ri2/numRays2)*TAU + rr(0,0.3), l:rr(30,60), th:THICK_THICK, gen:0, prog:0, spd:rr(0.0002, 0.0006) });
      }
    }
    cityTier = state.colonyTier;
  }
  ctx.drawImage(_surfCvs, 0, 0);

  /* Subtle animated shimmer — мерцающие круги поверх поверхности */
  var t = state.time * 0.3;
  ctx.globalAlpha = 0.025;
  for (var si = 0; si < 5; si++) {
    var sx2 = (Math.sin(t + si * 1.3) * 0.5 + 0.5) * W;
    var sy2 = (Math.cos(t * 0.7 + si * 2.1) * 0.5 + 0.5) * H;
    var shimR = 80 + si * 30;
    var grad = ctx.createRadialGradient(sx2, sy2, 0, sx2, sy2, shimR);
    grad.addColorStop(0, 'rgba(40,60,80,1)');
    grad.addColorStop(1, 'rgba(40,60,80,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx2, sy2, shimR, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* Динамическое освещение смога от взрывов и снарядов */
  drawSmogLighting();
}

function drawSmogLighting() {
  if (tw === 0) return;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; // Аддитивное наложение для свечения

  /* Освещение от источников света (взрывов) */
  for (var i = 0; i < state.lights.length; i++) {
    var light = state.lights[i];
    var sc = toScreen(light.x, light.y);
    var sx = sc[0], sy = sc[1];
    var intensity = light.life / light.maxLife;
    var radius = light.radius * scale * 1.5;

    /* Извлекаем RGB из цвета */
    var c = light.color.replace('#','');
    if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var r = parseInt(c.substring(0,2),16);
    var g = parseInt(c.substring(2,4),16);
    var b = parseInt(c.substring(4,6),16);

    /* Рисуем свет с модуляцией по heightmap */
    drawLightWithHeightmap(sx, sy, radius, r, g, b, intensity * 0.6);
  }

  /* Освещение от летящих снарядов */
  for (var pi = 0; pi < state.projectiles.length; pi++) {
    var proj = state.projectiles[pi];
    if (!proj.alive) continue;
    var pos = proj.body.getPosition();
    var psc = toScreen(pos.x, pos.y);
    var psx = psc[0], psy = psc[1];
    var pRadius = proj.radius * scale * 4;

    var pc = proj.ammo.color.replace('#','');
    if (pc.length === 3) pc = pc[0]+pc[0]+pc[1]+pc[1]+pc[2]+pc[2];
    var pr = parseInt(pc.substring(0,2),16);
    var pg = parseInt(pc.substring(2,4),16);
    var pb = parseInt(pc.substring(4,6),16);

    drawLightWithHeightmap(psx, psy, pRadius, pr, pg, pb, 0.25);
  }

  /* Освещение от маяка */
  var lh = state.lighthouse;
  var lsc = toScreen(lh.x, lh.y);
  var lsx = lsc[0], lsy = lsc[1];
  var ammoColor = getActiveAmmoColor();
  var lRadius = 0.7 * lhScale * 6;

  var lc = ammoColor.replace('#','');
  if (lc.length === 3) lc = lc[0]+lc[0]+lc[1]+lc[1]+lc[2]+lc[2];
  var lr = parseInt(lc.substring(0,2),16);
  var lg = parseInt(lc.substring(2,4),16);
  var lb = parseInt(lc.substring(4,6),16);

  var pulse = Math.sin(state.lighthousePulse) * 0.1 + 0.9;
  drawLightWithHeightmap(lsx, lsy, lRadius, lr, lg, lb, 0.35 * pulse);

  ctx.restore();
}

/* Рисует освещение с модуляцией по heightmap - освещает только облака */
function drawLightWithHeightmap(cx, cy, radius, r, g, b, maxIntensity) {
  var steps = 32; // Количество концентрических кругов
  var angularSteps = 48; // Количество точек на окружности

  for (var ri = 0; ri < steps; ri++) {
    var rad = (ri / steps) * radius;
    var nextRad = ((ri + 1) / steps) * radius;
    var falloff = 1 - (ri / steps); /* Затухание от центра */
    var baseIntensity = maxIntensity * falloff * falloff;

    ctx.beginPath();
    for (var ai = 0; ai <= angularSteps; ai++) {
      var angle = (ai / angularSteps) * TAU;
      var px = cx + Math.cos(angle) * rad;
      var py = cy + Math.sin(angle) * rad;

      /* Сэмплируем heightmap */
      var h = getHeightAt(px, py);
      /* Усиливаем контраст для модуляции */
      var cloudness = (h - 0.5) * 2.5 + 0.5;
      cloudness = Math.max(0, Math.min(1, cloudness));

      /* Черные области (провалы) не освещаются */
      if (cloudness < 0.3) cloudness = 0;
      else cloudness = (cloudness - 0.3) / 0.7; /* Ремап 0.3-1 -> 0-1 */

      var intensity = baseIntensity * cloudness;

      if (ai === 0) {
        ctx.moveTo(px, py);
      } else {
        /* Рисуем небольшие сегменты с индивидуальной прозрачностью */
        var prevAngle = ((ai - 1) / angularSteps) * TAU;
        var ppx = cx + Math.cos(prevAngle) * rad;
        var ppy = cy + Math.sin(prevAngle) * rad;

        ctx.fillStyle = 'rgba('+r+','+g+','+b+','+intensity+')';
        ctx.beginPath();
        ctx.moveTo(ppx, ppy);
        ctx.lineTo(px, py);
        var npx = cx + Math.cos(angle) * nextRad;
        var npy = cy + Math.sin(angle) * nextRad;
        ctx.lineTo(npx, npy);
        var nppx = cx + Math.cos(prevAngle) * nextRad;
        var nppy = cy + Math.sin(prevAngle) * nextRad;
        ctx.lineTo(nppx, nppy);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
}

function drawBaseLine() {
  var baseY = getBaseY() * scale;

  ctx.save();

  ctx.lineTo(W, baseY);

  var zg = ctx.createLinearGradient(0, baseY, 0, H);

  zg.addColorStop(1, 'rgba(255,23,68,0)');

}

/* Lighthouse image */
var lighthouseImg = null;
var lighthouseImgLoaded = false;
(function() {
  var img = new Image();
  img.onload = function() { lighthouseImg = img; lighthouseImgLoaded = true; };
  img.src = 'https://pfst.cf2.poecdn.net/base/image/9778eae433ae8dfc45f442cc9d7945f5486a45beee092dd94757236ffe29c4de?w=1024&h=1024';
})();

function drawLighthouse() {
  var lh = state.lighthouse;
  var sc = toScreen(lh.x, lh.y);
  var sx = sc[0], sy = sc[1];
  var r = 0.7 * lhScale;
  var pulse = Math.sin(state.lighthousePulse) * 0.15 + 1;
  var ammoColor = getActiveAmmoColor();

  /* Outer glow — ammo colored */
  var glow = ctx.createRadialGradient(sx, sy, r * 0.2, sx, sy, r * 2.8 * pulse);
  glow.addColorStop(0, hexToRgba(ammoColor, 0.15));
  glow.addColorStop(0.5, hexToRgba(ammoColor, 0.04));
  glow.addColorStop(1, hexToRgba(ammoColor, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sx, sy, r * 2.8 * pulse, 0, TAU);
  ctx.fill();

  /* Луч маяка теперь рисуется внутри renderCloudsToCtx (попиксельно окрашивает облака) */

  /* Красная заливка лучей — сами лучи прозрачны, ночью дальше и ярче (плавно) */
  if (state.colonized) {
    var nfLh = state.nightFactor || 0;
    var isNightLh = nfLh > 0.5;
    var reachLh = 1.25 + nfLh * 0.55;
    var beamRot = state.time * 0.45; /* вращение на 25% медленнее */
    var scanAngle = 0.25;
    var scanLen = r * CFG.SCANNER_RANGE_MULT * 5.4 * reachLh; /* дальность значительно больше */
    var t = state.basePulse;
    var beamAlpha = (0.075 + nfLh * 0.055) + Math.sin(t) * 0.025;

    for (var bi = 0; bi < 2; bi++) {
      var bAngle = beamRot + bi * PI;
      var bx1 = Math.cos(bAngle - scanAngle) * scanLen;
      var by1 = Math.sin(bAngle - scanAngle) * scanLen;
      var bx2 = Math.cos(bAngle + scanAngle) * scanLen;
      var by2 = Math.sin(bAngle + scanAngle) * scanLen;

      var bg = ctx.createRadialGradient(sx, sy, r * 0.5, sx, sy, scanLen);
      bg.addColorStop(0, 'rgba(255,40,74,' + beamAlpha + ')');
      bg.addColorStop(0.55, 'rgba(255,23,68,' + (beamAlpha * 0.5) + ')');
      bg.addColorStop(1, 'rgba(255,23,68,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + bx1, sy + by1);
      ctx.lineTo(sx + bx2, sy + by2);
      ctx.closePath();
      ctx.fill();
    }

    /* Яркое горячее ядро у основания луча — «прожектор» смотрится дороже */
    var coreLen = scanLen * 0.34;
    var coreA = 0.28 * scanAngle;
    for (var bj = 0; bj < 2; bj++) {
      var ca = beamRot + bj * PI;
      var cg2 = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, coreLen);
      cg2.addColorStop(0, 'rgba(255,120,140,' + (beamAlpha * 1.6) + ')');
      cg2.addColorStop(1, 'rgba(255,40,74,0)');
      ctx.fillStyle = cg2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ca - coreA) * coreLen, sy + Math.sin(ca - coreA) * coreLen);
      ctx.lineTo(sx + Math.cos(ca + coreA) * coreLen, sy + Math.sin(ca + coreA) * coreLen);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* Draw lighthouse image */
  if (lighthouseImgLoaded && lighthouseImg) {
    var imgSize = r * 4;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.drawImage(lighthouseImg, -imgSize/2, -imgSize/2, imgSize, imgSize);
    ctx.restore();
  } else {
    /* Fallback: simple circle while image loads */
    ctx.fillStyle = '#0a1118';
    ctx.strokeStyle = ammoColor;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
    ctx.stroke();
  }

  /* Tesla coil indicator */
  if (perkLvl('tesla') > 0) {
    ctx.strokeStyle = hexToRgba('#b388ff', 0.15 + Math.sin(state.time * 8) * 0.1);
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath();
    ctx.arc(sx, sy, r * 2.2, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Charge ring — overcharge aware */
  if (state.dragging && state.charge > 0) {
    var maxCharge2 = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
    var chargeRatio = state.charge / maxCharge2;
    ctx.strokeStyle = 'rgba(255,' + Math.floor(171 * (1 - chargeRatio)) + ',0,0.85)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(sx, sy, r + 10, -PI / 2, -PI / 2 + chargeRatio * TAU);
    ctx.stroke();
  }

}

function drawAimLine() {
  if (!state.dragging || !state.dragCurrent) return;
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var scLH = toScreen(lh.x, lh.y);
  var scDC = toScreen(dc.x, dc.y);

  /* Вектор направления выстрела (от пальца К маяку = направление снаряда) */
  var dx = lh.x - dc.x;
  var dy = lh.y - dc.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.1) return;

  var nx = dx / dist;
  var ny = dy / dist;

  /* Вычисляем скорость снаряда как при выстреле */
  var dragMax = state.waveActive ? 14 : CFG.DRAG_MAX;
  var maxVel = 18 + state.colonyTier * 2;
  var speed = Math.min(dist * CFG.VEL_FACTOR, maxVel);

  /* Damping как при выстреле */
  var rangeLvl = perkLvl('range');
  var baseDamping = 0.8;
  if (rangeLvl === 1) baseDamping = 0.5;
  else if (rangeLvl === 2) baseDamping = 0.2;

  /* Дальность полёта: d = v0/damping * (1 - e^(-damping * lifetime)) */
  var lifetime = CFG.PROJ_LIFETIME;
  var flyDist = speed / baseDamping * (1 - Math.exp(-baseDamping * lifetime));

  /* Переводим мировое расстояние в экранное */
  var lineLength = flyDist * scale;

  /* Линия идёт от маяка в направлении выстрела */
  var scLHx = scLH[0], scLHy = scLH[1];
  var sx1 = scLHx;
  var sy1 = scLHy;
  var sx2 = scLHx + nx * lineLength;
  var sy2 = scLHy + ny * lineLength;

  /* Линия прицела - стиль как у reactor zone */
  var alpha = 0.5 + Math.sin(state.time * 2) * 0.2;
  ctx.save();
  ctx.strokeStyle = 'rgba(120, 20, 20, ' + alpha + ')';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 9]);
  ctx.lineDashOffset = -state.time * 35; /* анимация движения пунктира */
  ctx.beginPath();
  ctx.moveTo(sx1, sy1);
  ctx.lineTo(sx2, sy2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAimUI() {
  var lh = state.lighthouse;
  var dc = state.dragCurrent;
  var sc1 = toScreen(lh.x, lh.y);
  var sx = sc1[0], sy = sc1[1];
  var ammo = AMMO[state.selectedAmmo];
  var col = ammo.color;

  /* Вычисляем радиус снаряда как при выстреле */
  var r = CFG.PROJ_RADIUS * (ammo.id === 'explosive' ? 1.4 : ammo.id === 'scatter' ? 1.2 : ammo.id === 'piercing' ? 0.9 : 1);

  /* Вычисляем текущий заряд от 0 до 1 */
  var maxCharge = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
  var chargeRatio = Math.min(state.charge / maxCharge, 1);

  /* Пересоздаём снаряд если сменился тип боеприпаса или сильно изменился заряд */
  var needRecreate = !state.previewProj || state.previewProj.ammo !== ammo;
  if (state.previewProj && state.previewProj.lastChargeRatio !== undefined) {
    var chargeDiff = Math.abs(chargeRatio - state.previewProj.lastChargeRatio);
    /* Пересоздать если заряд перешёл порог (каждые ~17% для смены количества молний) */
    if (chargeDiff > 0.08) needRecreate = true;
  }

  if (needRecreate) {
    state.previewProj = {
      radius: r,
      ammo: ammo,
      plasmaParticles: [],
      plasmaNodes: [],
      lastChargeRatio: chargeRatio
    };
    initProjectilePlasma(state.previewProj, chargeRatio);
  }

  /* Обновляем плазму preview снаряда */
  updateProjectilePlasma(state.previewProj);

  /* Рисуем плазменные молнии 1в1 как у летящего снаряда */
  drawProjectilePlasma(ctx, sx, sy, state.previewProj);

  /* Ядро/капсула 1в1 как у летящего снаряда */
  var coreR = r * scale * 0.55;
  var coreGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, col);
  coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(sx, sy, coreR, 0, TAU);
  ctx.fill();
}

function drawLightningArcs() {
  for (var i = 0; i < state.lightningArcs.length; i++) {
    var arc = state.lightningArcs[i], a = arc.life / 0.3;
    var s1 = toScreen(arc.x1, arc.y1), s2 = toScreen(arc.x2, arc.y2);
    /* Используем цвет из объекта, если есть, иначе дефолтный голубой */
    var arcColor = arc.color || '#64c8ff';
    ctx.strokeStyle = hexToRgba(arcColor, Math.min(a, 0.8));
    ctx.lineWidth = 2 * a;
    ctx.beginPath();
    ctx.moveTo(s1[0], s1[1]);
    var segs = 4;
    for (var j = 1; j <= segs; j++) {
      var t = j / segs;
      var mx = s1[0] + (s2[0] - s1[0]) * t;
      var my = s1[1] + (s2[1] - s1[1]) * t;
      if (j < segs) { mx += (Math.random() - 0.5) * 12 * a; my += (Math.random() - 0.5) * 12 * a; }
      ctx.lineTo(mx, my);
    }
    ctx.stroke();
  }

  /* Молнии взрывов */
  for (var ei = 0; ei < explosionBolts.length; ei++) {
    var bolt = explosionBolts[ei];
    var aVal = bolt.life / bolt.maxLife;
    var sc = toScreen(bolt.wx, bolt.wy);

    ctx.strokeStyle = bolt.color;
    ctx.lineWidth = 0.8 + aVal * 0.7;
    ctx.shadowColor = bolt.color;
    ctx.shadowBlur = 12 * aVal;
    ctx.globalAlpha = aVal * 0.9;

    ctx.beginPath();
    ctx.moveTo(sc[0], sc[1]);
    for (var si = 0; si < bolt.segments.length; si++) {
      var seg = bolt.segments[si];
      ctx.lineTo(sc[0] + seg.x2 * scale, sc[1] + seg.y2 * scale);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawSingularities() {
  for (var i = 0; i < state.singularities.length; i++) {
    var s = state.singularities[i], ratio = s.life / s.maxLife;
    var sc = toScreen(s.x, s.y), sx = sc[0], sy = sc[1], r = 3.5 * scale * ratio;
    var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0, 'rgba(100,0,200,' + (0.4 * ratio) + ')');
    g.addColorStop(0.4, 'rgba(50,0,100,' + (0.2 * ratio) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,136,255,' + (0.5 * ratio) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.5, state.time * 3, state.time * 3 + PI * 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.3, state.time * -5, state.time * -5 + PI);
    ctx.stroke();
  }
}

function drawEnemies() {
  for (var i = 0; i < state.enemies.length; i++) {
    var e = state.enemies[i];
    if (e.deathTimer >= 0 && !e.alive) {
      var alpha = Math.max(0, e.deathTimer / 0.45);
      drawEnemyBody(e, alpha, 1 + (1 - alpha) * 0.4);
      continue;
    }
    if (!e.alive) continue;
    /* Lv.2 Scout Flicker: alpha=0.3 when flickering */
    var flickerAlpha = (e.type === 'scout' && e.level === 2 && e.flickering) ? 0.3 : 1;
    drawEnemyBody(e, flickerAlpha, 1);
  }
}

function drawPlateDebris() {
  for (var i = 0; i < plateDebris.length; i++) {
    var d = plateDebris[i];
    var sc = toScreen(d.x, d.y);
    ctx.save();
    ctx.translate(sc[0], sc[1]);
    ctx.rotate(d.angle);
    ctx.globalAlpha = Math.max(0, d.life / 0.9) * 0.9;
    ctx.fillStyle = d.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1.5;
    var w = d.w * scale, h = d.h * scale;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawShrapnel() {
  if (shrapnel.length === 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < shrapnel.length; i++) {
    var s = shrapnel[i];
    var sc = toScreen(s.x, s.y);
    var r = 2.2 + (s.life > 0.4 ? 1.5 : 0);
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(sc[0], sc[1], r, 0, TAU); ctx.fill();
    /* короткий хвост */
    ctx.strokeStyle = hexToRgba(s.color, 0.5); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sc[0], sc[1]); ctx.lineTo(sc[0] - s.vx * scale * 0.04, sc[1] - s.vy * scale * 0.04); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemyBody(e, alpha, scaleMul) {
  var pos = e.body.getPosition();
  var angle = e.body.getAngle();
  var sc = toScreen(pos.x, pos.y);
  var sx = sc[0], sy = sc[1];
  /* ФАЗА 12: size×1.1 для Lv.2 */
  var lvlSizeMult = (e.level === 2) ? 1.1 : 1.0;
  var r = e.def.r * scale * scaleMul * lvlSizeMult;
  var sides = e.def.sides;

  /* Walking bob */
  var bobOffset = 0;
  if (e.alive && !e.frozen) {
    bobOffset = Math.abs(Math.sin(e.stepBob)) * r * 0.08;
  }
  sy -= bobOffset;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;

  /* Shield aura */
  if (e.shielded && alpha === 1) {
    ctx.strokeStyle = 'rgba(255,214,0,0.35)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, r + 5, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Frozen overlay */
  if (e.frozen) {
    ctx.fillStyle = 'rgba(128,222,234,0.15)';
    ctx.beginPath();
    ctx.arc(0, 0, r + 3, 0, TAU);
    ctx.fill();
  }

  var color = e.def.color;
  /* Ночью инвертируем цвет врагов */
  if (state.wave % 2 === 0) {
    var cc = color.replace('#','');
    if (cc.length === 3) cc = cc[0]+cc[0]+cc[1]+cc[1]+cc[2]+cc[2];
    var cr = 255 - parseInt(cc.substring(0,2),16);
    var cg = 255 - parseInt(cc.substring(2,4),16);
    var cb = 255 - parseInt(cc.substring(4,6),16);
    color = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
  }
  if (e.flashTimer > 0) color = '#ffffff';

  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1.5;

  if (sides === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.4, 0);
    ctx.moveTo(0, -r*0.4); ctx.lineTo(0, r*0.4);
    ctx.stroke();
  } else if (e.type === 'armor' || e.type === 'barrel') {
    /* Осевой квадрат (совпадает с физ. Box и боковыми пластинами) */
    var hb = r * 0.85;
    ctx.fillRect(-hb, -hb, hb * 2, hb * 2);
    ctx.strokeRect(-hb, -hb, hb * 2, hb * 2);
  } else if (e.type === 'berserker') {
    /* Зубчатый ромб */
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(r*0.7, 0); ctx.lineTo(0, r); ctx.lineTo(-r*0.7, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    /* Rage визуалы */
    if (e.rageSpeed > 1.0 && alpha === 1) {
      var rageLevel = (e.rageSpeed - 1.0) / 1.5; /* 0..1 */

      /* Трещины на теле */
      if (rageLevel > 0.1) {
        ctx.strokeStyle = 'rgba(255,255,100,' + (rageLevel * 0.8) + ')';
        ctx.lineWidth = 1.5;
        for (var ci = 0; ci < 4; ci++) {
          var ca = (ci / 4) * TAU;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ca) * r * 0.6, Math.sin(ca) * r * 0.6);
          ctx.stroke();
        }
      }

      /* Пульсирующий glow при 1.5+ */
      if (rageLevel >= 0.33) {
        var breathe = 0.5 + Math.sin(state.time * 8) * 0.5;
        ctx.strokeStyle = 'rgba(255,100,0,' + (breathe * rageLevel * 0.6) + ')';
        ctx.lineWidth = 2 + breathe * 2;
        ctx.shadowColor = 'rgba(255,100,0,0.6)';
        ctx.shadowBlur = 10 * breathe;
        ctx.beginPath();
        ctx.arc(0, 0, r + 4 + breathe * 3, 0, TAU);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      /* Пламя при 2.0+ */
      if (rageLevel >= 0.67) {
        ctx.shadowColor = 'rgba(255,50,0,0.8)';
        ctx.shadowBlur = 15;
        for (var fi = 0; fi < 6; fi++) {
          var fa = (fi / 6) * TAU + state.time * 3;
          var flicker = Math.sin(state.time * 10 + fi) * 0.3 + 0.7;
          var fx = Math.cos(fa) * (r + 5 + flicker * 5);
          var fy = Math.sin(fa) * (r + 5 + flicker * 5);
          ctx.fillStyle = 'rgba(255,' + Math.floor(100 + flicker * 50) + ',0,' + (flicker * 0.7) + ')';
          ctx.beginPath();
          ctx.arc(fx, fy, 2 + flicker * 2, 0, TAU);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
    }
  } else if (e.type === 'scout') {
    /* Вытянутый треугольник с neon glow */
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.4);
    ctx.lineTo(r * 0.6, r * 0.7);
    ctx.lineTo(-r * 0.6, r * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
  } else {
    ctx.beginPath();
    for (var si = 0; si < sides; si++) {
      var a = (si / sides) * TAU - PI / 2;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  /* Красное ядро бочки */
  if (e.type === 'barrel') {
    ctx.fillStyle = 'rgba(255,40,40,0.9)';
    ctx.shadowColor = '#ff2b2b'; ctx.shadowBlur = 8 + Math.sin(state.time * 6) * 4;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,180,0,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.stroke();
  }

  /* Броневые пластины по сторонам (сколько осталось слоёв) */
  if (e.plates) {
    for (var pside = 0; pside < 4; pside++) {
      var pc = e.plates[pside]; if (pc <= 0) continue;
      for (var lyr = 0; lyr < pc; lyr++) {
        var off = r * (0.92 + lyr * 0.22);
        ctx.save();
        if (pside === 0) ctx.translate(0, -off);
        else if (pside === 1) { ctx.translate(off, 0); ctx.rotate(PI / 2); }
        else if (pside === 2) ctx.translate(0, off);
        else { ctx.translate(-off, 0); ctx.rotate(PI / 2); }
        var pw = r * 1.5, ph = r * 0.28;
        ctx.fillStyle = lyr === 0 ? '#b0bec5' : '#78909c';
        ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1.5;
        ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
        ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
        /* заклёпки */
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.arc(-pw * 0.35, 0, 1.2, 0, TAU); ctx.arc(pw * 0.35, 0, 1.2, 0, TAU); ctx.fill();
        ctx.restore();
      }
    }
  }

  /* Пламя на горящем враге (в его цвете) */
  if (e.burning && alpha === 1) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var fl = 0.6 + Math.sin(state.time * 14 + e.wobblePhase) * 0.4;
    ctx.shadowColor = e.burnColor; ctx.shadowBlur = 12 * fl;
    ctx.fillStyle = hexToRgba(e.burnColor, 0.5);
    for (var bf = 0; bf < 5; bf++) {
      var ba = (bf / 5) * TAU + state.time * 4;
      var brr = r * (0.7 + fl * 0.5);
      ctx.beginPath();
      ctx.arc(Math.cos(ba) * r * 0.4, Math.sin(ba) * r * 0.4 - r * 0.3, brr * 0.35, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  /* Lv.1 Scout Dodge: ghost trail */
  if (e.type === 'scout' && e.level === 1 && e.dodgeCooldown > 0 && e.dodgeDir && alpha === 1) {
    var trailAlpha = e.dodgeCooldown / 1.5;
    ctx.globalAlpha = trailAlpha * 0.4;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    for (var ti = 1; ti <= 3; ti++) {
      var tOffset = ti * r * 0.5;
      ctx.save();
      ctx.translate(-e.dodgeDir.x * tOffset, -e.dodgeDir.y * tOffset);
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.lineTo(r * 0.6, r * 0.7);
      ctx.lineTo(-r * 0.6, r * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = alpha;
  }

  /* Lv.2 Scout Flicker: glitch effect */
  if (e.type === 'scout' && e.level === 2 && e.flickering && alpha === 1) {
    ctx.globalAlpha = 0.5;
    for (var gi = 0; gi < 3; gi++) {
      var gOffset = (Math.random() - 0.5) * r * 0.3;
      ctx.save();
      ctx.translate(gOffset, gOffset);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.lineTo(r * 0.6, r * 0.7);
      ctx.lineTo(-r * 0.6, r * 0.7);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = alpha;
  }

  /* Soldier crosshair (крест-визир) */
  if (e.type === 'soldier') {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-r*0.4, 0); ctx.lineTo(r*0.4, 0);
    ctx.moveTo(0, -r*0.4); ctx.lineTo(0, r*0.4);
    ctx.stroke();
  }

  /* Lv.1 Soldier Formation lines (линии связи к союзникам) */
  if (e.type === 'soldier' && e.level === 1 && e.formationStacks > 0 && alpha === 1) {
    ctx.strokeStyle = 'rgba(120,144,156,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    var soldierPos = e.body.getPosition();
    for (var fsi = 0; fsi < state.enemies.length; fsi++) {
      var other = state.enemies[fsi];
      if (other === e || other.type !== 'soldier' || other.level !== 1 || !other.alive) continue;
      var otherPos = other.body.getPosition();
      var sdx = soldierPos.x - otherPos.x, sdy = soldierPos.y - otherPos.y;
      var dist = Math.sqrt(sdx*sdx + sdy*sdy);
      if (dist < 2) {
        var otherSc = toScreen(otherPos.x, otherPos.y);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo((otherSc[0] - sx), (otherSc[1] - sy));
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  /* Lv.2 Soldier Block shield (фронтальный щит когда blockActive) */
  if (e.type === 'soldier' && e.level === 2 && e.blockActive && alpha === 1) {
    ctx.save();
    var eVel = e.body.getLinearVelocity();
    var blockAngle = Math.atan2(eVel.y, eVel.x);
    ctx.rotate(blockAngle - angle);
    ctx.fillStyle = 'rgba(79,195,247,0.3)';
    ctx.strokeStyle = 'rgba(79,195,247,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r + 4, -Math.PI/2, Math.PI/2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  /* General star */
  if (e.type === 'general') {
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath();
    for (var si2 = 0; si2 < 5; si2++) {
      var outerA = (si2 / 5) * TAU - PI / 2;
      var innerA = outerA + PI / 5;
      var or2 = r * 0.45, ir = r * 0.2;
      if (si2 === 0) ctx.moveTo(Math.cos(outerA)*or2, Math.sin(outerA)*or2);
      else ctx.lineTo(Math.cos(outerA)*or2, Math.sin(outerA)*or2);
      ctx.lineTo(Math.cos(innerA)*ir, Math.sin(innerA)*ir);
    }
    ctx.closePath();
    ctx.fill();
  }

  /* Tank armor rings */
  if (e.type === 'tank' || e.type === 'juggernaut') {
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    for (var ai = 0; ai < 3; ai++) {
      var ir2 = r * (0.4 + ai * 0.2);
      ctx.beginPath();
      ctx.arc(0, 0, ir2, 0, TAU);
      ctx.stroke();
    }
  }

  /* Walking legs */
  if (e.alive && !e.frozen && alpha === 1) {
    var legPhase = e.stepBob;
    ctx.strokeStyle = hexToRgba(color, 0.5);
    ctx.lineWidth = 1.5;
    for (var li = 0; li < 2; li++) {
      var la = (li === 0 ? -0.4 : 0.4) + Math.sin(legPhase + li * PI) * 0.15;
      var lx1 = Math.cos(PI/2 + la) * (r * 0.6);
      var ly1 = Math.sin(PI/2 + la) * (r * 0.6);
      var lx2 = Math.cos(PI/2 + la) * (r * 0.8);
      var ly2 = Math.sin(PI/2 + la) * (r * 0.8);
      ctx.beginPath();
      ctx.moveTo(lx1, ly1);
      ctx.lineTo(lx2, ly2);
      ctx.stroke();
    }
  }

  /* ФАЗА 12: Level визуалы */
  if (e.level > 0 && alpha === 1) {
    ctx.save();
    ctx.translate(0, -r - 8);

    if (e.level === 1) {
      /* Lv.1: Шеврон */
      ctx.fillStyle = 'rgba(255,214,0,0.7)';
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(3, -1);
      ctx.lineTo(0, 0);
      ctx.lineTo(-3, -1);
      ctx.closePath();
      ctx.fill();

      /* Слабый glow */
      ctx.shadowColor = 'rgba(255,214,0,0.3)';
      ctx.shadowBlur = 4;
      ctx.strokeStyle = 'rgba(255,214,0,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.15, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (e.level === 2) {
      /* Lv.2: Корона */
      ctx.fillStyle = 'rgba(255,193,7,0.9)';
      ctx.strokeStyle = 'rgba(255,235,59,1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(-3, -4);
      ctx.lineTo(-1, -2);
      ctx.lineTo(0, -5);
      ctx.lineTo(1, -2);
      ctx.lineTo(3, -4);
      ctx.lineTo(4, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      /* Яркий glow */
      ctx.shadowColor = 'rgba(255,193,7,0.6)';
      ctx.shadowBlur = 8;
      ctx.strokeStyle = 'rgba(255,193,7,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.2, 0, TAU);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  /* HP bar */
  if (e.alive && e.hp < e.maxHp && alpha === 1) {
    var barW = r * 1.8;
    var barH = 3;
    var barX = sx - barW / 2;
    var barY = sy - r - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
    var ratio = Math.max(0, e.hp / e.maxHp);
    var hpColor = ratio > 0.5 ? '#66bb6a' : ratio > 0.25 ? '#ffa726' : '#ef5350';
    ctx.fillStyle = hpColor;
    ctx.fillRect(barX, barY, barW * ratio, barH);
  }
}

function drawProjectiles() {
  for (var pi = 0; pi < state.projectiles.length; pi++) {
    var p = state.projectiles[pi];
    if (!p.alive) continue;
    var pos = p.body.getPosition();
    var sc = toScreen(pos.x, pos.y);
    var sx = sc[0], sy = sc[1];
    var r = p.radius * scale;
    var col = p.ammo.color;

    /* Плазменные молнии */
    drawProjectilePlasma(ctx, sx, sy, p);

    /* Ядро/капсула */
    var coreR = r * 0.55;
    var coreGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, coreR);
    coreGrad.addColorStop(0, '#ffffff');
    coreGrad.addColorStop(0.4, col);
    coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(sx, sy, coreR, 0, TAU);
    ctx.fill();
  }
}

function drawParticles() {
  for (var i = 0; i < state.particles.length; i++) {
    var p = state.particles[i];
    var sc = toScreen(p.x, p.y);
    var sx = sc[0], sy = sc[1];
    var lifeRatio = p.life / p.maxLife;
    ctx.globalAlpha = lifeRatio;
    ctx.fillStyle = p.color;
    var r = p.r * scale * lifeRatio;
    if (p.type === 'ring') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3 * lifeRatio;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, TAU);
      ctx.stroke();
    } else if (p.type === 'square') {
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(state.time * 5);
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.restore();
    } else if (p.type === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(sx, sy - r);
      ctx.lineTo(sx + r * 0.7, sy);
      ctx.lineTo(sx, sy + r);
      ctx.lineTo(sx - r * 0.7, sy);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === 'bolt') {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5 * lifeRatio;
      var bLen = r * 3;
      var ba2 = Math.random() * TAU;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(ba2)*bLen*0.5, sy + Math.sin(ba2)*bLen*0.5);
      ctx.lineTo(sx + Math.cos(ba2+0.5)*bLen, sy + Math.sin(ba2+0.5)*bLen);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ═══════════════ HELPER: hex color to rgba ═══════════════ */
function hexToRgba(hex, a) {
  if (hex.charAt(0) === 'r') return hex;
  var c = hex.replace('#','');
  if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var rv = parseInt(c.substring(0,2),16);
  var gv = parseInt(c.substring(2,4),16);
  var bv = parseInt(c.substring(4,6),16);
  return 'rgba('+rv+','+gv+','+bv+','+a+')';
}

/* ═══════════════ HUD ═══════════════ */
function updateHUD() {
  document.getElementById('hud-lives').textContent = '❤ ' + state.lives;
  /* \u0422\u0435\u043A\u0443\u0449\u0435\u0435 \u0438\u0433\u0440\u043E\u0432\u043E\u0435 \u0432\u0440\u0435\u043C\u044F \u0441\u0443\u0442\u043E\u043A \u0432\u043C\u0435\u0441\u0442\u043E \u044F\u0440\u043B\u044B\u043A\u0430 Day/Night */
  var cycleLen = 2 * CFG.SLOT_LEN;
  var ttod = ((((state.clock - CFG.INTRO_REST) % cycleLen) / cycleLen) + 1) % 1; /* 0 = \u043F\u043E\u043B\u0434\u0435\u043D\u044C */
  var hour24 = (12 + ttod * 24) % 24;
  var hh = Math.floor(hour24), mm = Math.floor((hour24 - hh) * 60);
  var isNight = state.nightFactor > 0.5;
  document.getElementById('hud-wave').textContent =
    (isNight ? '\uD83C\uDF19 ' : '\u2600 ') + (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  document.getElementById('hud-score').textContent = state.score;
  document.getElementById('hud-energy').textContent = '⚡ ' + state.energy;

  /* Показываем кнопку поднятия маяка только в затишье после колонизации */
  var raiseBtn = document.getElementById('raise-btn');
  var ammoBar = document.getElementById('ammo-bar');
  var shopBtn = document.getElementById('shop-btn');
  var inRest = state.colonized && state.firstColony && !state.waveActive && !state.gameOver;
  if (inRest) {
    raiseBtn.classList.add('visible');
    /* \u041e\u0431\u0440\u0430\u0442\u043d\u044b\u0439 \u043e\u0442\u0441\u0447\u0451\u0442 \u0434\u043e \u0432\u043e\u043b\u043d\u044b + \u043f\u043e\u0442\u0435\u043d\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u0431\u043e\u043d\u0443\u0441 (\u043f\u0430\u0434\u0430\u0435\u0442 \u043a \u0432\u043e\u043b\u043d\u0435) */
    var dueC = CFG.INTRO_REST + state.wave * CFG.SLOT_LEN;
    var secs = Math.max(0, Math.ceil(dueC - state.clock));
    var potPct = Math.max(0, Math.round((dueC - state.clock) / (2 * CFG.SLOT_LEN) * 100));
    var label = state.resting
      ? '\u23e9 +' + Math.round((state.restBonus || 0) * 100) + '% \u00b7 ' + secs + 's'
      : '\u23f1 ' + secs + 's \u00b7 REST +' + potPct + '%';
    raiseBtn.childNodes[0].textContent = label + '\n';
    var glitch = raiseBtn.querySelector('.btn__glitch');
    if (glitch) glitch.textContent = label;
  } else {
    raiseBtn.classList.remove('visible');
  }
  /* Скрываем оружие и колонию в бою */
  if (state.waveActive) {
    ammoBar.classList.add('combat-hide');
    shopBtn.classList.add('combat-hide');
  } else {
    ammoBar.classList.remove('combat-hide');
    shopBtn.classList.remove('combat-hide');
  }
  /* Магазин доступен во время отдыха между волнами (после первой колонии) */
  if (state.firstColony && !state.waveActive) {
    shopBtn.style.opacity = '1';
  } else {
    shopBtn.style.opacity = '0';
  }
}

function showWaveText(text) {
  var el = document.getElementById('wave-text');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(function(){ el.style.opacity = '0'; }, 1800);
}

/* ═══════════════ AMMO BAR ═══════════════ */
function buildAmmoBar() {
  var bar = document.getElementById('ammo-bar');
  bar.innerHTML = '';
  AMMO.forEach(function(a, i) {
    var unlocked = state.colonyTier >= a.tierReq;
    var btn = document.createElement('div');
    btn.className = 'ammo-btn' + (i === state.selectedAmmo ? ' active' : '') + (!unlocked ? ' locked' : '');
    btn.title = a.name + (unlocked ? '' : ' (нужен: ' + COLONY_TIERS[a.tierReq].name + ')');

    /* Создаём canvas превью — плазменные молнии */
    var previewCvs = document.createElement('canvas');
    previewCvs.width = 40;
    previewCvs.height = 40;
    var pCtx = previewCvs.getContext('2d');
    var cx = 20, cy = 20, pr = 14;

    /* Молнии из центра наружу */
    pCtx.strokeStyle = a.color;
    pCtx.lineWidth = 1.5;
    pCtx.shadowColor = a.color;
    pCtx.shadowBlur = 6;
    pCtx.globalAlpha = 0.85;

    for (var bi = 0; bi < 6; bi++) {
      var ba = (bi / 6) * TAU + Math.random() * 0.3;
      var px = cx, py = cy;
      pCtx.beginPath();
      pCtx.moveTo(cx, cy);
      for (var seg = 0; seg < 4; seg++) {
        var frac = (seg + 1) / 4;
        var tx = cx + Math.cos(ba) * pr * frac + (Math.random() - 0.5) * 4;
        var ty = cy + Math.sin(ba) * pr * frac + (Math.random() - 0.5) * 4;
        pCtx.lineTo(tx, ty);
        px = tx; py = ty;
      }
      pCtx.stroke();
    }
    pCtx.shadowBlur = 0;
    pCtx.globalAlpha = 1;

    btn.appendChild(previewCvs);
    btn.addEventListener('click', function() {
      if (!unlocked) return;
      state.selectedAmmo = i;
      buildAmmoBar();
    });
    bar.appendChild(btn);
  });
}

/* ═══════════════ SHOP ═══════════════ */
function buildShop() {
  var box = document.getElementById('shop-content');
  box.innerHTML = '';
  var ct = state.colonyTier, ti = COLONY_TIERS[ct];

  /* colony card */
  var sec1 = document.createElement('div'); sec1.className = 'shop-section';
  var label1 = document.createElement('div'); label1.className = 'shop-section-title'; label1.textContent = 'Эволюция колонии'; sec1.appendChild(label1);
  var card = document.createElement('div'); card.className = 'colony-card';
  var hdr = '<div class="colony-header"><span class="colony-icon">' + ti.icon + '</span><div><div class="colony-name">' + ti.name + '</div><div class="colony-tier-label">Уровень ' + (ct + 1) + ' / ' + COLONY_TIERS.length + '</div></div></div>';
  var bonuses = '<div class="colony-bonuses">' + ti.desc + '</div>';
  var dots = '<div class="colony-progress">';
  for (var d = 0; d < COLONY_TIERS.length; d++) dots += '<div class="colony-dot' + (d < ct ? ' filled' : '') + (d === ct ? ' current' : '') + '"></div>';
  dots += '</div>';
  card.innerHTML = hdr + bonuses + dots;

  if (ct < COLONY_TIERS.length - 1) {
    var next = COLONY_TIERS[ct + 1];
    var ebtn = document.createElement('button'); ebtn.className = 'evolve-btn';
    ebtn.textContent = '⬆ ' + next.name + ' — ⚡' + next.cost;
    ebtn.addEventListener('click', function() {
      if (state.energy >= next.cost) {
        state.energy -= next.cost;
        state.colonyTier++;
        var bonus = COLONY_TIERS[state.colonyTier];
        state.lives += bonus.bonusLives - COLONY_TIERS[state.colonyTier - 1].bonusLives;
        buildShop(); buildAmmoBar(); updateHUD();
      }
    });
    card.appendChild(ebtn);
  } else {
    var mx = document.createElement('button'); mx.className = 'evolve-btn maxed'; mx.textContent = 'МАКСИМАЛЬНЫЙ УРОВЕНЬ'; card.appendChild(mx);
  }
  sec1.appendChild(card); box.appendChild(sec1);

  /* perks section */
  var sec2 = document.createElement('div'); sec2.className = 'shop-section';
  var label2 = document.createElement('div'); label2.className = 'shop-section-title'; label2.textContent = 'Перки'; sec2.appendChild(label2);

  PERK_DEFS.forEach(function(pd) {
    var lvl = perkLvl(pd.id), maxed = lvl >= pd.maxLvl, locked = ct < pd.tierReq;
    var div = document.createElement('div'); div.className = 'perk-item' + (locked ? ' locked-tier' : '');
    var descText = maxed ? pd.descs[pd.maxLvl - 1] : (lvl > 0 ? pd.descs[lvl - 1] : pd.descs[0]);
    var nextDesc = !maxed && lvl < pd.maxLvl ? pd.descs[lvl] : '';
    var lvlDots = '';
    for (var d2 = 0; d2 < pd.maxLvl; d2++) lvlDots += '<span style="color:' + (d2 < lvl ? 'var(--cyan)' : 'rgba(255,255,255,0.15)') + '">●</span>';

    div.innerHTML = '<div class="perk-icon">' + pd.icon + '</div><div class="perk-info"><div class="perk-name">' + pd.name + ' <span class="perk-lvl">' + lvlDots + '</span></div>' +
      '<div class="perk-desc">' + (maxed ? descText : nextDesc) + '</div>' +
      (locked ? '<div class="perk-tier-req">Нужно: ' + COLONY_TIERS[pd.tierReq].icon + ' ' + COLONY_TIERS[pd.tierReq].name + '</div>' : '') +
      '</div>';

    if (!locked && !maxed) {
      var cost = pd.costs[lvl];
      var pbtn = document.createElement('button'); pbtn.className = 'perk-buy'; pbtn.textContent = '⚡' + cost;
      pbtn.addEventListener('click', (function(perkDef, perkCost) {
        return function() {
          if (state.energy >= perkCost) { state.energy -= perkCost; state.perks[perkDef.id]++; buildShop(); updateHUD(); }
        };
      })(pd, cost));
      div.appendChild(pbtn);
    } else if (maxed) {
      var mx2 = document.createElement('div'); mx2.className = 'perk-buy maxed'; mx2.textContent = 'МАКС'; div.appendChild(mx2);
    }
    sec2.appendChild(div);
  });

  /* ammo unlocks info */
  var hasLocked = false;
  /* Боеприпасы больше не продаются в магазине - они открываются автоматически с прокачкой колонии */

  box.appendChild(sec2);
}
