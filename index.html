<title>Lighthouse Defense</title>
<script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.28/dist/planck.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&amp;family=Orbitron:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050810;
  --text: #e8eaed;
  --cyan: #00e5ff;
  --red: #ff1744;
  --gold: #ffab00;
  --panel: rgba(5,8,16,0.94);
  --border: rgba(0,229,255,0.15);
}
.dark {
  --bg: #050810;
  --text: #e8eaed;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Chakra Petch',sans-serif; color:var(--text); touch-action:none; user-select:none; }
canvas { display:block; width:100%; height:100%; }
#hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:6px 8px; pointer-events:none; z-index:10; font-size:11px; font-weight:900; font-family:Consolas,'Courier New','Lucida Console',monospace; letter-spacing:1px; }
#hud > div {
  --primary: #0a0a0a; --shadow-primary: #00e5ff; --color: #0ff; --border: 2px; --stripe: #ff0000;
  --clip: polygon(5% 0, 95% 0, 100% 25%, 95% 100%, 5% 100%, 0 25%);
  background:transparent; border:none; padding:6px 14px; pointer-events:auto; position:relative;
  color:var(--color); text-transform:uppercase; letter-spacing:2px;
  text-shadow: 0 0 4px var(--color);
}
#hud > div:after, #hud > div:before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; clip-path: var(--clip); z-index: -1; }
#hud > div:before {
  background: repeating-linear-gradient(
    -45deg,
    var(--stripe) 0px, var(--stripe) 2px,
    transparent 2px, transparent 6px
  );
  transform: translate(0, 0); opacity:0.25;
  top:-3px; left:-3px; right:-3px; bottom:-3px;
}
#hud > div:after { background: var(--primary); }
.hud-lives { --color: #ff3d00; --stripe: #ff0000; }
.hud-energy { --color: #cc8800; --stripe: #ff6600; }
.hud-wave { --color: #00cc99; --stripe: #00aa66; }
.hud-score { --color: #889988; --stripe: #666; }
#ammo-bar { position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:10; } /* вертикальная плитка выбора снаряда */
.ammo-btn {
  --primary: #0a0a0a; --color: #888; --stripe: #333;
  --clip: polygon(12% 0, 88% 0, 100% 12%, 100% 88%, 88% 100%, 12% 100%, 0 88%, 0 12%);
  width:48px; height:48px; background:transparent; border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; font-size:20px;
  position:relative;
}
.ammo-btn:after, .ammo-btn:before { content: ''; position: absolute; clip-path: var(--clip); z-index: -1; }
.ammo-btn:before {
  top:-3px; left:-3px; right:-3px; bottom:-3px;
  background: repeating-linear-gradient(-45deg, var(--stripe) 0px, var(--stripe) 2px, transparent 2px, transparent 6px);
  opacity:0.3;
}
.ammo-btn:after { top:0; left:0; right:0; bottom:0; background: var(--primary); }
.ammo-btn.active { --stripe: #00e5ff; --primary: #001a1a; }
.ammo-btn.active:before { opacity:0.6; }
.ammo-btn.locked { opacity:0.35; cursor:default; }
.ammo-btn:not(.locked):hover { --stripe: #666; }
.ammo-btn canvas { display:block; }
#shop-btn {
  display:none; /* прокачка теперь в мире — на иконках городов */
  --primary: #ffab00; --shadow-primary: #ff3d00; --color: #fff; --border: 3px; --stripe: #ff3d00;
  --clip: polygon(10% 0, 90% 0, 100% 30%, 95% 100%, 5% 100%, 0 30%);
  position:fixed; bottom:12px; right:12px; z-index:10;
  color: var(--color); text-transform: uppercase; font-size: 11px; letter-spacing: 2px;
  font-weight: 900; padding:10px 16px; text-align: center; cursor: pointer;
  transition: 0.2s; font-family: Consolas,'Courier New','Lucida Console',monospace;
}
#shop-btn:after, #shop-btn:before { content: ''; position: absolute; clip-path: var(--clip); z-index: -1; }
#shop-btn:before {
  top:-4px; left:-4px; right:-4px; bottom:-4px;
  background: repeating-linear-gradient(-45deg, var(--stripe) 0px, var(--stripe) 3px, transparent 3px, transparent 8px);
  opacity:0.4;
}
#shop-btn:after { top:0; left:0; right:0; bottom:0; background: var(--primary); }
#shop-btn:hover { --primary: #ffd000; }
#shop-overlay { position:fixed; inset:0; z-index:100; display:none; background:rgba(0,0,0,0.7); }
#shop-overlay.open { display:flex; align-items:center; justify-content:center; }
#shop-panel { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; width:92%; max-width:380px; max-height:80vh; overflow-y:auto; }
#shop-panel h2 { font-family:'Orbitron',sans-serif; font-size:18px; color:var(--gold); margin-bottom:14px; text-align:center; }
.upgrade-item { display:flex; align-items:center; justify-content:space-between; padding:10px; margin-bottom:8px; border:1px solid var(--border); border-radius:10px; transition:all .2s; }
.upgrade-item:hover { border-color:var(--cyan); }
.upgrade-info { flex:1; }
.upgrade-name { font-weight:600; font-size:13px; }
.upgrade-desc { font-size:11px; color:rgba(232,234,237,0.5); margin-top:2px; }
.upgrade-cost-btn { background:rgba(255,171,0,0.15); border:1px solid var(--gold); border-radius:8px; padding:6px 12px; color:var(--gold); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; transition:all .2s; }
.upgrade-cost-btn:hover { background:rgba(255,171,0,0.3); }
.upgrade-cost-btn.maxed { background:rgba(0,229,255,0.1); border-color:var(--cyan); color:var(--cyan); cursor:default; }
.shop-section { margin-bottom:14px; }
.shop-section-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:rgba(232,234,237,0.35); margin-bottom:8px; padding-left:2px; }
.colony-card { background:rgba(0,229,255,0.04); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; }
.colony-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.colony-icon { font-size:28px; }
.colony-name { font-family:'Orbitron',sans-serif; font-size:15px; font-weight:700; color:var(--cyan); }
.colony-tier-label { font-size:10px; color:rgba(232,234,237,0.4); font-weight:600; }
.colony-bonuses { font-size:11px; color:rgba(232,234,237,0.5); line-height:1.6; margin-bottom:8px; }
.colony-bonuses span { color:var(--cyan); }
.colony-progress { display:flex; gap:4px; margin-bottom:8px; }
.colony-dot { width:100%; height:4px; border-radius:2px; background:rgba(255,255,255,0.08); }
.colony-dot.filled { background:var(--cyan); }
.colony-dot.current { background:var(--gold); box-shadow:0 0 6px rgba(255,171,0,0.4); }
.evolve-btn { width:100%; padding:8px; border:1px solid var(--gold); background:rgba(255,171,0,0.08); border-radius:8px; color:var(--gold); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; cursor:pointer; transition:all .2s; }
.evolve-btn:hover { background:rgba(255,171,0,0.2); }
.evolve-btn.maxed { border-color:var(--cyan); color:var(--cyan); background:rgba(0,229,255,0.06); cursor:default; }
.perk-item { display:flex; align-items:center; gap:10px; padding:10px; margin-bottom:6px; border:1px solid var(--border); border-radius:10px; transition:all .2s; }
.perk-item:hover { border-color:rgba(0,229,255,0.3); }
.perk-item.locked-tier { opacity:0.3; pointer-events:none; }
.perk-icon { font-size:22px; width:32px; text-align:center; flex-shrink:0; }
.perk-info { flex:1; min-width:0; }
.perk-name { font-weight:600; font-size:12px; display:flex; align-items:center; gap:6px; }
.perk-lvl { font-size:10px; color:var(--cyan); font-weight:700; }
.perk-desc { font-size:10px; color:rgba(232,234,237,0.45); margin-top:2px; line-height:1.4; }
.perk-tier-req { font-size:9px; color:rgba(255,171,0,0.5); margin-top:1px; }
.perk-buy { flex-shrink:0; padding:5px 10px; border:1px solid var(--gold); background:rgba(255,171,0,0.1); border-radius:7px; color:var(--gold); font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:11px; cursor:pointer; transition:all .2s; }
.perk-buy:hover { background:rgba(255,171,0,0.25); }
.perk-buy.maxed { border-color:rgba(0,229,255,0.3); color:rgba(0,229,255,0.6); background:rgba(0,229,255,0.05); cursor:default; }
#shop-close { display:block; margin:10px auto 0; padding:8px 30px; background:transparent; border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:var(--text); font-family:'Chakra Petch',sans-serif; font-size:14px; cursor:pointer; }
#wave-text { position:fixed; top:72px; left:50%; transform:translateX(-50%); z-index:50; font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; color:var(--cyan); text-shadow:0 0 30px rgba(0,229,255,0.6); pointer-events:none; opacity:0; transition:opacity .4s; white-space:nowrap; }
#game-over-overlay { position:fixed; inset:0; z-index:200; display:none; background:rgba(8,12,20,0.9); align-items:center; justify-content:center; flex-direction:column; }
#game-over-overlay.open { display:flex; }
#game-over-overlay h1 { font-family:'Orbitron',sans-serif; font-size:36px; color:var(--red); margin-bottom:10px; }
#game-over-overlay p { font-size:16px; margin-bottom:20px; color:rgba(232,234,237,0.7); }
#restart-btn { padding:12px 36px; border:2px solid var(--cyan); background:transparent; color:var(--cyan); font-family:'Orbitron',sans-serif; font-size:16px; font-weight:700; border-radius:12px; cursor:pointer; transition:all .2s; }
#restart-btn:hover { background:rgba(0,229,255,0.15); }
#tut-prompt {
  --tp-primary: #0a0014; --tp-color: #cc00aa; --tp-stripe: #660055;
  --tp-clip: polygon(8% 0, 92% 0, 100% 20%, 95% 95%, 90% 100%, 10% 100%, 5% 95%, 0 20%);
  position:fixed; z-index:190; pointer-events:none;
  color: var(--tp-color); text-transform: uppercase; font-size: 16px; letter-spacing: 3px;
  font-weight: 900; min-width:180px; padding:0 18px; height: 46px; line-height: 46px; text-align: center;
  font-family: Consolas,'Courier New','Lucida Console',monospace;
  text-shadow: 0 0 8px var(--tp-color), 0 0 2px var(--tp-color);
  image-rendering: pixelated; filter: contrast(1.4) brightness(0.9);
  opacity:0; transition: opacity 0.35s;
  transform: translateX(-50%);
  white-space:nowrap;
}
#tut-prompt.visible { opacity:1; }
#tut-prompt:after, #tut-prompt:before { content:''; position:absolute; clip-path: var(--tp-clip); z-index:-1; }
#tut-prompt:before {
  top:-4px; left:-4px; right:-4px; bottom:-4px;
  background: repeating-linear-gradient(-45deg, var(--tp-stripe) 0px, var(--tp-stripe) 3px, transparent 3px, transparent 8px);
  opacity:0.5;
}
#tut-prompt:after { top:0; left:0; right:0; bottom:0; background: var(--tp-primary); }
#tut-prompt .tp-text { position:relative; z-index:1; }
#tut-prompt.green { --tp-color: #00ee66; --tp-stripe: #005522; }
#tut-prompt .emoji-pink { color:#ff44cc; text-shadow:0 0 6px rgba(255,68,204,0.7); }
#tut-prompt .emoji-green { color:#00ee66; text-shadow:0 0 6px rgba(0,238,102,0.7); }
@keyframes tut-blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
#colonize-overlay { position:fixed; inset:0; z-index:200; display:none; align-items:flex-end; justify-content:center; padding-bottom:55px; background:transparent; transition:opacity 0.4s; } /* ВРЕМЕННО СКРЫТО */
#colonize-overlay.hidden { opacity:0; pointer-events:none; }
#colonize-btn {
  --primary: #1a0000; --shadow-primary: #330000; --color: #cc0000; --border: 5px; --shimmy-distance: 5;
  --clip: polygon(11% 0, 95% 0, 100% 25%, 90% 90%, 95% 90%, 85% 90%, 85% 100%, 7% 100%, 0 80%);
  --clip-one: polygon(0 2%, 100% 2%, 100% 95%, 95% 95%, 95% 90%, 85% 90%, 85% 95%, 8% 95%, 0 70%);
  --clip-two: polygon(0 78%, 100% 78%, 100% 100%, 95% 100%, 95% 90%, 85% 90%, 85% 100%, 8% 100%, 0 78%);
  --clip-three: polygon(0 44%, 100% 44%, 100% 54%, 95% 54%, 95% 54%, 85% 54%, 85% 54%, 8% 54%, 0 54%);
  --clip-four: polygon(0 0, 100% 0, 100% 0, 95% 0, 95% 0, 85% 0, 85% 0, 8% 0, 0 0);
  --clip-six: polygon(0 40%, 100% 40%, 100% 85%, 95% 85%, 95% 85%, 85% 85%, 85% 85%, 8% 85%, 0 70%);
  --clip-seven: polygon(0 63%, 100% 63%, 100% 80%, 95% 80%, 95% 80%, 85% 80%, 85% 80%, 8% 80%, 0 70%);
  color: var(--color); text-transform: uppercase; font-size: 18px; letter-spacing: 4px; position: relative;
  font-weight: 900; width: 280px; height: 60px; line-height: 60px; text-align: center; cursor: pointer;
  transition: 0.2s; font-family: Consolas,'Courier New','Lucida Console',monospace;
  text-shadow: 0 0 8px var(--color), 0 0 2px var(--color);
  image-rendering: pixelated; filter: contrast(1.6) brightness(0.9);
}
#colonize-btn:after, #colonize-btn:before { content: ''; position: absolute; clip-path: var(--clip); z-index: -1; }
#colonize-btn:before {
  top:-6px; left:-6px; right:-6px; bottom:-6px;
  background: repeating-linear-gradient(-45deg, #aa0000 0px, #aa0000 3px, #220000 3px, #220000 8px);
  opacity:0.7;
}
#colonize-btn:after { top:0; left:0; right:0; bottom:0; background: var(--primary); }
#colonize-btn .btn__glitch {
  position: absolute; top: calc(var(--border) * -1); left: calc(var(--border) * -1); right: calc(var(--border) * -1);
  bottom: calc(var(--border) * -1); background: #330000;
  text-shadow: 2px 2px #440000, -2px -2px #880000;
  clip-path: var(--clip); animation: glitch 5s infinite; display: block;
}
#colonize-btn .btn__glitch:before {
  content: ''; position: absolute; top: var(--border); right: var(--border); bottom: var(--border); left: var(--border);
  clip-path: var(--clip); background: var(--primary); z-index: -1;
}
@keyframes glitch {
  0% { clip-path: var(--clip-one); }
  2%, 8% { clip-path: var(--clip-two); transform: translate(calc(var(--shimmy-distance) * -1%), 0); }
  6% { clip-path: var(--clip-two); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
  9% { clip-path: var(--clip-two); transform: translate(0, 0); }
  10% { clip-path: var(--clip-three); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
  13% { clip-path: var(--clip-three); transform: translate(0, 0); }
  14%, 21% { clip-path: var(--clip-four); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
  35%, 45% { clip-path: var(--clip-six); transform: translate(calc(var(--shimmy-distance) * -1%)); }
  40% { clip-path: var(--clip-six); transform: translate(calc(var(--shimmy-distance) * 1%)); }
  50% { clip-path: var(--clip-six); transform: translate(0, 0); }
  55% { clip-path: var(--clip-seven); transform: translate(calc(var(--shimmy-distance) * 1%), 0); }
  60% { clip-path: var(--clip-seven); transform: translate(0, 0); }
  31%, 61%, 100% { clip-path: var(--clip-four); }
}
@keyframes neon-pulse {
  0%, 100% { box-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 30px #ff1493, inset 0 0 10px rgba(255,20,147,0.4); }
  50% { box-shadow: 0 0 20px #ff69b4, 0 0 40px #ff69b4, 0 0 60px #ff69b4, inset 0 0 20px rgba(255,105,180,0.6); }
}

/* ═══════════════ SEQUENCER — MIDI-LIKE SPAWN TIMELINE ═══════════════ */
/*
 * Нота = одна единица спавна:
 *   { t: сек, type: 'scout', x: 0..1, y?: число, level: 0|1|2, group?: строка }
 *
 * Формация = группа нот (leader + escorts, раскрывается в ноты при загрузке):
 *   { t: сек, formation: 'vee', leader: 'general', leaderLevel: 0,
 *     escorts: [{ type:'soldier', dx: -1.5, dy: -0.5, level: 0 }, ...] }
 *
 * Волна-секвенция:
 *   { id, name, duration, notes: [...], formations: [...],
 *     modifiers: { hpMult, speedMult, nightOverride } }
 *
 * notes ДОЛЖНЫ быть отсортированы по t (для линейного воспроизведения).
 * formations раскрываются в notes при запуске волны функцией expandFormations().
 */

/* Преобразует formations в плоские notes */
function expandFormations(seq) {
  if (!seq.formations || seq.formations.length === 0) return seq.notes.slice();
  var out = seq.notes.slice();
  for (var fi = 0; fi < seq.formations.length; fi++) {
    var f = seq.formations[fi];
    var def = E_TYPES[f.leader];
    if (!def) continue;
    /* Лидер */
    out.push({ t: f.t, type: f.leader, x: 0.5, y: -1 - def.r, level: f.leaderLevel || 0, group: f.id || ('fm_' + fi) });
    /* Эскорты */
    if (f.escorts) {
      for (var ei = 0; ei < f.escorts.length; ei++) {
        var esc = f.escorts[ei];
        var eDef = E_TYPES[esc.type];
        if (!eDef) continue;
        /* dx/dy в мировых юнитах → конвертируем dx в нормализованную x */
        var nx = 0.5 + (esc.dx || 0) / CFG.WORLD_W;
        var ny = -1 - (eDef.r) + (esc.dy || 0);
        out.push({ t: f.t + (esc.dt || 0), type: esc.type, x: nx, y: ny, level: esc.level || 0, group: f.id || ('fm_' + fi) });
      }
    }
  }
  /* Сортируем по времени */
  out.sort(function(a, b) { return a.t - b.t; });
  return out;
}

/* ── Генераторы боевых ФИГУР (возвращают массивы нот) ──
   Враги идут построениями (шеренга/клин/ранги/фаланга/окружение/колонна),
   а не хаотичными пачками. Последний параметр spd — множитель скорости
   фигуры (можно пускать быстрые дозоры и медленные колонны в одной волне). */
function _spread(count, a, b) {
  a = (a === undefined) ? 0.12 : a; b = (b === undefined) ? 0.88 : b;
  var xs = []; if (count <= 1) return [(a + b) / 2];
  for (var i = 0; i < count; i++) xs.push(a + (b - a) * (i / (count - 1)));
  return xs;
}
function _stamp(o, spd) { if (spd && spd !== 1) for (var i = 0; i < o.length; i++) o[i].spd = spd; return o; }
/* Шеренга — линия по ширине */
function bLine(t, type, count, level, spd) {
  var o = [], xs = _spread(count);
  for (var i = 0; i < count; i++) o.push({ t: t, type: type, x: xs[i], level: level || 0 });
  return _stamp(o, spd);
}
/* Клин (V) — центр впереди, фланги отстают */
function bVee(t, type, count, level, spd) {
  var o = [], half = (count - 1) / 2;
  for (var i = 0; i < count; i++) { var d = i - half; o.push({ t: t + Math.abs(d) * 0.12, type: type, x: 0.5 + d * 0.06, level: level || 0 }); }
  return _stamp(o, spd);
}
/* Ранги — files столбцов × ranks рядов, ряды входят с задержкой */
function bRanks(t, type, files, ranks, level, dtGap, spd) {
  var o = [], xs = _spread(files, 0.2, 0.8); dtGap = dtGap || 0.5;
  for (var r = 0; r < ranks; r++) for (var f = 0; f < files; f++) o.push({ t: t + r * dtGap, type: type, x: xs[f], level: level || 0 });
  return _stamp(o, spd);
}
/* Фаланга-черепаха — прямоугольник, по краям щитоносцы (edge), внутри core */
function bPhalanx(t, core, edge, files, ranks, level, dtGap, spd) {
  var o = [], xs = _spread(files, 0.24, 0.76); dtGap = dtGap || 0.45;
  for (var r = 0; r < ranks; r++) for (var f = 0; f < files; f++) {
    var isEdge = (f === 0 || f === files - 1);
    o.push({ t: t + r * dtGap, type: isEdge ? edge : core, x: xs[f], level: level || 0 });
  }
  return _stamp(o, spd);
}
/* Окружение — по краям карты + немного по центру */
function bSurround(t, type, count, level, spd) {
  var o = [];
  for (var i = 0; i < count; i++) {
    var x = (i % 3 === 0) ? (0.1 + Math.random() * 0.8) : (Math.random() < 0.5 ? 0.02 + Math.random() * 0.2 : 0.78 + Math.random() * 0.2);
    o.push({ t: t + Math.random() * 1.5, type: type, x: x, level: level || 0 });
  }
  return _stamp(o, spd);
}
/* Колонна — тяжёлый лидер впереди по центру, эскорт КОЛОННОЙ позади (фигура) */
function bColumn(t, heavy, hlvl, escort, n, spd) {
  var o = [{ t: t, type: heavy, x: 0.5, level: hlvl || 0 }];
  for (var i = 0; i < n; i++) {
    var side = (i % 2 ? 1 : -1), row = 1 + Math.floor(i / 2);
    o.push({ t: t + row * 0.35, type: escort, x: 0.5 + side * 0.05 * Math.ceil((i + 1) / 2), level: 0 });
  }
  return _stamp(o, spd);
}
function bCat() { var o = []; for (var i = 0; i < arguments.length; i++) o = o.concat(arguments[i]); return o; }

/* ═══════════════ STREAMING CLOUD HEIGHTMAP (surface generator) ═══════════════ */
/*
 * Облака — это ПРОКРУЧИВАЕМАЯ КАРТА ВЫСОТ из fbm-шума (порт «наброска», который
 * тестеры признали лучшим по стилю), а не сетка с альфой и не частицы.
 *   • поле высот каждого слоя генерируется из шума и плывёт (scrollY) + сносится
 *     ветром (scrollX); два слоя идут в разные стороны — параллакс;
 *   • высота режется по порогу CLOUD_T → ЧЁТКИЕ облачные банки, палитра красит
 *     по высоте (без длинного альфа-градиента — нет «помутнения в глазах»);
 *   • взрыв вырезает временную дыру в карте высот (carveField), маяк вдавливает
 *     облака вокруг себя (repel) — обе правки затягиваются перегенерацией поля.
 * Рендер попиксельный в уменьшенный offscreen (пиксельность), с окраской конуса
 * луча маяка в красный прямо в буфере.
 */
var CLOUD_CELL = 9;        /* px на ячейку поля высот */
var fw = 0, fh = 0;        /* размеры поля */
var tw = 0;                /* флаг готовности */
var cloudDownscale = 2;    /* уменьшение оффскрина рендера (nearest → пиксельность) */
var _simTime = 0;

var DITHER_AMP = 0.10;     /* дизеринг кромки (гранулярность вместо резкого пикселя) */
var _BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

/* Слои облаков — прокручиваемая карта высот (heightmap «surface generator»).
   Каждый слой — поле высот из fbm-шума, которое плывёт (scrollY) + сносится
   ветром (scrollX) и перегенерируется каждый кадр. deck прячет врагов, high —
   тонкий верхний слой, плывёт в другую сторону (параллакс). dx/dy — вектор ветра
   для параллакса зерна в рендере. */
var cloudLayers = [

/* ── Быстрый хеш + шум (для curl-парения и зерна) ── */
function _hash(ix, iy) {
  var h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function _smoothNoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  var a = _hash(ix, iy), b = _hash(ix + 1, iy), c = _hash(ix, iy + 1), d = _hash(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function _noise3(x, y, z) {
  var z0 = Math.floor(z), fz = z - z0; fz = fz * fz * (3 - 2 * fz);
  var a = _smoothNoise(x + z0 * 19.3, y - z0 * 11.7);
  var b = _smoothNoise(x + (z0 + 1) * 19.3, y - (z0 + 1) * 11.7);
  return a + (b - a) * fz;
}
function _fbm3(x, y, z) {
  return _noise3(x, y, z) * 0.65 + _noise3(x * 2.17 + 9.2, y * 2.17 - 4.3, z * 1.7 + 2.1) * 0.35;
}

function sampleGrid(g, fx, fy) {

  return [{ x:bx, y:by, w:bw, h:bh, def:u, level:lvl, maxed:lvl >= u.max, cost:cost, afford: state.energy >= cost }];
}
function buyWallUpgrade(w) {
  var u = WALL_TURRET, lvl = w.up.turret || 0; if (lvl >= u.max) return;
  var cost = priced(u.base + u.step * lvl); if (state.energy < cost) return;
  state.energy -= cost; w.up.turret = lvl + 1; updateHUD();
}
/* Крепости + их турели в мировом слое (под облаками) */
function drawWalls() {
  if (!state.colonized) return;
  ensureWalls();
  var img = ASSET_IMG['walls'], meta = ASSET_DATA['walls'], dsz = 42;
  for (var i = 0; i < state.walls.length; i++) {
    var w = state.walls[i], s = wallScreen(w);
    var row = Math.min(3, w.up.turret || 0); /* строка = уровень крепости */
    if (img && img.complete && img.naturalWidth) {
      var tsz = meta.tile, prev = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, row * tsz, tsz, tsz, s.x - dsz / 2, s.y - dsz * 0.78, dsz, dsz);
      ctx.imageSmoothingEnabled = prev;
    } else {
      ctx.save(); ctx.fillStyle = '#2a3a5a'; ctx.strokeStyle = '#7fa0df'; ctx.lineWidth = 2;
      ctx.fillRect(s.x - 15, s.y - 26, 30, 30); ctx.strokeRect(s.x - 15, s.y - 26, 30, 30); ctx.restore();
    }
    if (w.up.turret > 0) {
      var tkey = w.up.turret >= 3 ? 'turret_mk4' : (w.up.turret === 2 ? 'turret_mk3' : 'turret_mk2');
      var aa = (w.turretAng === undefined) ? -Math.PI / 2 : w.turretAng;
      var nfr = (ASSET_DATA[tkey] && ASSET_DATA[tkey].frames) || 11, tf;
      if (w.turretFlash > 0) tf = nfr - 1;
      else if (w.turretAim) { var pr = (w.turretCdMax > 0) ? 1 - Math.max(0, Math.min(1, w.turretCd / w.turretCdMax)) : 0; tf = Math.round(pr * (nfr - 2)); }
      else tf = 0;
      var tsc = 22 / ((ASSET_DATA[tkey] && ASSET_DATA[tkey].fh) || 80);
      drawSpriteFrame(tkey, tf, s.x, s.y - dsz * 0.55, aa + Math.PI / 2, tsc, 1);
      turretMuzzle(s.x, s.y - dsz * 0.55, aa, w.up.turret, w.turretFlash);
    }
  }
}
/* Турели стен: авто-стрельба по врагам (как городские) */
function updateWallTurrets(dt) {
  ensureWalls();
  if (!state.walls.length) return;
  var active = state.waveActive && state.enemies.length;
  var agg = cityAgg();
  for (var i = 0; i < state.walls.length; i++) {
    var w = state.walls[i], lvl = w.up.turret || 0;
    if (lvl <= 0) continue;
    var s = wallScreen(w), pvx = s.x, pvy = s.y - 22, wx = pvx / scale, wy = pvy / scale;
    var best = null;
    if (active) {
      var range = 6 + lvl * 2.5, bestD = range;
      for (var e = 0; e < state.enemies.length; e++) {
        var en = state.enemies[e]; if (!en.alive) continue;
        var ep = en.body.getPosition(), dx = ep.x - wx, dy = ep.y - wy, d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestD) { bestD = d; best = en; }
      }
    }
    w.turretAim = best;
    var desired = -Math.PI / 2;
    if (best) { var bs = toScreen(best.body.getPosition().x, best.body.getPosition().y); desired = Math.atan2(bs[1] - pvy, bs[0] - pvx); }
    if (w.turretAng === undefined) w.turretAng = desired;
    var da = desired - w.turretAng; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    w.turretAng += da * Math.min(1, dt * 8);
    if (w.turretCd > 0) w.turretCd -= dt;
    if (w.turretFlash > 0) w.turretFlash -= dt;
    if (!active || !best || w.turretCd > 0) continue;
    w.turretCd = Math.max(0.4, 1.3 - lvl * 0.25); w.turretCdMax = w.turretCd; w.turretFlash = 0.12;
    var bp = best.body.getPosition();
    var dmg = (3 + lvl * 3) * agg.dmgMult; if (best.shielded) dmg *= 0.5;
    best.hp -= dmg; best.flashTimer = 0.1;
    state.lightningArcs.push({ x1: wx, y1: wy, x2: bp.x, y2: bp.y, life: 0.18 });
    spawnElectricSparks(bp.x, bp.y, '#37e0ff', 4);
    if (agg.tok >= 2) igniteEnemy(best);
    if (best.hp <= 0) killEnemy(best);
  }
}

/* Выстрел = разряд: ток резко обрывается, свет города мерцает, по проводу
   проходит яркая вспышка (ушедшая в маяк дуга). */
function dischargeCities() {
  for (var i = 0; i < state.cities.length; i++) {
    var c = state.cities[i];
    c.feed = 0;          /* ток обрывается */
    c.flicker = 0.9;     /* свет мерцает частями */
    c.discharge = 0.25;  /* таймер яркой вспышки-разряда по проводу */
  }
}
function updateVolley(dt) {
  for (var i = state.volley.length - 1; i >= 0; i--) {
    var v = state.volley[i]; v.delay -= dt;
    if (v.delay <= 0) {
      fireProjectile(v.x, v.y, v.nx, v.ny, v.speed, v.charge, v.ammoIdx);
      dischargeCities();
      state.volley.splice(i, 1);
    }
  }
}
function updateCities(dt) {
  var charging = state.dragging;
  /* Интенсивность тока растёт вместе с зарядом — ток «копится» пока тянем */
  var chg = charging ? Math.min(state.charge / CFG.MAX_CHARGE, 1) : 0;
  for (var i = 0; i < state.cities.length; i++) {
    var c = state.cities[i];
    if (charging) c.feed = Math.max(c.feed, 0.2 + 0.6 * chg);
    c.feed -= dt * 1.8; if (c.feed < 0) c.feed = 0;
    c.flicker -= dt * 1.3; if (c.flicker < 0) c.flicker = 0;
    if (c.discharge > 0) { c.discharge -= dt * 4; if (c.discharge < 0) c.discharge = 0; }
    if (c.turretCd > 0) c.turretCd -= dt;
    if (c.turretFlash > 0) c.turretFlash -= dt;
  }
}

/* Плавный поворот ствола турели к цели (или «вверх», откуда идут враги) */
function aimTurret(c, best, dt) {
  var pivotX = c.x + c.r * 0.6, pivotY = c.y - c.r * 0.4; /* пивот пушки (как в отрисовке) */
  var desired;
  if (best && best.alive) {
    var bsp = toScreen(best.body.getPosition().x, best.body.getPosition().y);
    desired = Math.atan2(bsp[1] - pivotY, bsp[0] - pivotX);
  } else {
    desired = -Math.PI / 2; /* покой — ствол вверх, к фронту врагов */
  }
  if (c.turretAng === undefined) c.turretAng = desired;
  var da = desired - c.turretAng;
  while (da > Math.PI) da -= TAU;
  while (da < -Math.PI) da += TAU;
  c.turretAng += da * Math.min(1, dt * 8); /* плавный доворот */
}

/* Туррели городов: авто-разряд по ближайшему врагу в бою (сила от уровня) */
function updateTurrets(dt) {
  if (!state.waveActive || !state.enemies.length) {
    /* нет боя — цели нет, стволы возвращаются вверх */
    for (var q = 0; q < state.cities.length; q++) {
      var cc = state.cities[q];
      if ((cc.up.turret || 0) > 0) { cc.turretAim = null; aimTurret(cc, null, dt); }
    }
    return;
  }
  var agg = cityAgg();
  for (var i = 0; i < state.cities.length; i++) {
    var c = state.cities[i], lvl = c.up.turret || 0;
    if (lvl <= 0) continue;
    var cwx = c.x / scale, cwy = c.y / scale;         /* город в мировых координатах */
    var range = 6 + lvl * 2.5;
    /* ближайшая ЖИВАЯ цель в радиусе — каждый кадр (для аима), null если нет */
    var best = null, bestD = range;
    for (var e = 0; e < state.enemies.length; e++) {
      var en = state.enemies[e]; if (!en.alive) continue;
      var ep = en.body.getPosition(), dx = ep.x - cwx, dy = ep.y - cwy, d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = en; }
    }
    c.turretAim = best;          /* сбрасывается в null, если цель ушла/умерла */
    aimTurret(c, best, dt);      /* плавный поворот к цели каждый кадр */
    if (c.turretCd > 0 || !best) continue; /* целимся, но стреляем только по кулдауну и при цели */
    c.turretCd = Math.max(0.4, 1.3 - lvl * 0.25);      /* темп растёт с уровнем */
    c.turretCdMax = c.turretCd;  /* для анимации зарядки спрайта */
    c.turretFlash = 0.12;        /* кадр «после выстрела» */
    var bp = best.body.getPosition();
    var dmg = (3 + lvl * 3) * agg.dmgMult;
    if (best.shielded) dmg *= 0.5;
    best.hp -= dmg; best.flashTimer = 0.1;
    state.lightningArcs.push({ x1: cwx, y1: cwy, x2: bp.x, y2: bp.y, life: 0.18 });
    spawnElectricSparks(bp.x, bp.y, '#37e0ff', 4);
    if (agg.tok >= 2) igniteEnemy(best);
    if (best.hp <= 0) killEnemy(best);
    c.flicker = 0.3; c.feed = 0.5;
  }
}

/* Позиции электростанций между городом и башней (ближе к башне) */
function plantPositions(city) {
  var out = [];
  var P = city.up.plant; if (P <= 0) return out;
  var lh = toScreen(state.lighthouse.x, state.lighthouse.y);
  var dx = lh[0] - city.x, dy = lh[1] - city.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len;
  for (var k = 0; k < P; k++) {
    var t = 0.52 + 0.11 * k;
    var off = (k % 2 ? 1 : -1) * (13 + 6 * (k >> 1));
    out.push({ x: city.x + dx * t + px * off, y: city.y + dy * t + py * off });
  }
  return out;
}

/* Постоянные пилоны на коридоре город→маяк (детерминированы, не дрожат).
   Смещены перпендикулярно, чтобы провод ломался зигзагом. */
function pylonPositions(city) {
  var lh = toScreen(state.lighthouse.x, state.lighthouse.y);
  var dx = lh[0] - city.x, dy = lh[1] - city.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len, py = dx / len;
  var seed = city.x * 0.13 + city.y * 0.07;
  var out = [];
  var ts = [0.3, 0.68];
  for (var k = 0; k < ts.length; k++) {
    var side = Math.sin(seed + k * 2.3) > 0 ? 1 : -1;
    var off = side * (10 + 6 * k);
    out.push({ x: city.x + dx * ts[k] + px * off, y: city.y + dy * ts[k] + py * off });
  }
  return out;
}

/* Ломаный путь провода: город → (пилоны+станции, по прогрессу к башне) → башня */
function wirePath(city) {
  var lh = toScreen(state.lighthouse.x, state.lighthouse.y);
  var dx = lh[0] - city.x, dy = lh[1] - city.y;
  var len2 = dx * dx + dy * dy || 1;
  var mids = plantPositions(city).concat(pylonPositions(city));
  for (var i = 0; i < mids.length; i++) {
    mids[i].t = ((mids[i].x - city.x) * dx + (mids[i].y - city.y) * dy) / len2;
  }
  mids.sort(function(a, b){ return a.t - b.t; });
  var out = [{ x: city.x, y: city.y }];
  for (var j = 0; j < mids.length; j++) out.push({ x: mids[j].x, y: mids[j].y });
  out.push({ x: lh[0], y: lh[1] });
  return out;
}

/* ── Хит-боксы иконок (экранные координаты) ── */
function cityIconRect(c) { return { x: c.x - 13, y: c.y - c.r - 30, w: 26, h: 26 }; }
/* Кольцо-реактор токамака: центр и радиус (заземлён к городу) */
function tokRing(c) { var r = 12 + (c.up.tok || 0) * 3; return { x: c.x, y: c.y - c.r - r - 2, r: r }; }
/* Кнопка токамака (открывает меню перепривязки бонусного снаряда) */
function tokBtnRect(c) { var tr = tokRing(c); return { x: tr.x + tr.r + 3, y: tr.y - 9, w: 18, h: 18 }; }
/* Кнопки меню токамака: выбор типа бонусного снаряда (стандарт + разблокированные) */
function tokMenuButtons(c) {
  var opts = [0];                       /* стандарт всегда */
  if ((c.up.tok || 0) > 0) opts.push(1); /* Тесла — когда есть токамак */
  var r = tokBtnRect(c), bw = 132, bh = 24, gap = 4;
  var bx = r.x + r.w + 4, by = r.y;
  if (bx + bw > W - 6) bx = r.x - 4 - bw;
  if (bx < 6) bx = 6;
  if (by < 44) by = 44;
  if (by + opts.length * (bh + gap) > H - 8) by = H - 8 - opts.length * (bh + gap);
  var out = [];
  for (var i = 0; i < opts.length; i++) out.push({ x: bx, y: by + i * (bh + gap), w: bw, h: bh, ammo: opts[i] });
  return out;
}
function cityPanelButtons(city) {
  var list = CITY_UPGRADES.concat([CITY_SPECIAL.turret, CITY_SPECIAL.tok]);
  var bw = 176, bh = 28, gap = 5, N = list.length;
  var bx = city.x + 26, by = city.y - (N * (bh + gap)) / 2;
  if (bx + bw > W - 6) bx = city.x - 26 - bw;
  if (bx < 6) bx = 6;
  if (by < 44) by = 44;
  if (by + N * (bh + gap) > H - 24) by = H - 24 - N * (bh + gap);
  var out = [];
  for (var i = 0; i < N; i++) {
    var u = list[i], lvl = city.up[u.key] || 0, maxed = lvl >= u.max, cost = priced(u.base + u.step * lvl);
    var locked = (u.key === 'tok') && !tokamakReady(city);
    out.push({ x: bx, y: by + i * (bh + gap), w: bw, h: bh, def: u, level: lvl, maxed: maxed, cost: cost, afford: state.energy >= cost, locked: locked });
  }
  return out;
}

/* Тап по миру: иконки городов / кнопки панели / основание нового города.
   Возвращает true, если тап «съеден» (не начинать перетаскивание маяка). */
function cityHitTest(sx, sy) {
  if (!state.colonized || state.waveActive) { state.activeCity = -1; state.tokMenu = -1; state.activeWall = -1; return false; } /* в бою прокачка недоступна */
  /* Панель стены открыта — ловим покупку или закрываем по тапу мимо */
  if (state.activeWall >= 0 && state.walls[state.activeWall]) {
    var wbtns = wallPanelButtons(state.walls[state.activeWall]);
    for (var wpi = 0; wpi < wbtns.length; wpi++) {
      var wpb = wbtns[wpi];
      if (sx >= wpb.x && sx <= wpb.x + wpb.w && sy >= wpb.y && sy <= wpb.y + wpb.h) {
        if (!wpb.maxed && wpb.afford) buyWallUpgrade(state.walls[state.activeWall]);
        return true;
      }
    }
    state.activeWall = -1;
  }
  /* Кнопки-шестерёнки стен — открыть/закрыть панель */
  for (var wgi = 0; wgi < state.walls.length; wgi++) {
    var wgr = wallIconRect(state.walls[wgi]);
    if (sx >= wgr.x && sx <= wgr.x + wgr.w && sy >= wgr.y && sy <= wgr.y + wgr.h) {
      state.activeWall = (state.activeWall === wgi) ? -1 : wgi;
      state.activeCity = -1; state.tokMenu = -1;
      return true;
    }
  }
  /* Меню токамака открыто — ловим выбор снаряда или закрываем по тапу мимо */
  if (state.tokMenu >= 0 && state.cities[state.tokMenu] && state.cities[state.tokMenu].up.tok > 0) {
    var mc = state.cities[state.tokMenu], mb = tokMenuButtons(mc);
    for (var mi = 0; mi < mb.length; mi++) {
      var mbt = mb[mi];
      if (sx >= mbt.x && sx <= mbt.x + mbt.w && sy >= mbt.y && sy <= mbt.y + mbt.h) { mc.bonusAmmo = mbt.ammo; return true; }
    }
    state.tokMenu = -1; /* тап мимо — закрыть меню, продолжить обычный хит-тест */
  }
  /* Кнопки токамаков — открыть/закрыть меню перепривязки бонуса */
  for (var tb = 0; tb < state.cities.length; tb++) {
    var tc = state.cities[tb];
    if (!(tc.up.tok > 0)) continue;
    var trb = tokBtnRect(tc);
    if (sx >= trb.x && sx <= trb.x + trb.w && sy >= trb.y && sy <= trb.y + trb.h) {
      state.tokMenu = (state.tokMenu === tb) ? -1 : tb;
      state.activeCity = -1;
      return true;
    }
  }
  if (state.activeCity >= 0 && state.cities[state.activeCity]) {
    var btns = cityPanelButtons(state.cities[state.activeCity]);
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if (sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h) {
        if (!b.maxed && !b.locked && b.afford) buyCityUpgrade(state.cities[state.activeCity], b.def.key);
        return true;
      }
    }
    state.activeCity = -1; /* тап мимо панели — закрываем и пропускаем дальше */
    return false;
  }
  for (var c = 0; c < state.cities.length; c++) {
    var r = cityIconRect(state.cities[c]);
    if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) { state.activeCity = c; state.tokMenu = -1; state.activeWall = -1; return true; }
  }
  return false;
}

/* ═══════════════ CANVAS SETUP ═══════════════ */
var dpr = 1;
function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  scale = W / CFG.WORLD_W;
  lhScale = W / CFG.LH_REF_W; /* маяк не масштабируется вместе с миром */
  worldH = H / scale;
  if (state) {
    state.lighthouse.x = CFG.WORLD_W / 2;
    state.lighthouse.y = worldH - CFG.BASE_OFFSET - CFG.LIGHTHOUSE_OFFSET;
  }
  /* Regenerate terrain on resize */
  initCloudMap(W, H);
  _surfCvs = null; /* пересоздать поверхность */
}

function toScreen(px, py) {
  return [px * scale, py * scale];
}

function getBaseY() {
  return worldH - CFG.BASE_OFFSET;
}

/* ═══════════════ PHYSICS WORLD ═══════════════ */
var insideStep = false; /* Flag: true while world.step() is executing */

function initWorld() {
  world = planck.World(Vec2(0, 0));
  world.on('begin-contact', onContact);
}

function makePolygonVerts(sides, r) {
  if (sides === 0) return null;
  var v = [];
  for (var i = 0; i < sides; i++) {
    var a = (i / sides) * TAU - PI / 2;
    v.push(Vec2(Math.cos(a) * r, Math.sin(a) * r));
  }
  return v;
}

/* ═══════════════ ENEMY CREATION ═══════════════ */
function spawnEnemy(type, x, y, level, speedMult) {
  if (typeof level === 'undefined') level = 0; /* default: Lv.0 Обычный */
  if (typeof speedMult === 'undefined') speedMult = 1; /* множитель скорости из ноты */
  var def = E_TYPES[type];
  if (!def) return;
  var body = world.createBody({
    type: 'dynamic',
    position: Vec2(x, y),
    linearDamping: CFG.ENEMY_DAMPING,
    fixedRotation: true,
    bullet: false,
  });
  if (!body) return; /* guard */
  var shape;
  if (def.sides === 0) {
    shape = planck.Circle(def.r);
  } else if (def.sides === 4 && type === 'berserker') {
    shape = planck.Polygon([Vec2(0, -def.r), Vec2(def.r*0.7, 0), Vec2(0, def.r), Vec2(-def.r*0.7, 0)]);
  } else if (def.sides === 4) {
    shape = planck.Box(def.r * 0.85, def.r * 0.85);
  } else {
    var verts = makePolygonVerts(def.sides, def.r);
    shape = planck.Polygon(verts);
  }
  if (!shape) { world.destroyBody(body); return; } /* guard */
  body.createFixture(shape, {
    density: 2.0 + def.r * 3,
    friction: 0.3,
    restitution: 0.3,
    filterCategoryBits: CFG.CAT_ENEMY,
    /* Халфтрак наземный — снаряд маяка пролетает над ним (не сталкивается);
       убивают только турели (хитскан). maskBits 0 = ни с чем физически не сталкивается. */
    filterMaskBits: (type === 'halftrack') ? 0 : CFG.CAT_PROJ,
  });

  /* ФАЗА 12: Множители уровней */
  var levelHpMult = 1.0;
  var levelSpeedMult = 1.0;
  if (level === 1) { /* Ветеран */
    levelHpMult = 1.5;
    levelSpeedMult = 1.05;
  } else if (level === 2) { /* Элита */
    levelHpMult = 2.0;
    levelSpeedMult = 1.1;
  }

  var hpMult = state.nightHpMult || 1;
  var baseHp = (Array.isArray(def.hp)) ? def.hp[level] : def.hp;
  var enemy = {
    body: body,
    type: type,
    def: def,
    level: level, /* 0=Обычный, 1=Ветеран, 2=Элита */
    levelSpeedMult: levelSpeedMult, /* Применяется в moveEnemy() */
    noteSpeedMult: speedMult, /* скорость фигуры из ноты (разная у построений) */
    hp: baseHp * hpMult * levelHpMult,
    maxHp: baseHp * hpMult * levelHpMult,
    shielded: false,
    shieldTimer: 0,
    frozen: false,
    frozenTimer: 0,
    rageSpeed: 1,
    alive: true,
    flashTimer: 0,
    deathTimer: -1,
    wobblePhase: Math.random() * TAU,
    wobbleFreq: 1.8 + Math.random() * 1.4,
    wobbleAmp: 0.3 + Math.random() * 0.5,
    stepBob: 0,
    /* Lv.1 Soldier: Formation stacks */
    formationStacks: 0,
    /* Lv.2 Soldier: Block shield */
    blockTimer: 0,
    blockActive: false,
    /* Lv.1 Scout: Dodge */
    dodgeCooldown: 0,
    dodgeDir: null,
    /* Lv.2 Scout: Flicker */
    flickerTimer: 0,
    flickering: false,
    /* Lv.1 Berserker: Blood trail */
    trailParticles: [],
    /* Lv.2 Berserker: Rage explosion on death */
    rageExplosionTriggered: false,
    /* Броневые пластины: [верх, право, низ, лево] — по 1..N слоёв, гасят по 1 попаданию */
    plates: def.plates ? [def.plates, def.plates, def.plates, def.plates] : null,
    /* Горение (от взрыва бочки) */
    burning: false, burnTimer: 0, burnColor: null,
    _exploded: false,
  };
  body.setUserData({ kind: 'enemy', ref: enemy });
  state.enemies.push(enemy);
  return enemy;
}

/* ═══════════════ PLASMA SYSTEM FOR PROJECTILES ═══════════════ */
var PLASMA_SCALE = 4; /* Визуальный масштаб плазмы относительно физ. радиуса */

function initProjectilePlasma(proj, chargeRatio) {
  /* chargeRatio = 0..1 для preview снаряда на основе заряда */
  if (typeof chargeRatio === 'undefined') chargeRatio = 1; /* по умолчанию для летящих снарядов */

  /* Количество молний зависит от заряда:
     <20% = 1, 40% = 2, 60% = 3, 80% = 4, 90% = 5, 100% = 6 */
  var nodeCount = 1;
  if (chargeRatio >= 0.2 && chargeRatio < 0.4) nodeCount = 2;
  else if (chargeRatio >= 0.4 && chargeRatio < 0.6) nodeCount = 3;
  else if (chargeRatio >= 0.6 && chargeRatio < 0.8) nodeCount = 4;
  else if (chargeRatio >= 0.8 && chargeRatio < 0.9) nodeCount = 5;
  else if (chargeRatio >= 0.9) nodeCount = 6;

  /* Радиус молний растёт с зарядом (от 50% до 200% базового масштаба) */
  var chargeScale = 0.5 + chargeRatio * 1.5;
  var r = proj.radius * PLASMA_SCALE * chargeScale;

  var particleCount = 80;
  var speed = 0.02;

  for (var i = 0; i < particleCount; i++) {
    var angle = Math.random() * TAU;
    var dist = r * 0.2 + Math.random() * r * 0.7;
    proj.plasmaParticles.push({
      x: Math.cos(angle) * dist,
      y: Math.sin(angle) * dist,
      vx: (Math.random() - 0.5) * speed,
      vy: (Math.random() - 0.5) * speed
    });
  }

  for (var j = 0; j < nodeCount; j++) {
    proj.plasmaNodes.push({
      angle: (j / nodeCount) * TAU,
      spin: (Math.random() - 0.5) * 0.08,
      x: 0, y: 0
    });
  }

  /* Сохраняем параметры заряда для обновления */
  proj.chargeScale = chargeScale;
}

function updateProjectilePlasma(proj) {
  var chargeScale = proj.chargeScale || 1; /* по умолчанию для летящих снарядов */
  var r = proj.radius * PLASMA_SCALE * chargeScale;
  var innerR = r * 0.12;
  var outerR = r * 0.9;

  for (var i = 0; i < proj.plasmaParticles.length; i++) {
    var p = proj.plasmaParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    var dist = Math.sqrt(p.x * p.x + p.y * p.y);
    if (dist > outerR || dist < innerR) {
      p.vx *= -1;
      p.vy *= -1;
    }
  }

  for (var j = 0; j < proj.plasmaNodes.length; j++) {
    var n = proj.plasmaNodes[j];
    n.angle += n.spin;
    n.spin += (Math.random() - 0.5) * 0.01;
    n.spin = Math.max(-0.12, Math.min(0.12, n.spin));
    n.x = Math.cos(n.angle) * innerR;
    n.y = Math.sin(n.angle) * innerR;
  }
}

function drawProjectilePlasma(targetCtx, sx, sy, proj) {
  var chargeScale = proj.chargeScale || 1; /* по умолчанию для летящих снарядов */
  var r = proj.radius * PLASMA_SCALE * chargeScale;
  var color = proj.ammo.color;

  targetCtx.save();
  targetCtx.translate(sx, sy);
  targetCtx.scale(scale, scale);

  targetCtx.strokeStyle = color;
  targetCtx.lineWidth = 1.2 / scale;
  targetCtx.shadowColor = color;
  targetCtx.shadowBlur = 10 / scale;
  targetCtx.globalAlpha = 0.85;

  for (var ni = 0; ni < proj.plasmaNodes.length; ni++) {
    var n = proj.plasmaNodes[ni];
    var maxJump = r * 0.6;
    var px = n.x, py = n.y;
    var lastEdgeDist = Math.sqrt(px * px + py * py);

    targetCtx.beginPath();
    targetCtx.moveTo(n.x, n.y);

    /* Если молния привязана к врагу, тянем её туда */
    if (n.targetEnemy && n.targetEnemy.alive && n.enemyRelX !== undefined) {
      /* Рисуем молнию к врагу с изгибами */
      var segments = 8;
      for (var seg = 1; seg <= segments; seg++) {
        var t = seg / segments;
        var mx = n.x + n.enemyRelX * t;
        var my = n.y + n.enemyRelY * t;
        /* Добавляем случайное отклонение */
        if (seg < segments) {
          mx += (Math.random() - 0.5) * r * 0.3;
          my += (Math.random() - 0.5) * r * 0.3;
        }
        targetCtx.lineTo(mx, my);
      }
    } else {
      /* Обычная плазма без врага */
      for (var jump = 0; jump < 6; jump++) {
        var closest = null;
        var closestDist = maxJump;
        var closestEdge = 0;

        for (var pi = 0; pi < proj.plasmaParticles.length; pi++) {
          var p = proj.plasmaParticles[pi];
          var dx = p.x - px;
          var dy = p.y - py;
          var d = dx * dx + dy * dy;

          if (d < closestDist * closestDist && d > r * r * 0.003) {
            var edgeDist = Math.sqrt(p.x * p.x + p.y * p.y);
            if (edgeDist > lastEdgeDist) {
              closestDist = Math.sqrt(d);
              closest = p;
              closestEdge = edgeDist;
            }
          }
        }

        if (!closest) break;

        var xc = (px + closest.x) / 2 + (Math.random() - 0.5) * r * 0.2;
        var yc = (py + closest.y) / 2 + (Math.random() - 0.5) * r * 0.2;
        targetCtx.quadraticCurveTo(px, py, xc, yc);

        px = closest.x;
        py = closest.y;
        lastEdgeDist = closestEdge;
      }
    }

    targetCtx.stroke();
  }

  targetCtx.globalAlpha = 1;
  targetCtx.shadowBlur = 0;
  targetCtx.restore();
}

/* ═══════════════ EXPLOSION LIGHTNING ═══════════════ */
var explosionBolts = [];

function spawnExplosionBolts(worldX, worldY, color, radius, count) {
  for (var i = 0; i < count; i++) {
    var angle = (i / count) * TAU + (Math.random() - 0.5) * 0.3;
    var segments = [];
    var steps = 6 + Math.floor(Math.random() * 4);
    var px = 0, py = 0;
    for (var s = 0; s < steps; s++) {
      var frac = (s + 1) / steps;
      var tx = Math.cos(angle) * radius * frac;
      var ty = Math.sin(angle) * radius * frac;
      tx += (Math.random() - 0.5) * radius * 0.15;
      ty += (Math.random() - 0.5) * radius * 0.15;
      segments.push({ x1: px, y1: py, x2: tx, y2: ty });
      px = tx;
      py = ty;
    }
    explosionBolts.push({
      wx: worldX, wy: worldY,
      color: color,
      segments: segments,
      life: 0.25 + Math.random() * 0.2,
      maxLife: 0.35
    });
  }
}

/* ═══════════════ PROJECTILE CREATION ═══════════════ */
function createProjectileBody(fromX, fromY, dirX, dirY, speed, charge, ammoIdx) {
  var ammo = AMMO[ammoIdx];
  var r = CFG.PROJ_RADIUS * (ammo.id === 'explosive' ? 1.4 : ammo.id === 'scatter' ? 1.2 : ammo.id === 'piercing' ? 0.9 : 1);
  var body = world.createBody({
    type: 'dynamic',
    position: Vec2(fromX, fromY),
    bullet: true,
    linearDamping: 0,
  });
  if (!body) return null; /* guard */
  body.createFixture(planck.Circle(r), {
    density: 2.0,
    friction: 0,
    restitution: 0.7,
    filterCategoryBits: CFG.CAT_PROJ,
    filterMaskBits: CFG.CAT_ENEMY,
  });
  body.setLinearVelocity(Vec2(dirX * speed, dirY * speed));
  /* Range perk: reduces damping growth with distance.
     Снаряд-колония ИГНОРИРУЕТ прокачку — фиксированный дампинг, чтобы он не
     улетал при высокой дальности и стабильно основывал город. */
  var rangeLvl = perkLvl('range');
  var baseDamping = 0.8;
  if (!ammo.colony) {
    if (rangeLvl === 1) baseDamping = 0.5; /* Меньший дампинг */
    else if (rangeLvl === 2) baseDamping = 0.2; /* Минимальный дампинг */
  }
  body.setLinearDamping(baseDamping);
  var proj = {
    body: body,
    ammo: ammo,
    charge: charge,
    radius: r,
    lifetime: CFG.PROJ_LIFETIME,
    alive: true,
    pierceCount: ammo.id === 'piercing' ? 2 : 0,
    colony: !!ammo.colony, /* только снаряд-основатель оставляет наземный кратер */
    trail: [],
    boltTimer: 0,
    /* Плазменная система */
    plasmaParticles: [],
    plasmaNodes: []
  };
  /* Инициализируем плазму для снаряда с учётом заряда (колония — без overcharge) */
  var maxCh = CFG.MAX_CHARGE * ((!ammo.colony && perkLvl('overcharge') > 0) ? 1.5 : 1);
  var chRatio = Math.min(charge / maxCh, 1);
  initProjectilePlasma(proj, chRatio);
  body.setUserData({ kind: 'proj', ref: proj });
  state.projectiles.push(proj);
  return proj;
}

function fireProjectile(fromX, fromY, dirX, dirY, speed, charge, ammoIdx) {
  /* If called during physics step, defer it */
  if (insideStep) {
    deferredBodies.push({ type:'proj', fromX:fromX, fromY:fromY, dirX:dirX, dirY:dirY, speed:speed, charge:charge, ammoIdx:ammoIdx });
    return;
  }
  createProjectileBody(fromX, fromY, dirX, dirY, speed, charge, ammoIdx);
}

/* fire with multishot perk */
function doFire(lhx,lhy,nx,ny,speed,charge,ammoIdx){
  /* Базовый выстрел сразу */
  fireProjectile(lhx,lhy-0.6,nx,ny,speed,charge,ammoIdx);
  dischargeCities();
  /* Мультивыстрел: доп. параллельные снаряды веером (не для колонии) */
  var msLvl = perkLvl('multishot');
  if (msLvl > 0 && !(AMMO[ammoIdx] && AMMO[ammoIdx].colony)) {
    var baseAng = Math.atan2(ny, nx), spread = 0.10;
    for (var msi = 1; msi <= msLvl; msi++) {
      var off = (msi % 2 === 1 ? 1 : -1) * Math.ceil(msi / 2) * spread;
      var a2 = baseAng + off;
      fireProjectile(lhx, lhy - 0.6, Math.cos(a2), Math.sin(a2), speed, charge * 0.85, ammoIdx);
    }
  }
  /* Гигаконденсаторы/города дают бонусные выстрелы В ТОМ ЖЕ направлении, с задержкой.
     Сила конденсаторов усиливает заряд бонусных снарядов.
     Токамаки (по номеру) задают ТИП k-го бонусного выстрела — комбо-очередь. */
  var agg = cityAgg();
  var extra = (AMMO[ammoIdx] && AMMO[ammoIdx].colony) ? 0 : agg.extraShots; /* колония — без бонусных */
  var capBoost = 1 + 0.12 * agg.cap;
  var tokCities = [];
  for (var ti = 0; ti < state.cities.length; ti++) if (state.cities[ti].up.tok > 0) tokCities.push(state.cities[ti]);
  tokCities.sort(function(a,b){ return (a.tokNum||0) - (b.tokNum||0); });
  for(var k=0;k<extra;k++){
    var bAmmo = ammoIdx;
    var tc = tokCities[k];
    if (tc) { var ba = tc.bonusAmmo || 0; if (AMMO[ba] && !AMMO[ba].colony && !AMMO[ba].locked) bAmmo = ba; }
    state.volley.push({ delay:0.4 + 0.28*k, x:lhx, y:lhy-0.6, nx:nx, ny:ny, speed:speed*(1-0.03*k), charge:charge*capBoost, ammoIdx:bAmmo });
  }
}

/* ═══════════════ CHAIN LIGHTNING ═══════════════ */
function doChainLightning(cx,cy,damage,hitEnemy){
  var chains=perkLvl('chain_lightning');
  if(chains<=0)return;
  var hit=[hitEnemy];
  var px=cx,py=cy;
  for(var c=0;c<chains;c++){
    var best=null,bestD=16;
    for(var i=0;i<state.enemies.length;i++){
      var e=state.enemies[i];if(!e.alive)continue;
      var dominated=false;
      for(var h=0;h<hit.length;h++){if(hit[h]===e){dominated=true;break;}}
      if(dominated)continue;
      var ep=e.body.getPosition();
      var dx=ep.x-px,dy=ep.y-py,d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestD){bestD=d;best=e;}
    }
    if(!best)break;
    var bp=best.body.getPosition();
    state.lightningArcs.push({x1:px,y1:py,x2:bp.x,y2:bp.y,life:0.25});
    var chainDmg=damage*0.4;
    if(best.shielded)chainDmg*=0.5;
    best.hp-=chainDmg;best.flashTimer=0.1;
    spawnElectricSparks(bp.x,bp.y,'#00e5ff',3);
    if(best.hp<=0)killEnemy(best);
    hit.push(best);px=bp.x;py=bp.y;
  }
}

/* ═══════════════ COLLISION ═══════════════ */
function onContact(contact) {
  var fA = contact.getFixtureA();
  var fB = contact.getFixtureB();
  if (!fA || !fB) return;
  var bA = fA.getBody();
  var bB = fB.getBody();
  if (!bA || !bB) return;
  var udA = bA.getUserData();
  var udB = bB.getUserData();
  if (!udA || !udB) return;
  var proj = null, enemy = null, projBody = null, enemyBody = null;
  if (udA.kind === 'proj' && udB.kind === 'enemy') {
    proj = udA.ref; enemy = udB.ref;
    projBody = bA; enemyBody = bB;
  } else if (udB.kind === 'proj' && udA.kind === 'enemy') {
    proj = udB.ref; enemy = udA.ref;
    projBody = bB; enemyBody = bA;
  }
  if (!proj || !enemy || !proj.alive || !enemy.alive) return;
  /* Халфтрак снаряды не задевают вовсе (см. filterMaskBits в spawnEnemy) —
     этот контакт для него не сработает. */

  var vel = projBody.getLinearVelocity();
  var impactSpeed = vel.length();
  var _agg = cityAgg();
  var dmgMult = _agg.dmgMult * (1 + state.restBonus * _agg.restMult); /* электростанции + отдых×население */
  var damage = (impactSpeed * CFG.DMG_VEL_FACTOR + proj.charge * CFG.DMG_CHARGE_FACTOR) * dmgMult;

  /* crit perk */
  var critLvl = perkLvl('crit');
  var isCrit = false;
  if (critLvl > 0) {
    var critChance = critLvl === 1 ? 0.15 : 0.25;
    var critMult = critLvl === 1 ? 2.5 : 3.0;
    if (Math.random() < critChance) { damage *= critMult; isCrit = true; }
  }

  /* Lv.2 Soldier Block: frontal invulnerability (180° cone) */
  var epos = enemyBody.getPosition();
  if (enemy.type === 'soldier' && enemy.level === 2 && enemy.blockActive) {
    var eVel = enemyBody.getLinearVelocity();
    var eDir = Math.atan2(eVel.y, eVel.x);
    var projDir = Math.atan2(vel.y, vel.x);
    var angleDiff = Math.abs(eDir - projDir);
    if (angleDiff > Math.PI) angleDiff = TAU - angleDiff;
    if (angleDiff < Math.PI / 2) {
      /* Frontal hit while blocking — no damage */
      spawnHitParticles(epos.x, epos.y, '#4fc3f7', 12);
      addParticle(epos.x, epos.y, 0, 0, 1.0, 'rgba(79,195,247,0.5)', 0.3, 'ring');
      proj.alive = false;
      return;
    }
  }

  /* ── Броневые пластины: сторона попадания полностью гасит удар и отлетает ── */
  if (enemy.plates) {
    var ppos = projBody.getPosition();
    var pdx = ppos.x - epos.x, pdy = ppos.y - epos.y;
    var side = (Math.abs(pdx) > Math.abs(pdy)) ? (pdx > 0 ? 1 : 3) : (pdy > 0 ? 2 : 0);
    if (enemy.plates[side] > 0) {
      enemy.plates[side]--;
      spawnPlateDebris(epos.x, epos.y, side, enemy.def);
      spawnHitParticles(epos.x, epos.y, '#cfd8dc', 8);
      spawnElectricSparks(epos.x, epos.y, proj.ammo.color, 4);
      var kl0 = vel.length();
      if (kl0 > 0.01) {
        var ks = impactSpeed * 0.4 * enemyBody.getMass() * 0.3;
        enemyBody.applyLinearImpulse(Vec2(vel.x / kl0 * ks, vel.y / kl0 * ks), enemyBody.getWorldCenter());
      }
      if (proj.ammo.id === 'piercing') { proj.pierceCount--; if (proj.pierceCount <= 0) proj.alive = false; }
      else proj.alive = false;
      return; /* урон по телу не проходит, пока есть пластина с этой стороны */
    }
  }

  if (enemy.shielded) damage *= 0.5;

  /* Knockback impulse */
  var kLen = vel.length();
  if (kLen > 0.01) {
    var knockStr = (impactSpeed * 0.6 + proj.charge * 1.5) * enemyBody.getMass() * 0.3;
    enemyBody.applyLinearImpulse(
      Vec2(vel.x / kLen * knockStr, vel.y / kLen * knockStr),
      enemyBody.getWorldCenter()
    );
  }

  enemy.hp -= damage;
  enemy.flashTimer = 0.12;

  if (enemy.def.special === 'rage') {
    enemy.rageSpeed = Math.min(enemy.rageSpeed + 0.3, 2.5);
  }

  spawnHitParticles(epos.x, epos.y, proj.ammo.color, isCrit ? 14 : 8);
  spawnElectricSparks(epos.x, epos.y, proj.ammo.color, isCrit ? 8 : 4);

  var chargeNorm = proj.charge / CFG.MAX_CHARGE; /* 0-1 */
  var chMult = 0.5 + chargeNorm * 1.5;
  /* Тесла НЕ взрывается при попадании (весь урон — через молнии); остальные — плазма-взрыв */
  if (!proj.ammo.noExplode) {
    spawnPlasmaExplosion(epos.x, epos.y, proj.ammo.color, isCrit ? 15 : 10, chargeNorm);
    spawnExplosionBolts(epos.x, epos.y, proj.ammo.color, 2.0 * chMult, isCrit ? 10 : 6);
  }

  /* chain lightning */
  doChainLightning(epos.x, epos.y, damage, enemy);

  /* overcharge explosion on high charge */
  if (perkLvl('overcharge') > 0 && proj.charge >= CFG.MAX_CHARGE * 0.9 && !proj.ammo.noExplode) {
    handleExplosion(epos.x, epos.y, 2.0, damage * 0.4);
  }

  {
    proj.alive = false;
  }

  if (enemy.hp <= 0) {
    /* Lv.2 Berserker Rage explosion on death with rage>2.0x */
    if (enemy.type === 'berserker' && enemy.level === 2 && enemy.rageSpeed > 2.0 && !enemy.rageExplosionTriggered) {
      enemy.rageExplosionTriggered = true;
      var explPos = enemyBody.getPosition();
      spawnHitParticles(explPos.x, explPos.y, '#ff5722', 30);
      addParticle(explPos.x, explPos.y, 0, 0, 2.5, 'rgba(255,87,34,0.5)', 0.5, 'ring');
      /* Push back projectiles */
      for (var expi = 0; expi < state.projectiles.length; expi++) {
        var exProj = state.projectiles[expi];
        if (!exProj.alive) continue;
        var exPpos = exProj.body.getPosition();
        var exDx = exPpos.x - explPos.x, exDy = exPpos.y - explPos.y;
        var exDist = Math.sqrt(exDx*exDx + exDy*exDy);
        if (exDist < 2.5 && exDist > 0.1) {
          var pushStr = (1 - exDist / 2.5) * 50;
          exProj.body.applyLinearImpulse(Vec2(exDx / exDist * pushStr, exDy / exDist * pushStr), exProj.body.getPosition());
        }
      }
      /* Damage lighthouse if close */
      var lh = state.lighthouse;
      var lhDx = lh.x - explPos.x, lhDy = lh.y - explPos.y;
      var lhDist = Math.sqrt(lhDx*lhDx + lhDy*lhDy);
      if (lhDist < 5) {
        state.lives -= 1;
        state.shakeTimer = 0.4;
        state.shakeIntensity = 8;
        spawnHitParticles(lh.x, lh.y, '#ff1744', 16);
      }
    }
    killEnemy(enemy);
  }
}

function handleExplosion(cx, cy, radius, damage) {
  spawnExplosionParticles(cx, cy, 25);
  addLight(cx, cy, radius * 2, '#ff6d00', 0.5); // Освещение смога от взрыва
  /* Взрыв фугаса/перегрузки на уровне врагов — низкий (alt≈0.2), рвёт только нижний слой облаков */
  addCrater(cx, cy, radius * 1.3, Math.min(1, damage / 12), 0.2);
  state.shakeTimer = 0.25;
  state.shakeIntensity = 5;
  for (var i = state.enemies.length - 1; i >= 0; i--) {
    var e = state.enemies[i];
    if (!e.alive) continue;
    var ep = e.body.getPosition();
    var dx = ep.x - cx, dy = ep.y - cy;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < radius && dist > 0.01) {
      var dmg = damage * (1 - dist / radius);
      if (e.shielded) dmg *= 0.5;
      e.hp -= dmg;
      e.flashTimer = 0.12;
      var force = 20 / (dist + 0.4);
      e.body.applyLinearImpulse(
        Vec2(dx / dist * force * e.body.getMass(), dy / dist * force * e.body.getMass()),
        e.body.getWorldCenter()
      );
      if (e.hp <= 0) killEnemy(e);
    }
  }
}

function handleScatter(proj) {
  var pos = proj.body.getPosition();
  var vel = proj.body.getLinearVelocity();
  var baseAngle = Math.atan2(vel.y, vel.x);
  var spd = vel.length() * 0.65;
  /* Queue scatter sub-projectiles for creation after world.step() */
  for (var i = 0; i < 5; i++) {
    var a = baseAngle + (i - 2) * 0.35;
    deferredBodies.push({
      type: 'scatter',
      fromX: pos.x, fromY: pos.y,
      dirX: Math.cos(a), dirY: Math.sin(a),
      speed: spd,
      charge: proj.charge * 0.3,
    });
  }
}

function handleFreeze(cx, cy, radius) {
  spawnFreezeParticles(cx, cy, 18);
  for (var i = 0; i < state.enemies.length; i++) {
    var e = state.enemies[i];
    if (!e.alive) continue;
    var ep = e.body.getPosition();
    var dx = ep.x - cx, dy = ep.y - cy;
    if (dx*dx + dy*dy < radius*radius) {
      e.frozen = true;
      e.frozenTimer = 3.0;
    }
  }
}

function killEnemy(e) {
  if (e.deathTimer >= 0) return;
  e.alive = false;
  e.deathTimer = 0.45;
  state.score += e.def.pts;
  state.energy += e.def.nrg;
  var p = e.body.getPosition();
  spawnDeathParticles(p.x, p.y, e.def.color, e.def.r * 14);
  /* Бочка топлива: огненный взрыв при гибели */
  if (e.def.special === 'barrel' && !e._exploded) { e._exploded = true; fireExplosion(p.x, p.y); }
  /* vortex perk */
  var vLvl = perkLvl('vortex');
  if (vLvl > 0) {
    var vRadius = vLvl === 1 ? 3 : 4.5;
    var vForce = vLvl === 1 ? 8 : 15;
    var vDmg = vLvl === 2 ? 2 : 0;
    for (var i = 0; i < state.enemies.length; i++) {
      var e2 = state.enemies[i]; if (!e2.alive || e2 === e) continue;
      var ep = e2.body.getPosition(), dx = p.x - ep.x, dy = p.y - ep.y, dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < vRadius && dist > 0.1) {
        var str = vForce * (1 - dist / vRadius) * e2.body.getMass();
        e2.body.applyLinearImpulse(Vec2(dx / dist * str, dy / dist * str), e2.body.getWorldCenter());
        if (vDmg > 0) { e2.hp -= vDmg; e2.flashTimer = 0.08; if (e2.hp <= 0) killEnemy(e2); }
      }
    }
    addParticle(p.x, p.y, 0, 0, vRadius * 0.4, 'rgba(180,0,255,0.3)', 0.5, 'ring');
  }
}

/* ═══════════════ БРОНЯ, БОЧКА, ОГОНЬ ═══════════════ */
var plateDebris = [];  /* отлетевшие пластины брони */
var shrapnel = [];     /* осколки-projectiles от взрыва бочки */
var _burnTick = 0;

/* Отлетающая пластина брони со стороны side (0 верх,1 право,2 низ,3 лево) */
function spawnPlateDebris(wx, wy, side, def) {
  var dir = side === 0 ? [0, -1] : side === 1 ? [1, 0] : side === 2 ? [0, 1] : [-1, 0];
  var spd = 6 + Math.random() * 4;
  plateDebris.push({
    x: wx + dir[0] * def.r, y: wy + dir[1] * def.r,
    vx: dir[0] * spd + (Math.random() - 0.5) * 3,
    vy: dir[1] * spd + (Math.random() - 0.5) * 3,
    angle: Math.atan2(dir[1], dir[0]), va: (Math.random() - 0.5) * 12,
    life: 0.9, color: def.color, w: def.r * 1.1, h: def.r * 0.34
  });
}
function updatePlateDebris(dt) {
  for (var i = plateDebris.length - 1; i >= 0; i--) {
    var d = plateDebris[i]; d.life -= dt;
    if (d.life <= 0) { plateDebris.splice(i, 1); continue; }
    d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.92; d.vy *= 0.92; d.angle += d.va * dt;
  }
}

/* Поджиг врага */
function igniteEnemy(e) {
  if (!e.alive) return;
  e.burning = true;
  if (e.burnTimer < 2.6) e.burnTimer = 2.6;
  if (!e.burnColor) e.burnColor = e.def.color;
}

/* Огненный взрыв бочки: небо в розово-лаймовом неоне, поджог, ливень осколков */
function fireExplosion(x, y) {
  addLight(x, y, 9.5, '#ff2bd0', 1.1);   /* розовый неон в облаках */
  addLight(x, y, 7.5, '#aaff00', 0.95);  /* лаймовый неон */
  addLight(x, y, 5.0, '#ff6a00', 0.7);   /* оранжевое ядро */
  addCrater(x, y, 5.5, 1.0, 0.9);        /* рвёт все слои облаков */
  state.shakeTimer = 0.5; state.shakeIntensity = 11;
  addParticle(x, y, 0, 0, 4.5, 'rgba(255,43,208,0.35)', 0.5, 'ring');
  addParticle(x, y, 0, 0, 6.5, 'rgba(170,255,0,0.20)', 0.65, 'ring');
  for (var i = 0; i < 46; i++) {
    var a = Math.random() * TAU, s = 4 + Math.random() * 11;
    var col = (i % 3 === 0) ? '#ff8a00' : (i % 2 ? '#ff2bd0' : '#aaff00');
    addParticle(x, y, Math.cos(a) * s, Math.sin(a) * s, 0.22 + Math.random() * 0.35, col, 0.5 + Math.random() * 0.5);
  }
  /* Урон: ближних убиваем, дальних поджигаем и отбрасываем */
  var lethal = 3.2, ignite = 6.8;
  for (var j = state.enemies.length - 1; j >= 0; j--) {
    var e2 = state.enemies[j]; if (!e2.alive) continue;
    var ep = e2.body.getPosition(); var dx = ep.x - x, dy = ep.y - y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < lethal) { e2.hp -= 45; igniteEnemy(e2); if (e2.hp <= 0) killEnemy(e2); }
    else if (d < ignite) {
      igniteEnemy(e2); e2.hp -= 9;
      if (d > 0.1) { var f = (1 - d / ignite) * 26 / (d + 0.4); e2.body.applyLinearImpulse(Vec2(dx / d * f * e2.body.getMass(), dy / d * f * e2.body.getMass()), e2.body.getWorldCenter()); }
      if (e2.hp <= 0) killEnemy(e2);
    }
  }
  /* Несколько десятков осколков во все стороны — взрываются при попадании */
  var n = 30 + Math.floor(Math.random() * 12);
  for (var k = 0; k < n; k++) {
    var ang = (k / n) * TAU + (Math.random() - 0.5) * 0.25;
    var spd = 6 + Math.random() * 8;
    shrapnel.push({ x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 0.7 + Math.random() * 0.6, color: (k % 2 ? '#ff2bd0' : '#aaff00') });
  }
}

function shrapnelBurst(sx, sy, color) {
  addParticle(sx, sy, 0, 0, 1.0, hexToRgba(color, 0.5), 0.25, 'ring');
  spawnHitParticles(sx, sy, color, 6);
  for (var j = state.enemies.length - 1; j >= 0; j--) {
    var e = state.enemies[j]; if (!e.alive) continue;
    var ep = e.body.getPosition(); var dx = ep.x - sx, dy = ep.y - sy, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1.5) { e.hp -= 12 * (1 - d / 1.5); e.flashTimer = 0.1; igniteEnemy(e); if (e.hp <= 0) killEnemy(e); }
  }
}
function updateShrapnel(dt) {
  for (var i = shrapnel.length - 1; i >= 0; i--) {
    var s = shrapnel[i]; s.life -= dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.975; s.vy *= 0.975;
    var hit = false;
    for (var j = 0; j < state.enemies.length; j++) {
      var e = state.enemies[j]; if (!e.alive) continue;
      var ep = e.body.getPosition(); var dx = ep.x - s.x, dy = ep.y - s.y;
      var rr = e.def.r + 0.2;
      if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
    }
    if (s.life <= 0 || hit || s.x < -2 || s.x > CFG.WORLD_W + 2 || s.y < -2 || s.y > worldH + 2) {
      shrapnelBurst(s.x, s.y, s.color);
      shrapnel.splice(i, 1);
    }
  }
}

/* Горящие враги: урон во времени + подкраска облаков розово-лаймовым неоном */
function updateBurning(dt) {
  _burnTick += dt;
  var tick = _burnTick >= 0.11; if (tick) _burnTick = 0;
  for (var i = state.enemies.length - 1; i >= 0; i--) {
    var e = state.enemies[i]; if (!e.alive || !e.burning) continue;
    e.burnTimer -= dt;
    if (e.burnTimer <= 0) { e.burning = false; continue; }
    e.hp -= 6 * dt;
    var ep = e.body.getPosition();
    if (tick) {
      addLight(ep.x, ep.y, 3.2, '#ff2bd0', 0.26);
      addLight(ep.x, ep.y, 2.4, '#aaff00', 0.22);
      var a = Math.random() * TAU;
      addParticle(ep.x + Math.cos(a) * e.def.r * 0.5, ep.y - e.def.r * 0.4, Math.cos(a) * 1.5, -2 - Math.random() * 2.5, 0.25 + Math.random() * 0.2, e.burnColor, 0.4);
    }
    if (e.hp <= 0) killEnemy(e);
  }
}

/* ═══════════════ SEQUENCER PLAYER ═══════════════ */
/* Проигрывает таймлайн нот из state.sequencer */
function tickSequencer(dt) {
  if (!state.sequencer.active) return;

  state.sequencer.elapsed += dt;
  var notes = state.sequencer.notes;
  var idx = state.sequencer.noteIdx;

  /* Проигрываем все ноты, чьё время t <= elapsed */
  while (idx < notes.length && notes[idx].t <= state.sequencer.elapsed) {
    spawnEnemyFromNote(notes[idx]);
    idx++;
  }
  state.sequencer.noteIdx = idx;

  /* Когда все ноты закончились И прошло duration — останавливаем секвенсор */
  if (idx >= notes.length && state.sequencer.elapsed >= state.sequencer.duration) {
    state.sequencer.active = false;
  }
}

/* Спавнит врага из ноты секвенсора */
function spawnEnemyFromNote(note) {
  var def = E_TYPES[note.type];
  if (!def) return;

  /* x нормализованная 0..1 → worldX */
  var worldX = note.x * CFG.WORLD_W;

  /* y — если задана, используем, иначе дефолт -1 - def.r */
  var worldY = (note.y !== undefined) ? note.y : (-1 - def.r);

  /* ФАЗА 12: Передаём level из ноты в spawnEnemy */
  var level = note.level || 0;

  /* group — пока не используем */

  spawnEnemy(note.type, worldX, worldY, level, note.spd || 1);
}

/* ═══════════════ DEFERRED BODY PROCESSING ═══════════════ */
function processDeferredBodies() {
  while (deferredBodies.length > 0) {
    var item = deferredBodies.shift();
    if (item.type === 'proj') {
      createProjectileBody(item.fromX, item.fromY, item.dirX, item.dirY, item.speed, item.charge, item.ammoIdx);
    } else if (item.type === 'scatter') {
      /* Create scatter sub-projectile */
      var body = world.createBody({ type:'dynamic', position:Vec2(item.fromX, item.fromY), bullet:true, linearDamping:0 });
      if (!body) continue;
      body.createFixture(planck.Circle(0.18), { density:1.5, friction:0, restitution:0.6, filterCategoryBits:CFG.CAT_PROJ, filterMaskBits:CFG.CAT_ENEMY });
      body.setLinearVelocity(Vec2(item.dirX * item.speed, item.dirY * item.speed));
      var sp = { body:body, ammo:AMMO[0], charge:item.charge, radius:0.18, lifetime:1.8, alive:true, pierceCount:0, trail:[], boltTimer:0, plasmaParticles:[], plasmaNodes:[] };
      var spMaxCh = CFG.MAX_CHARGE * (perkLvl('overcharge') > 0 ? 1.5 : 1);
      var spChRatio = Math.min(item.charge / spMaxCh, 1);
      initProjectilePlasma(sp, spChRatio);
      body.setUserData({ kind:'proj', ref:sp });
      state.projectiles.push(sp);
    }
  }
}

function processDeferredDestroy() {
  while (deferredDestroy.length > 0) {
    var body = deferredDestroy.shift();
    try { world.destroyBody(body); } catch(_e) { /* already destroyed */ }
  }
}

/* ═══════════════ SINGULARITY ═══════════════ */
function spawnSingularity(x, y) {
  state.singularities.push({ x:x, y:y, life:2.0, maxLife:2.0 });
}
function updateSingularities(dt) {
  for (var i = state.singularities.length - 1; i >= 0; i--) {
    var s = state.singularities[i]; s.life -= dt;
    if (s.life <= 0) { state.singularities.splice(i, 1); continue; }
    var radius = 3.5, pullForce = 12;
    for (var j = 0; j < state.enemies.length; j++) {
      var e = state.enemies[j]; if (!e.alive) continue;
      var ep = e.body.getPosition(), dx = s.x - ep.x, dy = s.y - ep.y, dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < radius && dist > 0.2) {
        var str = pullForce * (1 - dist / radius) * e.body.getMass() * dt * 3;
        e.body.applyForceToCenter(Vec2(dx / dist * str, dy / dist * str));
      }
    }
    if (Math.random() < 0.3) addParticle(s.x + (Math.random()-0.5)*2, s.y + (Math.random()-0.5)*2, 0, 0, 0.05, '#b388ff', 0.3);
  }
}

/* ═══════════════ TESLA COIL ═══════════════ */
function updateTesla(dt) {
  var tLvl = perkLvl('tesla'); if (tLvl <= 0) return;
  var interval = tLvl === 1 ? 3 : tLvl === 2 ? 2 : 1.2;
  var dmg = tLvl === 1 ? 2 : tLvl === 2 ? 4 : 7;
  state.teslaTimer += dt;
  if (state.teslaTimer >= interval) {
    state.teslaTimer = 0;
    var lh = state.lighthouse, best = null, bestD = 999;
    for (var i = 0; i < state.enemies.length; i++) {
      var e = state.enemies[i]; if (!e.alive) continue;
      var ep = e.body.getPosition(), dx = ep.x - lh.x, dy = ep.y - lh.y, d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best && bestD < 20) {
      var bp = best.body.getPosition();
      state.lightningArcs.push({ x1:lh.x, y1:lh.y, x2:bp.x, y2:bp.y, life:0.3 });
      best.hp -= dmg; best.flashTimer = 0.15;
      spawnElectricSparks(bp.x, bp.y, '#00e5ff', 5);
      if (best.hp <= 0) killEnemy(best);
    }
  }
}

/* ═══════════════ RANGE PERK ═══════════════ */
/* Range perk reduces how much damping grows with distance from lighthouse.
   Damping is applied per projectile in projectile spawn, not here. */

/* ═══════════════ PARTICLES ═══════════════ */
function addParticle(x, y, vx, vy, r, color, life, type) {
  if (state.particles.length >= CFG.PARTICLE_MAX) state.particles.shift();
  state.particles.push({ x:x, y:y, vx:vx, vy:vy, r:r, color:color, life:life, maxLife:life, type:type||'circle' });
}
function spawnHitParticles(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random()*TAU, s = 2+Math.random()*5;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, 0.07+Math.random()*0.07, color, 0.4+Math.random()*0.3);
  }
}
function spawnDeathParticles(x, y, color, n) {
  for (var i = 0; i < (n|0); i++) {
    var a = Math.random()*TAU, s = 1+Math.random()*5;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, 0.09+Math.random()*0.13, color, 0.5+Math.random()*0.5, 'square');
  }
}
function spawnExplosionParticles(x, y, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random()*TAU, s = 3+Math.random()*7;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, 0.1+Math.random()*0.15, '#ff6d00', 0.3+Math.random()*0.4);
  }
  addParticle(x, y, 0, 0, 2.5, 'rgba(255,109,0,0.3)', 0.4, 'ring');
}
function spawnFreezeParticles(x, y, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random()*TAU, s = 1+Math.random()*3;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, 0.05+Math.random()*0.08, '#80deea', 0.6+Math.random()*0.4, 'diamond');
  }
}
function spawnElectricSparks(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random()*TAU, s = 4+Math.random()*6;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, 0.04+Math.random()*0.04, color, 0.15+Math.random()*0.15, 'bolt');
  }
}
function spawnPlasmaExplosion(x, y, color, n, charge) {
  /* charge от 0 до 1, по умолчанию 0.5 */
  if (charge === undefined) charge = 0.5;
  var chargeMult = 0.5 + charge * 1.5; /* 0.5-2.0 в зависимости от заряда */

  /* Визуально в 4 раза мощнее, масштабируется от заряда */
  for (var i = 0; i < n * 4; i++) {
    var a = Math.random()*TAU, s = (3+Math.random()*8) * chargeMult;
    addParticle(x, y, Math.cos(a)*s, Math.sin(a)*s, (0.12+Math.random()*0.15) * chargeMult, color, 0.5+Math.random()*0.4);
  }
  /* Больше колец, размер зависит от заряда */
  addParticle(x, y, 0, 0, 2.5 * chargeMult, hexToRgba(color, 0.4), 0.5, 'ring');
  addParticle(x, y, 0, 0, 4.0 * chargeMult, hexToRgba(color, 0.2), 0.6, 'ring');
  addLight(x, y, 7.0 * chargeMult, color, 1.2); // Свет зависит от заряда
  /* Яма в облаках: слабый заряд рвётся низко (только нижний слой),
     полный заряд детонирует высоко и пробивает слои вниз. */
  addCrater(x, y, 3.5 * chargeMult, 0.35 + charge * 0.65, 0.15 + charge * 0.8);

  /* Взрывная волна - физически в 2 раза сильнее */
  var explosionRadius = 4.4 * chargeMult;
  var explosionDamage = 6 * chargeMult;
  state.shakeTimer = 0.4 * chargeMult;
  state.shakeIntensity = 8 * chargeMult;

  for (var j = state.enemies.length - 1; j >= 0; j--) {
    var e = state.enemies[j];
    if (!e.alive) continue;
    var ep = e.body.getPosition();
    var dx = ep.x - x, dy = ep.y - y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < explosionRadius && dist > 0.01) {
      var dmg = explosionDamage * (1 - dist / explosionRadius);
      if (e.shielded) dmg *= 0.5;
      e.hp -= dmg;
      e.flashTimer = 0.12;
      /* Отталкивание - в 2 раза сильнее */
      var force = 30 / (dist + 0.4);
      e.body.applyLinearImpulse(
        Vec2(dx / dist * force * e.body.getMass(), dy / dist * force * e.body.getMass()),
        e.body.getWorldCenter()
      );
      if (e.hp <= 0) killEnemy(e);
    }
  }
}
function addLight(x, y, radius, color, life) {
  state.lights.push({ x:x, y:y, radius:radius, color:color, life:life, maxLife:life });
}
/*
 * Взрыв = ВОЛНА ДЕКОМПРЕССИИ: физически разгоняет клубы облаков наружу.
 *   maxRadius — базовый радиус (мировые юниты)
 *   power     — сила 0..1 ; alt не используется.
 * Дыра открывается движением клубов и сама затягивается, когда они приплывают
 * обратно (никаких «нарисованных» дыр). Сильный взрыв бьёт шире и мощнее.
 */
function addCrater(wx, wy, maxRadius, power, alt) {
  if (tw === 0) return;
  power = (power === undefined) ? 1 : (power < 0 ? 0 : power > 1 ? 1 : power);
  var sc = toScreen(wx, wy);
  var sx = sc[0], sy = sc[1];
  var blastR = maxRadius * scale * (1.5 + power * 1.4);
  /* вырезает временную дыру в карте высот облаков (carveField) + видимое
     ударное кольцо декомпрессии */
  craters.push({ x: sx, y: sy, r: blastR * 0.15, maxR: blastR, life: 0.45, maxLife: 0.45, power: power });
}

/* Ударные кольца декомпрессии (визуал) */
function updateCraters(dt) {
  for (var ci = craters.length - 1; ci >= 0; ci--) {
    var c = craters[ci];
    c.r += (c.maxR - c.r) * 6 * dt;
    c.life -= dt;
    if (c.life <= 0) craters.splice(ci, 1);
  }
}
function drawCloudShocks() {
  if (craters.length === 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < craters.length; i++) {
    var c = craters[i], a = Math.max(0, c.life / c.maxLife);
    ctx.strokeStyle = 'rgba(200,225,255,' + (a * 0.5) + ')';
    ctx.lineWidth = 2 + c.power * 3;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function updateLights(dt) {
  for (var i = state.lights.length - 1; i >= 0; i--) {
    state.lights[i].life -= dt;
    if (state.lights[i].life <= 0) state.lights.splice(i, 1);
  }
}
function updateParticles(dt) {
  for (var i = state.particles.length - 1; i >= 0; i--) {
    var p = state.particles[i];
    p.life -= dt;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
  }
}

/* ═══════════════ WAVE SYSTEM ═══════════════ */
function startWave() {
  state.wave++;
  state.waveActive = true;
  state.activeCity = -1; /* закрыть панель прокачки города при старте волны */
  state.tokMenu = -1;    /* и меню токамака */
  state.activeWall = -1; /* и панель стены */
  /* Если выбран снаряд «Колония» — даём 5с выбрать боевой из первых трёх */
  if (AMMO[state.selectedAmmo] && AMMO[state.selectedAmmo].colony) {
    state.ammoGrace = 5;
    buildAmmoBar();
  } else {
    state.ammoGrace = 0;
  }

  /* Каждая волна двойная: нечётная = ДЕНЬ, чётная = НОЧЬ */
  var isNight = (state.wave % 2 === 0);
  var dayWave = isNight ? state.wave / 2 : Math.ceil(state.wave / 2);
  var waveIdx = (dayWave - 1) % WAVE_SEQUENCES.length;
  var cycleNum = Math.floor((dayWave - 1) / WAVE_SEQUENCES.length) + 1; /* Цикл: 1, 2, 3... */
  var cycleMult = 1 + (cycleNum - 1) * 0.4;

  /* Бонус отдыха уже зафиксирован в момент нажатия REST (тем больше, чем раньше
     отдохнул — по ОСТАВШЕМУСЯ до волны времени). Если не отдыхали — 0. */
  state.resting = false;
  var rested = state.restBonus || 0;
  var boostTxt = rested > 0.005 ? '  +' + Math.round(rested * 100) + '% ⚔' : '';

  /* Попап смены дня/ночи + анонс волны (с названием секвенции) */
  var seqName = (WAVE_SEQUENCES[waveIdx] || {}).name || '';
  var seqTag = seqName ? (' · ' + seqName) : '';
  if (isNight) {
    showWaveText('🌙 НОЧЬ ' + dayWave + seqTag + boostTxt);
    state.nightHpMult = 2; /* враги в 2 раза сильнее */
  } else {
    showWaveText('☀ ДЕНЬ ' + dayWave + seqTag + boostTxt);
    state.nightHpMult = 1;
  }
  /* cloudDarkMult теперь ведёт непрерывный цикл дня/ночи (см. update) */

  /* refresh shield charges */
  var sg = perkLvl('shield_gen');
  state.shieldCharges = sg > 0 ? sg : 0;

  /* Загружаем секвенцию из WAVE_SEQUENCES */
  var seq = WAVE_SEQUENCES[waveIdx];
  var expandedNotes = expandFormations(seq);

  /* Численность врагов ×enemyCountMult — дублируем ноты ДОП. РЯДАМИ позади (тот же
     x, чуть позже по времени), чтобы фигуры оставались фигурами, а не кашей.
     Тяжёлые боссы не дублируются (иначе стена). */
  var HEAVY_DUP = { juggernaut: true, tank: true, general: true, halftrack: true };
  var cm = Math.max(1, Math.round(DIFFICULTY.enemyCountMult));
  var doubled = [];
  for (var dbi = 0; dbi < expandedNotes.length; dbi++) {
    var dn = expandedNotes[dbi];
    doubled.push(dn);
    if (!HEAVY_DUP[dn.type]) {
      for (var rep = 1; rep < cm; rep++) {
        doubled.push({ t: dn.t + 0.5 * rep, type: dn.type, x: dn.x, y: dn.y, level: dn.level, group: dn.group, spd: dn.spd });
      }
    }
  }
  doubled.sort(function(a, b){ return a.t - b.t; });
  expandedNotes = doubled;

  /* ФАЗА 12: Применяем уровни врагов в зависимости от цикла */
  if (cycleNum >= 2) {
    for (var ni = 0; ni < expandedNotes.length; ni++) {
      var note = expandedNotes[ni];
      if (!note.level || note.level === 0) {
        if (cycleNum === 2) {
          note.level = 1; /* Цикл 2 → Lv.1 Ветеран */
        } else if (cycleNum >= 3) {
          note.level = 2; /* Цикл 3+ → Lv.2 Элита */
        }
      }
    }
  }

  /* Применяем модификаторы волны */
  var mods = seq.modifiers || {};
  var hpMult = (mods.hpMult || 1.0) * cycleMult * DIFFICULTY.hpScale;
  if (isNight) hpMult *= 2;
  state.nightHpMult = hpMult;

  /* Запускаем секвенсор */
  state.sequencer.active = true;
  state.sequencer.elapsed = 0;
